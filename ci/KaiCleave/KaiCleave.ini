# KaiCleave v0.3.0-heavy-block-ui
# Bannerlord 1.3.15.110062 / The Old Realms 1.3.15
# Press F10 in game to change settings and save them immediately.
# KaiTOR Coop: battle peers keep local player authority; the /server /coopsave process stays passive.
# NPC cleave remains disabled by default.

[General]
Enabled=true
PlayerOnly=true
MaxTargetsPerSwing=12
DebugLogging=true
ShowLoadMessage=true

[Cleave]
# Full damage per accepted target; no progressive damage falloff.
FullMomentum=true
ForceSlicedThrough=true
# Recommended false: swings cleave, thrusts do not.
AllowThrusts=false
AllowFriendlyTargets=false

[HeavyBlock]
# Only two-handed weapons and polearms are eligible for these two options.
# One-handed weapons always keep normal Bannerlord block stopping behavior.
HeavyShieldContinue=true
# More aggressive option; OFF by default because it changes parry/duel balance more strongly.
HeavyWeaponBlockContinue=false

[Weapons]
OneHandedSword=true
TwoHandedSword=true
OneHandedAxe=true
TwoHandedAxe=true
OneHandedPolearm=true
TwoHandedPolearm=true
LowGripPolearm=true
Mace=false
TwoHandedMace=false
Dagger=false
Pick=false
