# KaiCleave v0.2.1-coop-beta
# Bannerlord 1.3.15.110062 / The Old Realms 1.3.15
# KaiTOR Coop: same module/version on server and every client.
# Battle peers keep combat patches active, but cleave is accepted only for the locally-owned
# registered player Hero. The /server /coopsave campaign process stays combat-passive.
# For Coop safety v0.2.1 treats PlayerOnly=false as player-only until NPC authority support is added.

[General]
Enabled=true
PlayerOnly=true
MaxTargetsPerSwing=12
DebugLogging=true
ShowLoadMessage=true

[Cleave]
# Full damage per accepted target: preserve pre-armor swing momentum.
FullMomentum=true
# Force weapon traversal through valid enemy hits.
ForceSlicedThrough=true
# Recommended false: cleave swings only, not thrusts.
AllowThrusts=false
AllowFriendlyTargets=false

[Weapons]
OneHandedSword=true
TwoHandedSword=true
OneHandedAxe=true
TwoHandedAxe=true
OneHandedPolearm=true
TwoHandedPolearm=true
LowGripPolearm=true
Mace=false
TwoHandedMace=false
Dagger=false
Pick=false
