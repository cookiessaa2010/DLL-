name: KaiTOR Online Bannerlord 1.3.15 API Probe

on:
  push:
    branches:
      - kaitor-online-4p
    paths:
      - 'projects/KaiTOROnline/probes/Bannerlord1315ApiProbe/**'
      - '.github/workflows/kaitor-online-1315-api-probe.yml'
  workflow_dispatch:

jobs:
  build-api-probe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore projects/KaiTOROnline/probes/Bannerlord1315ApiProbe/Bannerlord1315ApiProbe.csproj

      - name: Build against Bannerlord 1.3.15.110062 references
        run: dotnet build projects/KaiTOROnline/probes/Bannerlord1315ApiProbe/Bannerlord1315ApiProbe.csproj --configuration Release --no-restore --verbosity normal
