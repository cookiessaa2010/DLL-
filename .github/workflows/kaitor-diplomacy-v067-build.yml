name: KaiTOR Diplomacy v0.6.7.0 TOR Child Education Build

on:
  push:
    branches:
      - 'kaitor-diplomacy-child-education-v0.6.7'
    paths:
      - 'projects/KaiTORDiplomacy/**'
      - '.github/workflows/kaitor-diplomacy-v067-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build against Bannerlord 1.3.15.110062 references
        shell: pwsh
        run: |
          dotnet build projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj `
            -c Release `
            -p:UseBannerlordReferenceAssemblies=true `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate v0.6.7 child education contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $src = Join-Path $root 'src'
          $runtime = Join-Path $src 'Runtime'
          $module = Join-Path $root 'module'
          $dll = Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll'

          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing DLL: $dll" }

          $sub = Get-Content (Join-Path $src 'SubModule.cs') -Raw
          if (-not $sub.Contains('KaiTOR Diplomacy v0.6.7.0 child-education campaign start.')) { throw 'Wrong startup marker.' }
          if ($sub.Contains('new KaiDynasticMarriageBehavior()')) { throw 'Dynastic Marriage must not be registered.' }
          if (-not $sub.Contains('new KaiDawiDynastyBehavior()')) { throw 'Dawi abstract family behavior is not registered.' }
          if (-not $sub.Contains('new KaiLoreEducationBehavior()')) { throw 'TOR child education behavior is not registered.' }

          $moduleXml = Get-Content (Join-Path $module 'SubModule.xml') -Raw
          if ($moduleXml -notmatch '<Version value="v0\.6\.7\.0"') { throw 'SubModule version mismatch.' }

          $education = Get-Content (Join-Path $runtime 'KaiLoreEducationBehavior.cs') -Raw
          foreach ($token in @(
            'ApplySyntheticFullTorPath',
            'DescribeTorCoverage',
            'CHILD_TOR_FULL_PATH',
            'CHILD_EDUCATION_COVERAGE_FAIL',
            'TorProfessionEffectBridge.IsProfessionSupported',
            'TorProfessionEffectBridge.IsSpecializationSupported'
          )) {
            if (-not $education.Contains($token)) { throw "Child education contract missing: $token" }
          }

          $bridge = Get-Content (Join-Path $runtime 'TorProfessionEffectBridge.cs') -Raw
          foreach ($token in @(
            'SupportedProfessions',
            'SupportedSpecializations',
            'option_3_dw_rune_smith',
            'option_3_gs_path_of_shaman',
            'bloodline_necrarch',
            'priest_sigmar',
            'lore_of_fire'
          )) {
            if (-not $bridge.Contains($token)) { throw "TOR profession bridge contract missing: $token" }
          }

          $commands = Get-Content (Join-Path $runtime 'KaiChildTestCommands.cs') -Raw
          foreach ($token in @(
            'spawn_empire',
            'spawn_bretonnia',
            'spawn_sylvania',
            'spawn_mousillon',
            'spawn_asrai',
            'spawn_eonir',
            'spawn_dawi',
            'spawn_greenskin',
            'auto_path',
            'coverage'
          )) {
            if (-not $commands.Contains($token)) { throw "Child test command missing: $token" }
          }

          $dawi = Get-Content (Join-Path $runtime 'KaiDawiDynastyBehavior.cs') -Raw
          if (-not $dawi.Contains('DAWI_ABSTRACT_UNION')) { throw 'Dawi abstract family union marker missing.' }
          if ($dawi.Contains('UnionTrustBonus') -or $dawi.Contains('UnionNapDays') -or $dawi.Contains('UnionRelationBonus')) {
            throw 'Removed dynastic diplomacy bonuses still exist.'
          }
          if (-not $dawi.Contains('ApplySyntheticFullTorPath')) { throw 'Dawi adult heir TOR education package missing.' }

          Write-Host 'KaiTOR Diplomacy v0.6.7.0 child education contracts: PASS'

      - name: Assemble test module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $package = 'artifact/KaiTOR_Diplomacy'
          $bin = Join-Path $package 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item (Join-Path $root 'module/*') $package -Recurse -Force
          Copy-Item (Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll') (Join-Path $bin 'KaiTOR_Diplomacy.dll') -Force
          Copy-Item (Join-Path $root 'build/bin/Win64_Shipping_Client/Bannerlord.UIExtenderEx.dll') (Join-Path $bin 'Bannerlord.UIExtenderEx.dll') -Force

      - name: Upload test module
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-Diplomacy-v0.6.7.0-TORChildEducation-Test
          path: artifact/KaiTOR_Diplomacy
          if-no-files-found: error
          retention-days: 30
