name: Build Kai TOR Unlimited Companions

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'kaitor-unlimited-companions/**'
      - '.github/workflows/build-kaitor-unlimited-companions.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore kaitor-unlimited-companions/src/KaiTOR_UnlimitedCompanions/KaiTOR_UnlimitedCompanions.csproj

      - name: Build
        run: dotnet build kaitor-unlimited-companions/src/KaiTOR_UnlimitedCompanions/KaiTOR_UnlimitedCompanions.csproj -c Release --no-restore

      - name: Validate v1.3.15.11 contracts
        shell: bash
        run: |
          set -euo pipefail
          SRC="kaitor-unlimited-companions/src/KaiTOR_UnlimitedCompanions"
          MODULE="kaitor-unlimited-companions/Module/SubModule.xml"
          BUILD="$SRC/bin/Release/net472"

          test -f "$BUILD/KaiTOR_UnlimitedCompanions.dll"
          test -f "$BUILD/Bannerlord.UIExtenderEx.dll"

          grep -q 'v1.3.15.11' "$MODULE"
          if grep -q 'DependedModule Id="Bannerlord.UIExtenderEx"' "$MODULE"; then
            echo "External UIExtenderEx dependency must not be present in single-module build."
            exit 1
          fi

          grep -q 'ReserveSlots = 200' "$SRC/SubModule.cs"
          grep -q 'Clan.CompanionLimit' "$SRC/SubModule.cs"
          grep -q 'UIExtender.Create("KaiTOR_UnlimitedCompanions")' "$SRC/SubModule.cs"
          grep -q 'DoNotUseGeneratedPrefabs' "$SRC/SubModule.cs"
          grep -q 'CompanionBulkRecallMixin' "$SRC/CompanionBulkRecallUI.cs"
          grep -q 'InsertType.Child' "$SRC/CompanionBulkRecallUI.cs"
          grep -q 'Index => int.MaxValue' "$SRC/CompanionBulkRecallUI.cs"
          grep -q 'IsVisible=\\\"@IsMembersSelected\\\"' "$SRC/CompanionBulkRecallUI.cs"
          grep -q 'BaseViewModelMixin<ClanManagementVM>' "$SRC/CompanionBulkRecallUI.cs"
          grep -q 'TeleportHeroAction.ApplyDelayedTeleportToParty' "$SRC/CompanionBulkRecallUI.cs"
          grep -q 'IsMainClanMemberAvailableForRecall' "$SRC/CompanionBulkRecallUI.cs"
          grep -q 'KaiTORBulkRecallButton' "$SRC/CompanionBulkRecallUI.cs"

          echo "v1.3.15.11 single-module contracts: PASS"

      - name: Fetch UIExtenderEx license
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/BUTR/Bannerlord.UIExtenderEx/v2.13.3/LICENSE" \
            -o UIExtenderEx-LICENSE.txt
          grep -q 'GNU LESSER GENERAL PUBLIC LICENSE' UIExtenderEx-LICENSE.txt

      - name: Package single module
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/KaiTOR_UnlimitedCompanions"
          BUILD="kaitor-unlimited-companions/src/KaiTOR_UnlimitedCompanions/bin/Release/net472"

          mkdir -p "$ROOT/bin/Win64_Shipping_Client"

          cp kaitor-unlimited-companions/Module/SubModule.xml "$ROOT/SubModule.xml"
          cp "$BUILD/KaiTOR_UnlimitedCompanions.dll" "$ROOT/bin/Win64_Shipping_Client/KaiTOR_UnlimitedCompanions.dll"
          cp "$BUILD/Bannerlord.UIExtenderEx.dll" "$ROOT/bin/Win64_Shipping_Client/Bannerlord.UIExtenderEx.dll"
          cp UIExtenderEx-LICENSE.txt "$ROOT/UIExtenderEx-LICENSE.txt"

          cat > "$ROOT/THIRD_PARTY_NOTICES.txt" <<'EOF'
          Bannerlord.UIExtenderEx v2.13.3
          Source: https://github.com/BUTR/Bannerlord.UIExtenderEx
          License: GNU Lesser General Public License v3.0 (LGPL-3.0)
          Included as an unmodified runtime library.
          See UIExtenderEx-LICENSE.txt.
          EOF

          test -f "$ROOT/SubModule.xml"
          test -f "$ROOT/bin/Win64_Shipping_Client/KaiTOR_UnlimitedCompanions.dll"
          test -f "$ROOT/bin/Win64_Shipping_Client/Bannerlord.UIExtenderEx.dll"
          test -f "$ROOT/UIExtenderEx-LICENSE.txt"

          if find "$ROOT" -type f \( -iname '*.pdb' -o -iname '*.cs' -o -iname '*.csproj' \) | grep -q .; then
            echo "Release package contains forbidden development files."
            exit 1
          fi

          cd dist
          zip -r "KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST.zip" KaiTOR_UnlimitedCompanions
          sha256sum "KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST.zip" > "KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST.zip.sha256"

      - name: Verify archive layout
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST.zip
          COUNT=$(unzip -Z1 dist/KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST.zip | awk -F/ 'NF>1 {print $1}' | sort -u | wc -l)
          test "$COUNT" -eq 1
          unzip -Z1 dist/KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST.zip | grep -q '^KaiTOR_UnlimitedCompanions/SubModule.xml$'
          unzip -Z1 dist/KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST.zip | grep -q '^KaiTOR_UnlimitedCompanions/bin/Win64_Shipping_Client/KaiTOR_UnlimitedCompanions.dll$'
          unzip -Z1 dist/KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST.zip | grep -q '^KaiTOR_UnlimitedCompanions/bin/Win64_Shipping_Client/Bannerlord.UIExtenderEx.dll$'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST
          path: |
            dist/KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST.zip
            dist/KaiTOR-UnlimitedCompanions-v1.3.15.11-LIVE-TEST.zip.sha256
          if-no-files-found: error
