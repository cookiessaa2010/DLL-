name: KaiTOR Diplomacy v0.6.6.0 Core Clean Build

on:
  push:
    branches:
      - 'kaitor-diplomacy-core-clean-v0.6.6'
    paths:
      - 'projects/KaiTORDiplomacy/**'
      - '.github/workflows/kaitor-diplomacy-v066-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build against Bannerlord 1.3.15.110062 references
        shell: pwsh
        run: |
          dotnet build projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj `
            -c Release `
            -p:UseBannerlordReferenceAssemblies=true `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate core-clean contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $src = Join-Path $root 'src'
          $runtime = Join-Path $src 'Runtime'
          $module = Join-Path $root 'module'
          $moduleData = Join-Path $module 'ModuleData'
          $dll = Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll'

          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing DLL: $dll" }

          $sub = Get-Content (Join-Path $src 'SubModule.cs') -Raw
          if (-not $sub.Contains('KaiTOR Diplomacy v0.6.6.0 core-clean campaign start.')) { throw 'Wrong startup marker.' }
          foreach ($forbidden in @(
            'new KaiDawiWomenBehavior()',
            'new KaiVampirePopulationBehavior()',
            'new KaiGreenskinPopulationBehavior()',
            'new KaiRealmHouseGrowthBehavior()',
            'InstallHeroDeathWrapper',
            'IsLifeDeathCycleDisabled = false'
          )) {
            if ($sub.Contains($forbidden)) { throw "Forbidden world mutation is still registered: $forbidden" }
          }
          if (-not $sub.Contains('new KaiDawiDynastyBehavior()')) { throw 'Abstract Dawi dynasty behavior is not registered.' }

          $moduleXml = Get-Content (Join-Path $module 'SubModule.xml') -Raw
          if ($moduleXml -notmatch '<Version value="v0\.6\.6\.0"') { throw 'SubModule version mismatch.' }
          if ($moduleXml.Contains('kaitor_dawi_women') -or $moduleXml.Contains('<XmlName id="NPCCharacters"')) {
            throw 'Female Dawi NPC assets are still registered.'
          }

          foreach ($asset in @('kaitor_dawi_women.xml','skins.xml','skins.xslt')) {
            if (Test-Path -LiteralPath (Join-Path $moduleData $asset)) { throw "Female Dawi asset still ships: $asset" }
          }

          $mb = Get-Content (Join-Path $moduleData 'project.mbproj') -Raw
          if ($mb.Contains('soln_skins') -or $mb.Contains('monster') -or $mb.Contains('action_set')) {
            throw 'Race rendering overrides must not ship in core-clean Diplomacy.'
          }

          $dawi = Get-Content (Join-Path $runtime 'KaiDawiDynastyBehavior.cs') -Raw
          foreach ($token in @('DAWI_DYNASTIC_UNION','DAWI_HEIR_VIRTUAL_BORN','DAWI_HEIR_MATERIALIZED','AdultSpawnAge = 30')) {
            if (-not $dawi.Contains($token)) { throw "Dawi abstract dynasty contract missing: $token" }
          }
          if ($dawi.Contains('FemaleDawiLordTemplateId')) {
            throw 'Abstract Dawi dynasty must never use a female template.'
          }

          $safety = Get-Content (Join-Path $src 'Models/TorFamilySafety.cs') -Raw
          if (-not $safety.Contains('Dawi never enter Bannerlord')) { throw 'Dawi vanilla pregnancy hard-block missing.' }

          $race = Get-Content (Join-Path $src 'Models/KaiRaceLifecycle.cs') -Raw
          if ($race.Contains('GetVisualAge(') -or $race.Contains('VisualSafeMaximumAge')) {
            throw 'Visual aging code still ships in Diplomacy.'
          }

          $incoming = Get-Content (Join-Path $runtime 'KaiIncomingMarriageProposalBehavior.cs') -Raw
          foreach ($token in @('AI_MARRIAGE_PROPOSAL_CONTINUE','AI_MARRIAGE_PROPOSAL_CONVERSATION','AcceptPendingOfferFromConversation')) {
            if (-not $incoming.Contains($token)) { throw "Incoming marriage regression fix missing: $token" }
          }

          Write-Host 'KaiTOR Diplomacy v0.6.6.0 core-clean contracts: PASS'

      - name: Assemble test module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $package = 'artifact/KaiTOR_Diplomacy'
          $bin = Join-Path $package 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item (Join-Path $root 'module/*') $package -Recurse -Force
          Copy-Item (Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll') (Join-Path $bin 'KaiTOR_Diplomacy.dll') -Force
          Copy-Item (Join-Path $root 'build/bin/Win64_Shipping_Client/Bannerlord.UIExtenderEx.dll') (Join-Path $bin 'Bannerlord.UIExtenderEx.dll') -Force

      - name: Upload test module
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-Diplomacy-v0.6.6.0-CoreClean-DawiAbstractDynasty
          path: artifact/KaiTOR_Diplomacy
          if-no-files-found: error
          retention-days: 30
