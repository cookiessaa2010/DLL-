name: KaiTOR Diplomacy 1.3.15 Build

on:
  push:
    branches:
      - kaitor-diplomacy-v0.4-ui
    paths:
      - 'projects/KaiTORDiplomacy/**'
      - '.github/workflows/kaitor-diplomacy-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build against Bannerlord 1.3.15 reference assemblies
        shell: pwsh
        run: |
          dotnet build projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj `
            -c Release `
            -p:UseBannerlordReferenceAssemblies=true `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify gameplay contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $dll = Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing DLL: $dll" }

          $module = Get-Content (Join-Path $root 'module/SubModule.xml') -Raw
          if ($module -notmatch 'v0\.4\.1') { throw 'SubModule version is not v0.4.1.' }

          & (Join-Path $root 'tests/Test-KaiTORDiplomacyContracts.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dawi = Get-Content (Join-Path $root 'src/Models/DawiWomenAssetBridge.cs') -Raw
          if ($dawi -notmatch 'ForceSafeOffForLiveTest\s*=\s*true') {
            throw 'Dawi SAFE-OFF latch is not enabled for v0.4.1.'
          }

          $gate = Get-Content (Join-Path $root 'src/Runtime/TorCompatibilityGate.cs') -Raw
          foreach ($required in @(
            'HasTorMarriageOwnership',
            'HasTorPermissionOwnership',
            'model is KaiPlayerMarriageModel',
            'model is KaiKingdomDecisionPermissionModel'
          )) {
            if ($gate -notmatch [regex]::Escape($required)) { throw "Missing LoadSafe gate contract: $required" }
          }

          $office = Get-Content (Join-Path $root 'src/Runtime/KaiDiplomacyOfficeBehavior.cs') -Raw
          foreach ($required in @(
            'KaiTOR: Дипломатия',
            'Предложить пакт о ненападении',
            'Разорвать пакт о ненападении',
            'Дипломатический журнал KaiTOR',
            'SAFE-OFF'
          )) {
            if ($office -notmatch [regex]::Escape($required)) { throw "Missing Russian UI contract: $required" }
          }

          Write-Host 'KaiTOR Diplomacy v0.4.1 RU LoadSafe gate-fix contracts: PASS'

      - name: Assemble module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $package = 'artifact/KaiTOR_Diplomacy'
          $bin = Join-Path $package 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item (Join-Path $root 'module/SubModule.xml') (Join-Path $package 'SubModule.xml') -Force
          Copy-Item (Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll') (Join-Path $bin 'KaiTOR_Diplomacy.dll') -Force
          $pdb = Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.pdb'
          if (Test-Path $pdb) { Copy-Item $pdb (Join-Path $bin 'KaiTOR_Diplomacy.pdb') -Force }
          Copy-Item (Join-Path $root 'README.md') (Join-Path $package 'README.md') -Force
          Copy-Item (Join-Path $root 'FIRST_TEST_RU.md') (Join-Path $package 'FIRST_TEST_RU.md') -Force
          Copy-Item (Join-Path $root 'FAMILY_COMPATIBILITY_RU.md') (Join-Path $package 'FAMILY_COMPATIBILITY_RU.md') -Force

      - name: Upload ready module
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-Diplomacy-v0.4.1-RU-LoadSafe-GateFix
          path: artifact/KaiTOR_Diplomacy
          if-no-files-found: error
          retention-days: 30
