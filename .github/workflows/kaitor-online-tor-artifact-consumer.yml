name: KaiTOR Online TOR Artifact Consumer

on:
  workflow_run:
    workflows:
      - KaiTOR Online 1.3.15 Coop Backport Build
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  verify-uploaded-package:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'kaitor-online-4p'
    runs-on: windows-latest

    steps:
      - name: Checkout exact producer commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: kaitor

      - name: Download uploaded TOR live-test artifact
        uses: actions/download-artifact@v4
        with:
          name: KaiTOROnline-0.0.1-bootstrap-Bannerlord-1.3.15.110062
          path: package
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate artifact after upload boundary
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path ./package
          $validator = Resolve-Path ./kaitor/projects/KaiTOROnline/runtime/Test-KaiTORTorTestPackage.ps1
          & $validator -PackageRoot $packageRoot

      - name: Verify artifact source commit provenance
        shell: pwsh
        run: |
          $buildInfo = Resolve-Path ./package/BUILD.txt
          $content = Get-Content -LiteralPath $buildInfo -Raw
          $expected = '${{ github.event.workflow_run.head_sha }}'
          if ($content -notmatch [regex]::Escape("Source commit: $expected")) {
            throw "Uploaded package provenance mismatch. Expected producer commit $expected."
          }
          Write-Host "Uploaded artifact provenance matches producer commit $expected."

      - name: Reject forbidden redistributed game or TOR payloads
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem ./package -Recurse -File | Where-Object {
            $_.Name -like 'TaleWorlds*.dll' -or
            $_.FullName -match '[\\/]TOR_Armory[\\/]' -or
            $_.FullName -match '[\\/]TOR_Environment[\\/]' -or
            $_.FullName -match '[\\/]TOR_Core[\\/]'
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host "Forbidden redistributed payload: $($_.FullName)" }
            throw 'Uploaded artifact contains game or TOR payloads that must not be redistributed.'
          }
          Write-Host 'Uploaded artifact contains no redistributed Bannerlord/TOR payloads.'
