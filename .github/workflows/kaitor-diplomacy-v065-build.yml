name: KaiTOR Diplomacy v0.6.5.10 Dawi Female Render Build

on:
  push:
    branches:
      - 'kaitor-v0.6.5-*'
    paths:
      - 'projects/KaiTORDiplomacy/**'
      - '.github/workflows/kaitor-diplomacy-v065-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build against Bannerlord 1.3.15.110062 references
        shell: pwsh
        run: |
          dotnet build projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj `
            -c Release `
            -p:UseBannerlordReferenceAssemblies=true `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate v0.6.5.10 contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $src = Join-Path $root 'src'
          $runtime = Join-Path $src 'Runtime'
          $modulePath = Join-Path $root 'module'
          $moduleData = Join-Path $modulePath 'ModuleData'
          $dll = Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing DLL: $dll" }

          $module = Get-Content (Join-Path $modulePath 'SubModule.xml') -Raw
          if ($module -notmatch '<Version value="v0\.6\.5\.10"') { throw 'SubModule version is not v0.6.5.10.' }
          if ($module.Contains('<XmlName id="Monsters"')) { throw 'KaiTOR must not override TOR Monster objects in v0.6.5.10.' }
          if ($module.Contains('kaitor_dawi_monster')) { throw 'Legacy Dawi Monster override is still registered.' }

          $project = Get-Content (Join-Path $src 'KaiTOR_Diplomacy.csproj') -Raw
          if ($project -notmatch '<Version>0\.6\.5\.10</Version>') { throw 'Assembly version is not v0.6.5.10.' }

          $mbproj = Get-Content (Join-Path $moduleData 'project.mbproj') -Raw
          if (-not $mbproj.Contains('ModuleData/skins.xml')) { throw 'Dawi skin solution entry missing.' }
          if ($mbproj.Contains('action_sets')) { throw 'KaiTOR must delegate dwarf action sets to TOR.' }
          if (Test-Path -LiteralPath (Join-Path $moduleData 'action_sets.xml')) { throw 'Redundant KaiTOR Dawi action_sets.xml still ships.' }
          if (Test-Path -LiteralPath (Join-Path $moduleData 'kaitor_dawi_monster.xml')) { throw 'Redundant KaiTOR dwarf Monster XML still ships.' }

          $skinPatch = Get-Content (Join-Path $moduleData 'skins.xslt') -Raw
          foreach ($token in @(
            "race[@id='dwarf']/skin[@gender='1' and @name='woman' and @mesh_maturity_type='adult']",
            'dwarf_skeleton_a',
            'sk_dwarf_bm_f1_body',
            'sk_dwarf_bm_f1_shoulder',
            'sk_dwarf_bm_f1_legs',
            'sk_dwarf_bm_f1_arms',
            'sk_dwarf_bm_f1_head',
            'sk_dwarf_underwear_female_a',
            'm_dwarf_bm_female_a1_head'
          )) {
            if (-not $skinPatch.Contains($token)) { throw "Female Dawi skin contract missing: $token" }
          }

          $subModuleCs = Get-Content (Join-Path $src 'SubModule.cs') -Raw
          if (-not $subModuleCs.Contains('KaiTOR Diplomacy v0.6.5.10 campaign start.')) { throw 'Startup marker is not v0.6.5.10.' }
          foreach ($token in @(
            'new KaiDiplomacyBehavior()',
            'new KaiCultureAssimilationBehavior()',
            'new KaiFamilyAffairsBehavior()',
            'new KaiMessengerBehavior()',
            'new KaiRealmHouseGrowthBehavior()',
            'new KaiPregnancyLifecycleBehavior()'
          )) {
            if (-not $subModuleCs.Contains($token)) { throw "SubModule registration missing: $token" }
          }
          if ($subModuleCs.Contains('new KaiDiplomacyHubBehavior()')) { throw 'Duplicate public Diplomacy Hub is registered.' }

          $pregnancy = Get-Content (Join-Path $runtime 'KaiPregnancyLifecycleBehavior.cs') -Raw
          foreach ($token in @('PREGNANCY_STARTED','PREGNANCY_ENDED','CHILD_BORN')) {
            if (-not $pregnancy.Contains($token)) { throw "Pregnancy lifecycle contract missing: $token" }
          }

          $dawi = Get-Content (Join-Path $runtime 'KaiDawiWomenBehavior.cs') -Raw
          foreach ($token in @(
            'MaximumGeneratedWomenPerClan = 5',
            'GenerationCooldownDays = 84',
            '(adultMen + 2) / 3',
            'SpawnOneForPlayerFamily',
            'PlayerFamilySpawnAge = 35',
            'AdoptHeroAction.Apply(hero)',
            'AddHeroToPartyAction.Apply(hero, MobileParty.MainParty, false)',
            'DAWI_FAMILY_SPAWN'
          )) {
            if (-not $dawi.Contains($token)) { throw "Dawi behavior contract missing: $token" }
          }

          $dawiTemplate = Get-Content (Join-Path $moduleData 'kaitor_dawi_women.xml') -Raw
          foreach ($token in @(
            '<EquipmentSet id="tor_dw_lord_template_001" />',
            '<EquipmentSet id="tor_dw_lord_template_001" civilian="true" />'
          )) {
            if (-not $dawiTemplate.Contains($token)) { throw "Dawi equipment contract missing: $token" }
          }

          $visualPatchPath = Join-Path $runtime 'KaiVisualAgePatch.cs'
          if (Test-Path -LiteralPath $visualPatchPath) { throw 'VisualAge Harmony patch must not ship in Diplomacy.' }

          $family = Get-Content (Join-Path $runtime 'KaiFamilyAffairsBehavior.cs') -Raw
          foreach ($token in @('MARRIAGE_CANCELLED','MARRIAGE_BARTER_ACCEPTED','accepted_without_marriage')) {
            if (-not $family.Contains($token)) { throw "Marriage regression guard missing: $token" }
          }

          $blood = Get-Content (Join-Path $runtime 'KaiBloodKissBehavior.cs') -Raw
          foreach ($token in @('BLOOD_KISS_FAMILY_SUCCESS','BLOOD_KISS_ENCOUNTER_EXIT','BLOOD_KISS_RECOVERY_SUCCESS')) {
            if (-not $blood.Contains($token)) { throw "Blood Kiss regression guard missing: $token" }
          }

          $realm = Get-Content (Join-Path $runtime 'KaiRealmHouseGrowthBehavior.cs') -Raw
          foreach ($token in @('PerKingdomCooldownDays = 42','REALM_CANDIDATE_REJECT','Clan.CreateCompanionToLordClan')) {
            if (-not $realm.Contains($token)) { throw "Realm House regression guard missing: $token" }
          }

          $mercy = Get-Content (Join-Path $runtime 'KaiMercyRelationBehavior.cs') -Raw
          foreach ($token in @('PostBattleMercyRelationBonus = 50','MERCY_RELEASE_BEGIN','MERCY_RELEASE_EVENT')) {
            if (-not $mercy.Contains($token)) { throw "Mercy regression guard missing: $token" }
          }

          if ($module.Contains('DependedModule Id="Bannerlord.UIExtenderEx"')) {
            throw 'External UIExtenderEx launcher dependency must not ship.'
          }
          $uiRuntime = Join-Path $root 'build/bin/Win64_Shipping_Client/Bannerlord.UIExtenderEx.dll'
          if (-not (Test-Path -LiteralPath $uiRuntime -PathType Leaf)) {
            throw "Embedded UIExtenderEx runtime DLL missing: $uiRuntime"
          }

          Write-Host 'KaiTOR Diplomacy v0.6.5.10 Dawi female render contracts: PASS'

      - name: Assemble test module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $package = 'artifact/KaiTOR_Diplomacy'
          $bin = Join-Path $package 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item (Join-Path $root 'module/*') $package -Recurse -Force
          Copy-Item (Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll') (Join-Path $bin 'KaiTOR_Diplomacy.dll') -Force
          Copy-Item (Join-Path $root 'build/bin/Win64_Shipping_Client/Bannerlord.UIExtenderEx.dll') (Join-Path $bin 'Bannerlord.UIExtenderEx.dll') -Force

      - name: Upload test module
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-Diplomacy-v0.6.5.10-DawiFemaleRender-Runtime
          path: artifact/KaiTOR_Diplomacy
          if-no-files-found: error
          retention-days: 30
