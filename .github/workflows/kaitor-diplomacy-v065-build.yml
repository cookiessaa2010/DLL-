name: KaiTOR Diplomacy v0.6.5.5 Realm House Embedded Messenger Build

on:
  push:
    branches:
      - 'kaitor-v0.6.5-*'
    paths:
      - 'projects/KaiTORDiplomacy/**'
      - '.github/workflows/kaitor-diplomacy-v065-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build against Bannerlord 1.3.15.110062 references
        shell: pwsh
        run: |
          dotnet build projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj `
            -c Release `
            -p:UseBannerlordReferenceAssemblies=true `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate v0.6.5.5 realm house + embedded messenger contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $src = Join-Path $root 'src'
          $runtime = Join-Path $src 'Runtime'
          $dll = Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing DLL: $dll" }

          $module = Get-Content (Join-Path $root 'module/SubModule.xml') -Raw
          if ($module -notmatch '<Version value="v0\.6\.5\.5"') { throw 'SubModule version is not v0.6.5.5.' }

          $project = Get-Content (Join-Path $src 'KaiTOR_Diplomacy.csproj') -Raw
          if ($project -notmatch '<Version>0\.6\.5\.5</Version>') { throw 'Assembly version is not 0.6.5.5.' }

          $subModuleCs = Get-Content (Join-Path $src 'SubModule.cs') -Raw
          if ($subModuleCs.Contains('new KaiDiplomacyHubBehavior()')) {
            throw 'Public duplicate Diplomacy Hub is still registered.'
          }
          if (-not $subModuleCs.Contains('new KaiDiplomacyBehavior()')) {
            throw 'Diplomacy backend registration missing.'
          }
          if (-not $subModuleCs.Contains('new KaiCultureAssimilationBehavior()')) {
            throw 'Culture backend registration missing.'
          }
          if (-not $subModuleCs.Contains('new KaiFamilyAffairsBehavior()')) {
            throw 'Family backend registration missing.'
          }

          $dawi = Get-Content (Join-Path $runtime 'KaiDawiWomenBehavior.cs') -Raw
          if ($dawi -match '\bvar\s+dayStamp\s*=') {
            throw 'Legacy campaign-day Dawi age generator still present.'
          }
          foreach ($token in @('StableAgeSeed','requestedAge=','finalAge=')) {
            if (-not $dawi.Contains($token)) { throw "Dawi age hardening token missing: $token" }
          }

          $legacyMapButton = Join-Path $runtime 'KaiMessengerMapButton.cs'
          if (Test-Path -LiteralPath $legacyMapButton) {
            throw 'Legacy map-bar messenger UI must not ship in v0.6.5.5.'
          }

          $messenger = Get-Content (Join-Path $runtime 'KaiMessengerService.cs') -Raw
          foreach ($token in @('CampaignMapConversation.OpenConversation','CanContactHero','CanArriveAtHeroNow','CanInterruptPlayerOnMap','StartRemoteConversation','MESSENGER_CONTACT')) {
            if (-not $messenger.Contains($token)) { throw "Messenger backend contract missing: $token" }
          }

          $messengerBehavior = Get-Content (Join-Path $runtime 'KaiMessengerBehavior.cs') -Raw
          foreach ($token in @(
            'MaximumTravelDays = 3f',
            'CampaignEvents.HourlyTickEvent',
            'kaitor_messenger_arrival_days_v1',
            'GetHoursToArrive',
            'Campaign.MapDiagonal',
            'MESSENGER_SENT',
            'MESSENGER_ARRIVED',
            'MESSENGER_ARRIVAL_ACCEPTED',
            'StartRemoteConversation'
          )) {
            if (-not $messengerBehavior.Contains($token)) { throw "Messenger travel contract missing: $token" }
          }
          if (-not $subModuleCs.Contains('new KaiMessengerBehavior()')) {
            throw 'KaiMessengerBehavior is not registered.'
          }

          $messengerUi = Get-Content (Join-Path $runtime 'KaiMessengerEncyclopediaUI.cs') -Raw
          foreach ($token in @(
            'PrefabExtension(',
            'EncyclopediaHeroPage',
            "descendant::RichTextWidget[@Text='@InformationText']",
            'SuggestedWidth=\"227\"',
            'SuggestedHeight=\"40\"',
            'Brush=\"ButtonBrush2\"',
            'Brush=\"Kingdom.GeneralButtons.Text\"',
            'Command.Click=\"ExecuteSendMessenger\"',
            'ViewModelMixin(nameof(EncyclopediaHeroPageVM.RefreshValues))',
            'ViewModel?.Obj as Hero',
            'GetCampaignBehavior<KaiMessengerBehavior>()',
            'messenger.SendMessenger(hero)'
          )) {
            if (-not $messengerUi.Contains($token)) { throw "Encyclopedia messenger UI contract missing: $token" }
          }

          if ($module.Contains('DependedModule Id="Bannerlord.UIExtenderEx"')) {
            throw 'External UIExtenderEx launcher dependency must not ship in v0.6.5.5.'
          }
          if (-not $project.Contains('PackageReference Include="Bannerlord.UIExtenderEx"')) {
            throw 'Embedded UIExtenderEx package reference missing.'
          }
          if ($project.Contains('IncludeAssets="compile"')) {
            throw 'UIExtenderEx is still compile-only; runtime DLL would be missing.'
          }
          foreach ($token in @(
            'UIConfig.DoNotUseGeneratedPrefabs = true',
            'UIExtender.Create("KaiTOR_Diplomacy")',
            'embedded UIExtenderEx registered'
          )) {
            if (-not $subModuleCs.Contains($token)) { throw "Embedded UIExtenderEx startup contract missing: $token" }
          }
          foreach ($runtimeDll in @(
            'Bannerlord.UIExtenderEx.dll',
            'Bannerlord.BUTR.Shared.dll',
            'BUTR.MessageBoxPInvoke.dll',
            'Newtonsoft.Json.dll',
            'Harmony.Extensions.dll'
          )) {
            $runtimePath = Join-Path $root ("build/bin/Win64_Shipping_Client/" + $runtimeDll)
            if (-not (Test-Path -LiteralPath $runtimePath -PathType Leaf)) {
              throw "Embedded UI runtime dependency missing from build output: $runtimePath"
            }
          }

          $uiPatch = Get-Content (Join-Path $runtime 'KaiDiplomacyUiPatch.cs') -Raw
          if (-not $uiPatch.Contains('KingdomDiplomacyVM')) { throw 'Native Kingdom diplomacy integration missing.' }

          $visualPatchPath = Join-Path $runtime 'KaiVisualAgePatch.cs'
          if (Test-Path -LiteralPath $visualPatchPath) {
            throw 'Crash-hotfix invariant failed: VisualAge Harmony patch must not ship in Diplomacy v0.6.5.1.'
          }
          $allRuntimeText = Get-ChildItem $runtime -Filter '*.cs' -File | ForEach-Object { Get-Content $_.FullName -Raw } | Out-String
          if ($allRuntimeText.Contains('CharacterObject.GetBodyProperties') -and $allRuntimeText.Contains('HarmonyPatch')) {
            throw 'Crash-hotfix invariant failed: Diplomacy still patches CharacterObject.GetBodyProperties.'
          }

          $family = Get-Content (Join-Path $runtime 'KaiFamilyAffairsBehavior.cs') -Raw
          if (-not $family.Contains('"town_tavern"')) { throw 'Tavern adoption entry missing.' }
          if (-not $family.Contains('"Принять в род"')) { throw 'Adoption label missing.' }
          foreach ($legacyEntry in @('kaitor_family_affairs_town"', 'kaitor_family_affairs_town_outside"', 'kaitor_family_affairs_castle"')) {
            if ($family.Contains($legacyEntry)) { throw "Legacy public Family Affairs entry still present: $legacyEntry" }
          }
          foreach ($token in @('MARRIAGE_CANCELLED','MARRIAGE_BARTER_ACCEPTED','accepted_without_marriage')) {
            if (-not $family.Contains($token)) { throw "Marriage outcome logging missing: $token" }
          }

          $realm = Get-Content (Join-Path $runtime 'KaiRealmHouseGrowthBehavior.cs') -Raw
          foreach ($token in @(
            'kaitor_realm_house_kingdom_cooldown_v3',
            'kaitor_realm_house_pending_founders_v4',
            'CampaignEvents.OnGameLoadedEvent',
            'ScanKingdoms("game_loaded")',
            'OrderByDescending(k => k == playerKingdom)',
            'reason=target_satisfied',
            'REALM_CANDIDATE_REJECT',
            'TryQueueNewHouse(kingdom, now, deficit, current, target)',
            'COMMIT_DEFER',
            '4 + (int)Math.Ceiling(fortifications / 2d)',
            'first-safe-hour-largest-deficit',
            'KaiRuntimeLog.Write(eventName, details)'
          )) {
            if (-not $realm.Contains($token)) { throw "Realm House v0.6.5.5 contract missing: $token" }
          }
          if ($realm.Contains('CommitHour')) {
            throw 'Realm House is still gated to a fixed commit hour.'
          }
          if ($realm.Contains('PlayerEncounter.Current != null')) {
            throw 'Realm House still blocks ordinary town/player encounters.'
          }

          $culture = Get-Content (Join-Path $runtime 'KaiCultureAssimilationBehavior.cs') -Raw
          foreach ($token in @('CULTURE_CHANGE_BEGIN','CULTURE_CHANGE_SUCCESS','reason=already_current')) {
            if (-not $culture.Contains($token)) { throw "Culture diagnostics contract missing: $token" }
          }

          $mercy = Get-Content (Join-Path $runtime 'KaiMercyRelationBehavior.cs') -Raw
          foreach ($token in @(
            'PostBattleMercyRelationBonus = 50',
            'conversation_talk_lord_defeat_to_lord_release_on_consequence',
            'conversation_talk_lord_freed_to_lord_release_on_consequence',
            'MERCY_RELEASE_BEGIN',
            'MERCY_RELEASE_EVENT',
            'targetDelta={PostBattleMercyRelationBonus}',
            'Math.Max(0, PostBattleMercyRelationBonus - vanillaDelta)'
          )) {
            if (-not $mercy.Contains($token)) { throw "Mercy +50 contract missing: $token" }
          }

          $portraitRefs = Get-ChildItem $root -Recurse -File | Select-String -SimpleMatch 'PortraitFix'
          if ($portraitRefs) {
            Write-Host 'PortraitFix references exist in docs/source; no PortraitFix files are packaged by this module.'
          }

          Write-Host 'KaiTOR Diplomacy v0.6.5.5 realm house + embedded messenger contracts: PASS'

      - name: Assemble test module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $package = 'artifact/KaiTOR_Diplomacy'
          $bin = Join-Path $package 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item (Join-Path $root 'module/*') $package -Recurse -Force
          Copy-Item (Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll') (Join-Path $bin 'KaiTOR_Diplomacy.dll') -Force
          foreach ($runtimeDll in @(
            'Bannerlord.UIExtenderEx.dll',
            'Bannerlord.BUTR.Shared.dll',
            'BUTR.MessageBoxPInvoke.dll',
            'Newtonsoft.Json.dll',
            'Harmony.Extensions.dll'
          )) {
            Copy-Item (Join-Path $root ("build/bin/Win64_Shipping_Client/" + $runtimeDll)) (Join-Path $bin $runtimeDll) -Force
          }

          # Diagnostics: show any additional non-game dependencies emitted by NuGet.
          Get-ChildItem (Join-Path $root 'build/bin/Win64_Shipping_Client') -Filter '*.dll' -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload test module
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-Diplomacy-v0.6.5.5-RealmHouse-EmbeddedMessenger-Runtime
          path: artifact/KaiTOR_Diplomacy
          if-no-files-found: error
          retention-days: 30
