name: KaiTOR Online Shared Map Diagnostics

on:
  push:
    branches:
      - kaitor-online-4p
    paths:
      - 'projects/KaiTOROnline/tools/ApplySharedMapDiagnostics.ps1'
      - 'projects/KaiTOROnline/tools/ApplyFourPlayerMovementOwnership.ps1'
      - 'projects/KaiTOROnline/tools/ApplyFourPlayerEncounterOwnership.ps1'
      - 'projects/KaiTOROnline/upstream-overlay/source/Coop.Core/Server/Commands/KaiTORFourPlayerSnapshotCommand.cs'
      - '.github/workflows/kaitor-online-shared-map-diagnostics.yml'
  workflow_dispatch:

jobs:
  build-runtime-snapshot-command:
    runs-on: windows-latest
    steps:
      - name: Checkout KaiTOR project
        uses: actions/checkout@v4
        with:
          path: kaitor

      - name: Checkout pinned Bannerlord Coop source
        uses: actions/checkout@v4
        with:
          repository: Bannerlord-Coop-Team/BannerlordCoop
          ref: 107d1c29ec3dc2d9f2d3a7836ae1691c2391e00c
          path: upstream

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Bannerlord 1.3.15 reference packages
        shell: pwsh
        run: dotnet restore ./kaitor/projects/KaiTOROnline/probes/Bannerlord1315ApiProbe/Bannerlord1315ApiProbe.csproj

      - name: Stage exact Bannerlord 1.3.15 references
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/StageBannerlord1315References.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply tested four-player admission gate
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyFourPlayerGate.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply NetPeer identity hardening
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyNetPeerIdentitySafety.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply shared-map runtime diagnostics and ownership gates
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplySharedMapDiagnostics.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply GameInterface 1.3.15 compile backport
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyBannerlord1315CompileBackport.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply Missions 1.3.15 backport
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyBannerlord1315MissionsBackport.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Align managed dependencies
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyManagedDependencyAlignment.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Restore Coop dependency graph
        shell: pwsh
        run: dotnet restore ./upstream/source/Coop.Core/Coop.Core.csproj -p:KaiTORBannerlord1315=true -p:NuGetAudit=false

      - name: Build Coop.Core snapshot command against Bannerlord 1.3.15.110062
        shell: pwsh
        run: dotnet build ./upstream/source/Coop.Core/Coop.Core.csproj --configuration Release --no-restore --verbosity minimal -p:KaiTORBannerlord1315=true -p:NuGetAudit=false

      - name: Verify command is staged and release-registered
        shell: pwsh
        run: |
          $command = Get-Content ./upstream/source/Coop.Core/Server/Commands/KaiTORFourPlayerSnapshotCommand.cs -Raw
          $module = Get-Content ./upstream/source/Coop.Core/Server/ServerModule.cs -Raw
          if ($command -notmatch 'KAITOR_4P_SNAPSHOT_JSON=') { throw 'Snapshot JSON marker missing.' }
          if ($command -notmatch 'admissionGate\.ActiveSlots') { throw 'Snapshot is not reading the real four-player admission gate.' }
          if ($module -notmatch 'RegisterType<KaiTORFourPlayerSnapshotCommand>') { throw 'Snapshot command is not registered in ServerModule.' }
          Write-Host 'KaiTOR shared-map runtime snapshot command: PASS'

      - name: Verify server-authoritative party ownership gate is staged
        shell: pwsh
        run: |
          $handlerPath = './upstream/source/Coop.Core/Server/Services/MobileParties/PacketHandlers/PartyAIBehaviorPacketHandler.cs'
          $handler = Get-Content $handlerPath -Raw

          if ($handler -notmatch 'IPlayerManager playerManager') {
            throw 'Movement packet handler is missing IPlayerManager ownership resolution.'
          }
          if ($handler -notmatch 'playerManager\.TryGetPlayer\(peer, out var player\)') {
            throw 'Movement packet handler does not resolve the authenticated player from NetPeer.'
          }
          if ($handler -notmatch 'Compact\(data\.MobilePartyId, typeof\(MobileParty\)\)') {
            throw 'Movement packet handler does not normalize the requested MobileParty id.'
          }
          if ($handler -notmatch 'Compact\(player\.MobilePartyId, typeof\(MobileParty\)\)') {
            throw 'Movement packet handler does not normalize the registered owner MobileParty id.'
          }
          if ($handler -notmatch 'string\.Equals\(requestedPartyId, ownedPartyId, System\.StringComparison\.Ordinal\)') {
            throw 'Movement packet handler does not reject cross-player MobileParty commands.'
          }
          if ($handler -notmatch 'data\.OriginControllerId = player\.ControllerId') {
            throw 'Movement packet handler still trusts the client-supplied controller identity.'
          }

          Write-Host 'KaiTOR server-authoritative movement ownership staging: PASS'

      - name: Verify four-player encounter ownership and battle participant isolation
        shell: pwsh
        run: |
          $conversation = Get-Content './upstream/source/GameInterface/Services/MapEvents/Handlers/ConversationRequestHandler.cs' -Raw
          $mission = Get-Content './upstream/source/GameInterface/Services/MapEvents/Handlers/BattleMissionStartHandler.cs' -Raw

          if ($conversation -notmatch 'RequesterOwnsRequestedPlayerParty\(requestingPeer, attacker, defender\)') {
            throw 'Encounter request is not gated by authenticated peer ownership.'
          }
          if ($conversation -notmatch 'playerManager\.TryGetPlayer\(requestingPeer, out var player\)') {
            throw 'Encounter ownership gate does not resolve the authenticated player.'
          }
          if ($conversation -notmatch 'objectManager\.TryGetObject<MobileParty>\(player\.MobilePartyId, out var requestingParty\)') {
            throw 'Encounter ownership gate does not resolve the requester MobileParty.'
          }
          if ($conversation -notmatch 'ReferenceEquals\(requestingParty\.Party, attacker\)') {
            throw 'Encounter ownership gate does not bind the requester to the attacker side.'
          }
          if ($conversation -notmatch 'ReferenceEquals\(requestingParty\.Party, defender\)') {
            throw 'Encounter ownership gate does not bind the requester to the defender side.'
          }
          if ($mission -notmatch 'TryGetRequestingParticipant\(requester, payload\.What, mapEvent, out var attackerMobileParty\)') {
            throw 'Battle start does not validate the requesting participant.'
          }
          if ($mission -notmatch '!string\.Equals\(player\.MobilePartyId, request\.AttackerPartyId, StringComparison\.Ordinal\)') {
            throw 'Battle start still trusts a client-supplied initiating party id.'
          }
          if ($mission -notmatch 'mapEvent\.FindMapEventParty\(party\.Party\) != null') {
            throw 'Battle start does not require the requester party to belong to the authoritative MapEvent.'
          }
          if ($mission -notmatch 'mapEvent\.FindMapEventParty\(party\.Party, out var side\) is not MapEventParty mapEventParty') {
            throw 'Mission participant list is not derived from authoritative MapEvent membership.'
          }
          if ($mission -notmatch 'foreach \(var participant in participants\)') {
            throw 'Mission start is not targeted over the authoritative participant set.'
          }
          if ($mission -notmatch 'network\.Send\(participant\.Peer, message\)') {
            throw 'Mission start is broadcast instead of being sent only to battle participants.'
          }

          Write-Host 'KaiTOR four-player encounter ownership and battle participant isolation: PASS'

      - name: Verify authoritative movement replication path
        shell: pwsh
        run: |
          $serverPacketHandler = Get-Content './upstream/source/Coop.Core/Server/Services/MobileParties/PacketHandlers/PartyAIBehaviorPacketHandler.cs' -Raw
          $behaviorHandler = Get-Content './upstream/source/GameInterface/Services/MobileParties/Handlers/MobilePartyBehaviorHandler.cs' -Raw
          $clientHandler = Get-Content './upstream/source/Coop.Core/Client/Services/MobileParties/Handlers/NetworkPartyBehaviorMessageHandler.cs' -Raw

          if ($behaviorHandler -notmatch 'if \(ModInformation\.IsServer\)\s+PublishAuthoritativeBehavior\(party, data\)') {
            throw 'Server does not publish an authoritative behavior snapshot after applying a movement request.'
          }
          if ($behaviorHandler -notmatch 'mobilePartyBehaviorSnapshot\.TryCreate\(\s*party,\s*out PartyBehaviorUpdateData authoritativeData\)') {
            throw 'Authoritative movement update is not re-snapshotted from the server MobileParty.'
          }
          if ($behaviorHandler -notmatch 'authoritativeData\.OriginControllerId = request\.OriginControllerId') {
            throw 'Authoritative movement echo does not preserve the server-stamped controller identity.'
          }
          if ($behaviorHandler -notmatch 'new PartyBehaviorUpdated\(ref authoritativeData\)') {
            throw 'Authoritative movement snapshot is not published for network replication.'
          }
          if ($serverPacketHandler -notmatch 'Subscribe<PartyBehaviorUpdated>\(Handle_PartyBehaviorUpdated\)') {
            throw 'Server packet handler is not subscribed to authoritative movement snapshots.'
          }
          if ($serverPacketHandler -notmatch 'new NetworkUpdatePartyBehavior\(data\)') {
            throw 'Authoritative movement snapshot is not converted to a network update.'
          }
          if ($clientHandler -notmatch 'Subscribe<NetworkUpdatePartyBehavior>\(Handle\)') {
            throw 'Client is not subscribed to authoritative movement network updates.'
          }
          if ($clientHandler -notmatch 'new UpdatePartyBehavior\(ref data\)') {
            throw 'Client does not feed authoritative movement updates back into GameInterface.'
          }

          Write-Host 'KaiTOR authoritative owned-party movement replication path: PASS'

      - name: Verify four-player save restart reconnect persistence path
        shell: pwsh
        run: |
          $saveHandler = Get-Content './upstream/source/Coop.Core/Server/Services/Save/Handlers/SaveGameHandler.cs' -Raw
          $resolveState = Get-Content './upstream/source/Coop.Core/Server/Connections/States/ResolveCharacterState.cs' -Raw
          $playerManager = Get-Content './upstream/source/GameInterface/Services/Players/PlayerManager.cs' -Raw
          $visibilityHandler = Get-Content './upstream/source/Coop.Core/Server/Services/Players/Handlers/PlayerPartyVisibilityHandler.cs' -Raw

          if ($saveHandler -notmatch 'playerRegistry\.Players\.ToArray\(\)') {
            throw 'Coop save does not persist the complete player registry.'
          }
          if ($saveHandler -notmatch 'SelectOneRegistrationPerController\(savedSession\.Players\)') {
            throw 'Server restart does not de-duplicate saved registrations by controller identity.'
          }
          if ($saveHandler -notmatch 'playerPartyRestorer\.TryRestore\(player, out var registration\)') {
            throw 'Server restart does not restore the saved Hero/MobileParty graph before registration.'
          }
          if ($saveHandler -notmatch 'playerRegistry\.AddPlayer\(registration\)') {
            throw 'Restored player graphs are not returned to the persistent player registry.'
          }
          if ($resolveState -notmatch 'playerManager\.TryGetPlayer\(controllerId, out var player\)') {
            throw 'Reconnect does not resolve the persistent registration by controller id.'
          }
          if ($resolveState -notmatch 'playerPartyRestorer\.TryRestore\(player, out restoredPlayer\)') {
            throw 'Reconnect does not repair/rebind the registered MobileParty graph.'
          }
          if ($resolveState -notmatch 'playerManager\.ReplacePlayer\(player, restoredPlayer\)') {
            throw 'Reconnect cannot replace a repaired registration atomically.'
          }
          if ($resolveState -notmatch 'playerManager\.SetPeer\(controllerId, peer\)') {
            throw 'Reconnect does not bind the new NetPeer generation to the existing controller.'
          }
          if ($resolveState -notmatch 'ConnectionLogic\.TransferSave\(\)') {
            throw 'Reconnect does not transfer the authoritative campaign save.'
          }
          if ($resolveState -notmatch 'existingPlayerSender\.SendExistingPlayers\(peer, controllerId\)') {
            throw 'Reconnect does not deliver the other persistent player graphs to the joiner.'
          }
          if ($playerManager -notmatch 'void ClearPeer\(NetPeer peer\)') {
            throw 'Player registry has no peer-only disconnect operation.'
          }
          if ($visibilityHandler -notmatch 'playerManager\.ClearPeer\(peer\)') {
            throw 'Disconnect does not clear only the live peer association.'
          }
          if ($visibilityHandler -match 'playerManager\.RemovePlayer\(player\)') {
            throw 'Disconnect handler removes the persistent player registration.'
          }
          if ($visibilityHandler -notmatch 'party\.IsActive = false') {
            throw 'Disconnected persistent parties are not parked on the authoritative map.'
          }
          if ($visibilityHandler -notmatch 'ActivateParty\(party, player\.MobilePartyId\)') {
            throw 'Reconnected persistent parties are not reactivated with the same MobileParty id.'
          }

          Write-Host 'KaiTOR four-player save/restart/reconnect persistence path: PASS'

      # Keep this workflow path-sensitive: changes to any ownership patcher above must exercise staging + compile.
