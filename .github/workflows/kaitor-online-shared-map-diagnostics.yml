name: KaiTOR Online Shared Map Diagnostics

on:
  push:
    branches:
      - kaitor-online-4p
    paths:
      - 'projects/KaiTOROnline/tools/ApplySharedMapDiagnostics.ps1'
      - 'projects/KaiTOROnline/tools/ApplyFourPlayerMovementOwnership.ps1'
      - 'projects/KaiTOROnline/upstream-overlay/source/Coop.Core/Server/Commands/KaiTORFourPlayerSnapshotCommand.cs'
      - '.github/workflows/kaitor-online-shared-map-diagnostics.yml'
  workflow_dispatch:

jobs:
  build-runtime-snapshot-command:
    runs-on: windows-latest
    steps:
      - name: Checkout KaiTOR project
        uses: actions/checkout@v4
        with:
          path: kaitor

      - name: Checkout pinned Bannerlord Coop source
        uses: actions/checkout@v4
        with:
          repository: Bannerlord-Coop-Team/BannerlordCoop
          ref: 107d1c29ec3dc2d9f2d3a7836ae1691c2391e00c
          path: upstream

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Bannerlord 1.3.15 reference packages
        shell: pwsh
        run: dotnet restore ./kaitor/projects/KaiTOROnline/probes/Bannerlord1315ApiProbe/Bannerlord1315ApiProbe.csproj

      - name: Stage exact Bannerlord 1.3.15 references
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/StageBannerlord1315References.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply tested four-player admission gate
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyFourPlayerGate.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply NetPeer identity hardening
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyNetPeerIdentitySafety.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply shared-map runtime diagnostics
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplySharedMapDiagnostics.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply four-player movement ownership gate
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyFourPlayerMovementOwnership.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply GameInterface 1.3.15 compile backport
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyBannerlord1315CompileBackport.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply Missions 1.3.15 backport
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyBannerlord1315MissionsBackport.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Align managed dependencies
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyManagedDependencyAlignment.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Restore Coop dependency graph
        shell: pwsh
        run: dotnet restore ./upstream/source/Coop.Core/Coop.Core.csproj -p:KaiTORBannerlord1315=true -p:NuGetAudit=false

      - name: Build Coop.Core snapshot command against Bannerlord 1.3.15.110062
        shell: pwsh
        run: dotnet build ./upstream/source/Coop.Core/Coop.Core.csproj --configuration Release --no-restore --verbosity minimal -p:KaiTORBannerlord1315=true -p:NuGetAudit=false

      - name: Verify command is staged and release-registered
        shell: pwsh
        run: |
          $command = Get-Content ./upstream/source/Coop.Core/Server/Commands/KaiTORFourPlayerSnapshotCommand.cs -Raw
          $module = Get-Content ./upstream/source/Coop.Core/Server/ServerModule.cs -Raw
          if ($command -notmatch 'KAITOR_4P_SNAPSHOT_JSON=') { throw 'Snapshot JSON marker missing.' }
          if ($command -notmatch 'admissionGate\.ActiveSlots') { throw 'Snapshot is not reading the real four-player admission gate.' }
          if ($module -notmatch 'RegisterType<KaiTORFourPlayerSnapshotCommand>') { throw 'Snapshot command is not registered in ServerModule.' }
          Write-Host 'KaiTOR shared-map runtime snapshot command: PASS'

      - name: Verify server-authoritative party ownership gate is staged
        shell: pwsh
        run: |
          $handlerPath = './upstream/source/Coop.Core/Server/Services/MobileParties/PacketHandlers/PartyAIBehaviorPacketHandler.cs'
          $handler = Get-Content $handlerPath -Raw

          if ($handler -notmatch 'IPlayerManager playerManager') {
            throw 'Movement packet handler is missing IPlayerManager ownership resolution.'
          }
          if ($handler -notmatch 'playerManager\.TryGetPlayer\(peer, out var player\)') {
            throw 'Movement packet handler does not resolve the authenticated player from NetPeer.'
          }
          if ($handler -notmatch 'Compact\(data\.MobilePartyId, typeof\(MobileParty\)\)') {
            throw 'Movement packet handler does not normalize the requested MobileParty id.'
          }
          if ($handler -notmatch 'Compact\(player\.MobilePartyId, typeof\(MobileParty\)\)') {
            throw 'Movement packet handler does not normalize the registered owner MobileParty id.'
          }
          if ($handler -notmatch 'string\.Equals\(requestedPartyId, ownedPartyId, System\.StringComparison\.Ordinal\)') {
            throw 'Movement packet handler does not reject cross-player MobileParty commands.'
          }
          if ($handler -notmatch 'data\.OriginControllerId = player\.ControllerId') {
            throw 'Movement packet handler still trusts the client-supplied controller identity.'
          }

          Write-Host 'KaiTOR server-authoritative movement ownership staging: PASS'
