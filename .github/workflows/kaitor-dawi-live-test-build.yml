name: KaiTOR Unified Lifecycle Restore 1.3.15

on:
  push:
    branches:
      - kaitor-dawi-women-live-test
      - kaitor-global-test-v0.6.1-crashfix
      - kaitor-global-test-v0.6.2-lifecycle-marriage
    paths:
      - 'projects/KaiTORDiplomacy/**'
      - '.github/workflows/kaitor-dawi-live-test-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build KaiTOR unified v0.6.2 Lifecycle Marriage Restore
        shell: pwsh
        run: |
          dotnet build projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj `
            -c Release `
            -p:UseBannerlordReferenceAssemblies=true `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify lifecycle marriage and crash-safety contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Get-Content projects/KaiTORDiplomacy/module/SubModule.xml -Raw
          foreach ($required in @(
            '<Id value="KaiTOR_Diplomacy" />',
            '<Version value="v0.6.2" />',
            'kaitor_dawi_women',
            'kaitor_dawi_monster'
          )) {
            if ($manifest -notmatch [regex]::Escape($required)) { throw "Unified manifest contract missing: $required" }
          }

          $project = Get-Content projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj -Raw
          foreach ($required in @(
            '<Version>0.6.2</Version>',
            '<AssemblyVersion>0.6.2.0</AssemblyVersion>',
            '0.6.2-Lifecycle-MarriageRestore'
          )) {
            if ($project -notmatch [regex]::Escape($required)) { throw "Version contract missing: $required" }
          }

          $sub = Get-Content projects/KaiTORDiplomacy/src/SubModule.cs -Raw
          foreach ($required in @(
            'LoadSafeDiagnostics = true',
            'EnableLifecycleRestore = true',
            'EnableLoreOldAgeMortality = true',
            'EnableMarriageWarnings = true',
            'EnableDawiWomenLiveTest = true',
            'CampaignOptions.IsLifeDeathCycleDisabled = false',
            'InstallMarriageWrapper(campaignStarter)',
            'InstallPregnancyWrapper(campaignStarter)',
            'InstallHeroDeathWrapper(campaignStarter)',
            'new KaiMarriageWarningBehavior()',
            'new KaiFamilyAffairsBehavior()',
            'new KaiRealmHouseGrowthBehavior()'
          )) {
            if ($sub -notmatch [regex]::Escape($required)) { throw "Lifecycle runtime contract missing: $required" }
          }
          if ($sub -match 'campaignStarter\.AddModel<AgeModel>') { throw 'v0.6.2 must keep Bannerlord standard child age progression.' }
          if ($sub -match 'campaignStarter\.AddBehavior\(new KaiCadetHouseSafeBehavior\(\)\);') { throw 'Legacy settlement-entry clan mutation must not be registered.' }

          $marriage = Get-Content projects/KaiTORDiplomacy/src/Models/KaiPlayerMarriageModel.cs -Raw
          foreach ($required in @(
            'IsSafeNpcMarriagePair',
            'TorFamilySafety.CanUseVanillaPregnancy',
            'IsSupportedMarriageCulture(consideringClan.Culture?.StringId)',
            'return base.NpcCoupleMarriageChance(firstHero, secondHero)'
          )) {
            if ($marriage -notmatch [regex]::Escape($required)) { throw "Marriage restore contract missing: $required" }
          }
          if ($marriage -match 'IsCertifiedNpcDynastyCulture') { throw 'Legacy four-culture NPC marriage gate must be removed.' }

          $death = Get-Content projects/KaiTORDiplomacy/src/Models/KaiHeroDeathProbabilityModel.cs -Raw
          foreach ($required in @(
            'DawiOldAgeStart = 180f',
            'DawiHardMaxAge = 420f',
            'TorFamilySafety.IsVampire(hero)',
            'TorFamilySafety.IsUndead(hero)',
            'IsCulture(hero, "battania")',
            'IsCulture(hero, "eonir")',
            'IsCulture(hero, "aserai")'
          )) {
            if ($death -notmatch [regex]::Escape($required)) { throw "Lore mortality contract missing: $required" }
          }

          $warning = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiMarriageWarningBehavior.cs -Raw
          foreach ($required in @(
            'Этот брак возможен',
            'Продолжить брачные договорённости',
            'не будет биологических детей'
          )) {
            if ($warning -notmatch [regex]::Escape($required)) { throw "Russian marriage warning contract missing: $required" }
          }

          $realm = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiRealmHouseGrowthBehavior.cs -Raw
          foreach ($required in @(
            'Clan.CreateCompanionToLordClan',
            'ChangeKingdomAction.ApplyByJoinToKingdom',
            'campaign.CurrentMenuContext != null',
            '_commitInProgress',
            'NATIVE_FACTORY_BEGIN',
            'JOIN_KINGDOM_BEGIN',
            'COMMIT_MANAGED_EXCEPTION',
            'KaiTORRealmHouse.log',
            'commit=hourly-open-map-native-factory'
          )) {
            if ($realm -notmatch [regex]::Escape($required)) { throw "Realm crashfix contract missing: $required" }
          }
          foreach ($forbidden in @(
            'newClan.Kingdom = kingdom',
            'founder.Clan = newClan',
            'newClan.SetLeader(founder)',
            'CampaignEventDispatcher.Instance.OnClanCreated(newClan, true)',
            'Clan.CreateClan(clanId)'
          )) {
            if ($realm -match [regex]::Escape($forbidden)) { throw "Forbidden manual graph mutation remains: $forbidden" }
          }
          if ($realm -match 'AfterSettlementEntered') { throw 'Realm growth must never mutate the clan graph on settlement entry.' }
          if ($realm -match 'ChangeOwnerOfSettlementAction') { throw 'New house transaction must remain landless.' }

          $population = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiRacialPopulationBehavior.cs -Raw
          if ($sub -notmatch 'if \(!LoadSafeDiagnostics\)') { throw 'Unsafe population systems lost their LoadSafe gate.' }

          $dawi = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiDawiWomenBehavior.cs -Raw
          if ($dawi -notmatch 'AutomaticPopulationEnabled = false') { throw 'Automatic Dawi population must stay OFF.' }
          if ($dawi -notmatch 'SpawnOneForLiveTest') { throw 'Manual one-woman live-test probe is missing.' }

          Write-Host 'KaiTOR unified v0.6.2 lifecycle + marriage + crash-safety contracts: PASS'

      - name: Assemble unified base package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $module = 'artifact/KaiTOR_Diplomacy'
          New-Item -ItemType Directory -Path (Join-Path $module 'bin/Win64_Shipping_Client') -Force | Out-Null

          Copy-Item projects/KaiTORDiplomacy/module/SubModule.xml (Join-Path $module 'SubModule.xml') -Force
          Copy-Item projects/KaiTORDiplomacy/build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll (Join-Path $module 'bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll') -Force
          $pdb = 'projects/KaiTORDiplomacy/build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.pdb'
          if (Test-Path $pdb) { Copy-Item $pdb (Join-Path $module 'bin/Win64_Shipping_Client/KaiTOR_Diplomacy.pdb') -Force }

      - name: Upload unified Lifecycle Marriage package
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-Unified-v0.6.2-Lifecycle-MarriageRestore
          path: artifact/KaiTOR_Diplomacy
          if-no-files-found: error
          retention-days: 30
