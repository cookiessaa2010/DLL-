name: KaiTOR Unified Global Test 1.3.15

on:
  push:
    branches:
      - kaitor-dawi-women-live-test
    paths:
      - 'projects/KaiTORDiplomacy/**'
      - '.github/workflows/kaitor-dawi-live-test-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build KaiTOR unified v0.6.1
        shell: pwsh
        run: |
          dotnet build projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj `
            -c Release `
            -p:UseBannerlordReferenceAssemblies=true `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify global-test contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Get-Content projects/KaiTORDiplomacy/module/SubModule.xml -Raw
          foreach ($required in @(
            '<Id value="KaiTOR_Diplomacy" />',
            '<Version value="v0.6.1" />',
            'kaitor_dawi_women',
            'kaitor_dawi_monster'
          )) {
            if ($manifest -notmatch [regex]::Escape($required)) { throw "Unified manifest contract missing: $required" }
          }

          $project = Get-Content projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj -Raw
          foreach ($required in @(
            '<Version>0.6.1</Version>',
            '<AssemblyVersion>0.6.1.0</AssemblyVersion>',
            '0.6.1-GlobalDiplomacy-Dawi-LiveTest'
          )) {
            if ($project -notmatch [regex]::Escape($required)) { throw "Version contract missing: $required" }
          }

          $sub = Get-Content projects/KaiTORDiplomacy/src/SubModule.cs -Raw
          foreach ($required in @(
            'LoadSafeDiagnostics = true',
            'EnableDawiWomenLiveTest = true',
            'InstallPregnancyWrapper',
            'new KaiDawiWomenBehavior',
            'new KaiDiplomacyBehavior',
            'new KaiPoliticalMarriageBehavior',
            'new KaiDiplomaticNegotiationBehavior',
            'new KaiMarriageWarningBehavior',
            'new KaiRealmHouseGrowthBehavior'
          )) {
            if ($sub -notmatch [regex]::Escape($required)) { throw "Runtime contract missing: $required" }
          }
          if ($sub -match 'campaignStarter\.AddBehavior\(new KaiDiplomacyOfficeBehavior\(\)\);') { throw 'Town diplomacy office must stay removed for global test.' }
          if ($sub -match 'campaignStarter\.AddBehavior\(new KaiFamilyAffairsBehavior\(\)\);') { throw 'Town family affairs menu must stay removed for global test.' }
          if ($sub -match 'campaignStarter\.AddBehavior\(new KaiCadetHouseSafeBehavior\(\)\);') { throw 'Legacy settlement-entry clan mutation must not be registered.' }

          $warning = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiMarriageWarningBehavior.cs -Raw
          if ($warning -match 'KaiTOR warning') { throw 'Technical KaiTOR warning text must not be player-facing.' }
          foreach ($required in @('Особенности брачного союза', 'биологических детей', 'Продолжить переговоры')) {
            if ($warning -notmatch [regex]::Escape($required)) { throw "Marriage warning contract missing: $required" }
          }

          $negotiation = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiDiplomaticNegotiationBehavior.cs -Raw
          foreach ($required in @(
            'lord_talk_speak_diplomacy_2',
            'Пакт о ненападении',
            'Политический брачный союз',
            'BarterablesRequested',
            'KaiPoliticalMarriageBarterable'
          )) {
            if ($negotiation -notmatch [regex]::Escape($required)) { throw "Diplomatic negotiation contract missing: $required" }
          }

          $political = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiPoliticalMarriageBehavior.cs -Raw
          foreach ($required in @(
            'PoliticalMarriageCost = 500000',
            'DynasticTrustBonus = 30',
            'DynasticRulerRelationBonus = 20',
            'DynasticNapDays = 180',
            'MarriageAction.Apply'
          )) {
            if ($political -notmatch [regex]::Escape($required)) { throw "Political-marriage contract missing: $required" }
          }

          $behavior = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiDawiWomenBehavior.cs -Raw
          if ($behavior -notmatch 'AutomaticPopulationEnabled = false') { throw 'Automatic Dawi population must stay OFF.' }
          if ($behavior -notmatch 'SpawnOneForLiveTest') { throw 'Manual one-woman live-test probe is missing.' }

          $bridge = Get-Content projects/KaiTORDiplomacy/src/Models/DawiWomenAssetBridge.cs -Raw
          foreach ($required in @(
            'ModuleId = "KaiTOR_Diplomacy"',
            'kaitor_dawi_woman_lord',
            'kaitor_dawi_assets_ready.flag',
            'kaitor_dawi_female.tpac',
            'ExpectedAssetPackBytes = 29213977L',
            'template.Race == dwarfRace'
          )) {
            if ($bridge -notmatch [regex]::Escape($required)) { throw "Integrated Dawi bridge contract missing: $required" }
          }

          Write-Host 'KaiTOR unified v0.6.1 global-test contracts: PASS'

      - name: Assemble unified base package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $module = 'artifact/KaiTOR_Diplomacy'
          New-Item -ItemType Directory -Path (Join-Path $module 'bin/Win64_Shipping_Client') -Force | Out-Null

          Copy-Item projects/KaiTORDiplomacy/module/SubModule.xml (Join-Path $module 'SubModule.xml') -Force
          Copy-Item projects/KaiTORDiplomacy/build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll (Join-Path $module 'bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll') -Force
          $pdb = 'projects/KaiTORDiplomacy/build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.pdb'
          if (Test-Path $pdb) { Copy-Item $pdb (Join-Path $module 'bin/Win64_Shipping_Client/KaiTOR_Diplomacy.pdb') -Force }

      - name: Upload unified base package
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-Unified-v0.6.1-global-test-base
          path: artifact/KaiTOR_Diplomacy
          if-no-files-found: error
          retention-days: 30
