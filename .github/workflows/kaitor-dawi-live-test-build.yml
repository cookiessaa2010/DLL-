name: KaiTOR Unified Diplomacy Family Lore 1.3.15

on:
  push:
    branches:
      - kaitor-global-test-v0.6.3-diplomacy-ui
      - kaitor-global-test-v0.6.3.2-testfixes
      - kaitor-global-test-v0.6.3.3-realmhouse-fix
    paths:
      - 'projects/KaiTORDiplomacy/**'
      - '.github/workflows/kaitor-dawi-live-test-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build KaiTOR unified v0.6.3.3
        shell: pwsh
        run: |
          dotnet build projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj `
            -c Release `
            -p:UseBannerlordReferenceAssemblies=true `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify v0.6.3.3 regression contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Get-Content projects/KaiTORDiplomacy/module/SubModule.xml -Raw
          foreach ($required in @(
            '<Id value="KaiTOR_Diplomacy" />',
            '<Version value="v0.6.3.3" />',
            '<DependedModule Id="Bannerlord.Harmony" DependentVersion="v2.4.2.248" />',
            'kaitor_dawi_women',
            'kaitor_dawi_monster'
          )) {
            if ($manifest -notmatch [regex]::Escape($required)) { throw "Manifest contract missing: $required" }
          }

          $project = Get-Content projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj -Raw
          foreach ($required in @(
            '<Version>0.6.3.3</Version>',
            '<AssemblyVersion>0.6.3.3</AssemblyVersion>',
            '0.6.3.3-RealmHouseFix',
            'TaleWorlds.CampaignSystem.ViewModelCollection',
            'Lib.Harmony'
          )) {
            if ($project -notmatch [regex]::Escape($required)) { throw "Project contract missing: $required" }
          }

          $sub = Get-Content projects/KaiTORDiplomacy/src/SubModule.cs -Raw
          foreach ($required in @(
            'LoadSafeDiagnostics = true',
            'CampaignOptions.IsLifeDeathCycleDisabled = false',
            'InstallMarriageWrapper(campaignStarter)',
            'InstallPregnancyWrapper(campaignStarter)',
            'InstallHeroDeathWrapper(campaignStarter)',
            'InstallPermissionWrapper(campaignStarter)',
            'new KaiFamilyAffairsBehavior()',
            'new KaiLoreEducationBehavior()',
            'new KaiMercyRelationBehavior()',
            'new KaiRealmHouseGrowthBehavior()',
            '_harmony.PatchAll(typeof(SubModule).Assembly)'
          )) {
            if ($sub -notmatch [regex]::Escape($required)) { throw "Runtime contract missing: $required" }
          }
          if ($sub -match 'campaignStarter\.AddModel<AgeModel>') { throw 'Standard Bannerlord child age progression must remain untouched.' }
          if ($sub -match 'new KaiDiplomacyOfficeBehavior\(\)') { throw 'Diplomacy must not be registered in town/castle menus.' }
          if ($sub -notmatch 'if \(!LoadSafeDiagnostics\)\s*campaignStarter\.AddBehavior\(new KaiRacialPopulationBehavior\(\)\);') { throw 'Unsafe racial population must remain behind the disabled safety latch.' }

          $family = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiFamilyAffairsBehavior.cs -Raw
          foreach ($required in @(
            'AddGameMenu(',
            'kaitor_family_affairs',
            'GameMenu.SwitchToMenu(FamilyMenuId)',
            'AdoptHeroAction.Apply(candidate)',
            'ShowQuick('
          )) {
            if ($family -notmatch [regex]::Escape($required)) { throw "Family navigation contract missing: $required" }
          }
          if ($family -match 'InformationManager\.HideInquiry') { throw 'Broken nested-inquiry workaround must not return.' }

          $marriage = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiMarriageWarningBehavior.cs -Raw
          foreach ($required in @(
            'hero_courtship_final_barter',
            'Romance.RomanticStateList',
            'MatchMadeByFamily',
            'У этой пары не будет биологических детей'
          )) {
            if ($marriage -notmatch [regex]::Escape($required)) { throw "Marriage warning contract missing: $required" }
          }

          $safety = Get-Content projects/KaiTORDiplomacy/src/Models/TorFamilySafety.cs -Raw
          foreach ($required in @(
            'FaceGen.GetRaceOrDefault("vampire")',
            'FaceGen.GetRaceOrDefault("necrarch")',
            'if (IsVampire(firstHero) || IsVampire(secondHero))'
          )) {
            if ($safety -notmatch [regex]::Escape($required)) { throw "TOR biology safety contract missing: $required" }
          }

          $mercy = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiMercyRelationBehavior.cs -Raw
          foreach ($required in @(
            'PostBattleMercyRelationBonus = 50',
            'EndCaptivityDetail.ReleasedByChoice',
            'EndCaptivityDetail.ReleasedAfterBattle',
            'MapEvent.PlayerMapEvent',
            'ChangeRelationAction.ApplyPlayerRelation'
          )) {
            if ($mercy -notmatch [regex]::Escape($required)) { throw "Mercy relation contract missing: $required" }
          }

          $decisions = Get-Content projects/KaiTORDiplomacy/src/Decisions/KaiDiplomacyDecisions.cs -Raw
          foreach ($required in @(
            'class KaiNonAggressionPactDecision',
            'class KaiBreakNonAggressionPactDecision',
            'NapProposalInfluenceCost',
            'NapBreakInfluenceCost',
            'Пакт о ненападении',
            'Разрыв пакта'
          )) {
            if ($decisions -notmatch [regex]::Escape($required)) { throw "Diplomacy decision contract missing: $required" }
          }

          $dip = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiDiplomacyBehavior.cs -Raw
          foreach ($required in @(
            'DefaultNapDays = 90',
            'NapProposalInfluenceCost = 150',
            'NapBreakInfluenceCost = 100',
            'NaturalExpiryTrustBonus',
            'VoluntaryBreakTrustPenalty',
            'WarBreachTrustPenalty',
            'ChangeRelationAction'
          )) {
            if ($dip -notmatch [regex]::Escape($required)) { throw "Diplomacy core contract missing: $required" }
          }
          if ($dip -match 'IsStartAllianceDecisionAllowedBetweenKingdoms\(first, second') { throw 'NAP must not reuse alliance eligibility as its hard gate.' }

          $ui = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiDiplomacyUiPatch.cs -Raw
          foreach ($required in @(
            'KingdomDiplomacyVM',
            'KingdomDiplomacyProposalActionItemVM',
            'OnSetPeaceItem',
            'Предложить пакт о ненападении',
            'Разорвать пакт о ненападении',
            'Пакт с {target.Name}: ещё {remaining} дн.'
          )) {
            if ($ui -notmatch [regex]::Escape($required)) { throw "Kingdom diplomacy UI contract missing: $required" }
          }
          foreach ($forbidden in @('KaiTOR:', 'RuntimeEnabled=', 'DEBUG')) {
            if ($ui -match [regex]::Escape($forbidden)) { throw "Technical player-facing UI text remains: $forbidden" }
          }

          $education = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiLoreEducationBehavior.cs -Raw
          foreach ($required in @(
            'tor_cc_options.xml',
            'ChildEducationCompletedEvent',
            'OriginAge = 8',
            'GrowthAge = 14',
            'ProfessionAge = 16',
            'HeroComesOfAgeEvent',
            'TryAssignCareer'
          )) {
            if ($education -notmatch [regex]::Escape($required)) { throw "Lore education contract missing: $required" }
          }

          $permission = Get-Content projects/KaiTORDiplomacy/src/Models/KaiKingdomDecisionPermissionModel.cs -Raw
          if ($permission -notmatch 'IsNonAggressionPactActive') { throw 'Active NAP must veto ordinary war decisions.' }

          $realm = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiRealmHouseGrowthBehavior.cs -Raw
          foreach ($required in @(
            'Clan.CreateCompanionToLordClan',
            'ChangeKingdomAction.ApplyByJoinToKingdom',
            'founder.SetNewOccupation(Occupation.Lord)',
            '_pendingFounderByKingdom',
            '_pendingHomeByKingdom',
            '_pendingReadyByKingdom',
            'SelectReadyPendingKingdom',
            'LEGACY_REPAIR_OK',
            'QUEUE_SKIP',
            'KaiTORRealmHouse.log'
          )) {
            if ($realm -notmatch [regex]::Escape($required)) { throw "Realm v0.6.3.3 contract missing: $required" }
          }
          foreach ($forbidden in @(
            'newClan.Kingdom = kingdom',
            'founder.Clan = newClan',
            'newClan.SetLeader(founder)',
            'Clan.CreateClan(clanId)',
            'GlobalCooldownDays',
            '_globalCooldownUntilDay'
          )) {
            if ($realm -match [regex]::Escape($forbidden)) { throw "Forbidden realm-house path remains: $forbidden" }
          }

          $dawi = Get-Content projects/KaiTORDiplomacy/src/Runtime/KaiDawiWomenBehavior.cs -Raw
          if ($dawi -notmatch 'AutomaticPopulationEnabled = false') { throw 'Automatic Dawi population must stay OFF.' }

          Write-Host 'KaiTOR unified v0.6.3.3 realm-house regression contracts: PASS'

      - name: Assemble unified base package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $module = 'artifact/KaiTOR_Diplomacy'
          New-Item -ItemType Directory -Path (Join-Path $module 'bin/Win64_Shipping_Client') -Force | Out-Null
          Copy-Item projects/KaiTORDiplomacy/module/SubModule.xml (Join-Path $module 'SubModule.xml') -Force
          Copy-Item projects/KaiTORDiplomacy/build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll (Join-Path $module 'bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll') -Force
          $pdb = 'projects/KaiTORDiplomacy/build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.pdb'
          if (Test-Path $pdb) { Copy-Item $pdb (Join-Path $module 'bin/Win64_Shipping_Client/KaiTOR_Diplomacy.pdb') -Force }

      - name: Upload unified v0.6.3.3 package
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-Unified-v0.6.3.3-RealmHouseFix
          path: artifact/KaiTOR_Diplomacy
          if-no-files-found: error
          retention-days: 30
