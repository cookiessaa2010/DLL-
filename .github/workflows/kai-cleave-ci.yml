name: Build KaiCleave Coop beta

on:
  push:
    branches:
      - ci/kai-cleave-v0.2.1-coop
    paths:
      - 'ci/KaiCleave/**'
      - '.github/workflows/kai-cleave-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci/KaiCleave/**'
      - '.github/workflows/kai-cleave-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ci/KaiCleave/KaiCleave.csproj

      - name: Build
        run: dotnet build ci/KaiCleave/KaiCleave.csproj -c Release --no-restore

      - name: Validate Coop authority contract
        shell: pwsh
        run: |
          [xml]$module = Get-Content 'ci/KaiCleave/SubModule.xml' -Raw
          if ($module.Module.Id.value -ne 'KaiCleave') { throw 'Unexpected module id.' }
          if ($module.Module.Version.value -ne 'v0.2.1') { throw 'Unexpected KaiCleave version.' }

          $runtime = Get-Content 'ci/KaiCleave/CoopRuntime.cs' -Raw
          foreach ($required in @(
            'CoopPeer',
            'CoopCampaignServer',
            '/server',
            '/coopsave',
            'TryGetControlledObjectInfo',
            'IsControlled',
            'PlayerOnly=false is not enabled'
          )) {
            if ($runtime -notmatch [regex]::Escape($required)) {
              throw "Coop runtime guard is missing required contract marker: $required"
            }
          }

          $submodule = Get-Content 'ci/KaiCleave/SubModule.cs' -Raw
          if ($submodule -notmatch 'CombatPatchesAllowed') { throw 'SubModule does not gate Harmony patches by Coop role.' }
          if ($submodule -notmatch 'battle peers own cleave simulation') { throw 'Campaign-server passive behavior is not explicit.' }
          if ($submodule -notmatch 'Coop peer local-authority') { throw 'Battle-peer active behavior is not explicit.' }

          $patch = Get-Content 'ci/KaiCleave/CleavePatch.cs' -Raw
          if ($patch -notmatch 'IsEligiblePlayerAttacker') { throw 'PlayerOnly is not routed through Coop ownership resolution.' }
          if ($patch -notmatch '!CoopRuntime.CoopModuleActive && GameNetwork.IsSessionActive') {
            throw 'Ordinary Bannerlord multiplayer guard changed unexpectedly.'
          }

          $project = Get-Content 'ci/KaiCleave/KaiCleave.csproj' -Raw
          if ($project -match 'Coop.Core|GameInterface.dll|Missions.dll') {
            throw 'KaiCleave must not acquire a hard compile/runtime dependency on KaiTOR Coop assemblies.'
          }

      - name: Package
        shell: pwsh
        run: |
          $root = 'package\KaiCleave'
          New-Item -ItemType Directory -Force "$root\bin\Win64_Shipping_Client" | Out-Null
          Copy-Item 'ci\KaiCleave\bin\Release\net472\KaiCleave.dll' "$root\bin\Win64_Shipping_Client\KaiCleave.dll"
          Copy-Item 'ci\KaiCleave\SubModule.xml' "$root\SubModule.xml"
          Copy-Item 'ci\KaiCleave\KaiCleave.ini' "$root\KaiCleave.ini"
          Copy-Item 'ci\KaiCleave\README_TEST_RU.txt' "$root\README_TEST_RU.txt"
          New-Item -ItemType Directory -Force "$root\Source" | Out-Null
          Copy-Item 'ci\KaiCleave\*.cs' "$root\Source\"

          $zip = 'KaiCleave-v0.2.1-coop-beta-Bannerlord-1.3.15.110062-TOR-KaiTOR.zip'
          Compress-Archive -Path 'package\KaiCleave' -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content 'SHA256.txt' -Encoding ascii

      - name: Upload Coop beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiCleave-v0.2.1-coop-beta
          if-no-files-found: error
          retention-days: 14
          path: |
            KaiCleave-v0.2.1-coop-beta-Bannerlord-1.3.15.110062-TOR-KaiTOR.zip
            SHA256.txt
