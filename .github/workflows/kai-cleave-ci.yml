name: Build KaiCleave beta

on:
  push:
    branches:
      - ci/kai-cleave-v0.1
    paths:
      - 'ci/KaiCleave/**'
      - '.github/workflows/kai-cleave-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci/KaiCleave/**'
      - '.github/workflows/kai-cleave-ci.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ci/KaiCleave/KaiCleave.csproj

      - name: Build
        run: dotnet build ci/KaiCleave/KaiCleave.csproj -c Release --no-restore

      - name: Package
        shell: pwsh
        run: |
          $root = 'package\KaiCleave'
          New-Item -ItemType Directory -Force "$root\bin\Win64_Shipping_Client" | Out-Null
          Copy-Item 'ci\KaiCleave\bin\Release\net472\KaiCleave.dll' "$root\bin\Win64_Shipping_Client\KaiCleave.dll"
          Copy-Item 'ci\KaiCleave\SubModule.xml' "$root\SubModule.xml"
          Copy-Item 'ci\KaiCleave\README_TEST_RU.txt' "$root\README_TEST_RU.txt"
          Copy-Item 'ci\KaiCleave\CleavePatch.cs' "$root\CleavePatch_SOURCE.cs"
          Compress-Archive -Path 'package\KaiCleave' -DestinationPath 'KaiCleave-v0.1.0-beta-Bannerlord-1.3.15.110062-TOR.zip' -Force
          $hash = (Get-FileHash 'KaiCleave-v0.1.0-beta-Bannerlord-1.3.15.110062-TOR.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KaiCleave-v0.1.0-beta-Bannerlord-1.3.15.110062-TOR.zip" | Set-Content 'SHA256.txt' -Encoding ascii

      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiCleave-v0.1.0-beta
          if-no-files-found: error
          retention-days: 7
          path: |
            KaiCleave-v0.1.0-beta-Bannerlord-1.3.15.110062-TOR.zip
            SHA256.txt
