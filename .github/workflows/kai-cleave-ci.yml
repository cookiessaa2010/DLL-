name: Build KaiCleave 0.3.0 heavy block UI

on:
  push:
    branches:
      - ci/kai-cleave-v0.3.0-heavy-block-ui
    paths:
      - 'ci/KaiCleave/**'
      - '.github/workflows/kai-cleave-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ci/KaiCleave/KaiCleave.csproj

      - name: Build
        run: dotnet build ci/KaiCleave/KaiCleave.csproj -c Release --no-restore

      - name: Validate v0.3 heavy-block/UI contract
        shell: pwsh
        run: |
          [xml]$module = Get-Content 'ci/KaiCleave/SubModule.xml' -Raw
          if ($module.Module.Id.value -ne 'KaiCleave') { throw 'Unexpected module id.' }
          if ($module.Module.Version.value -ne 'v0.3.0') { throw 'Unexpected KaiCleave version.' }

          $runtime = Get-Content 'ci/KaiCleave/CoopRuntime.cs' -Raw
          foreach ($required in @('CoopPeer','CoopCampaignServer','/server','/coopsave','TryGetControlledObjectInfo','IsControlled','PlayerOnly=false is not enabled')) {
            if ($runtime -notmatch [regex]::Escape($required)) { throw "Coop runtime guard is missing required marker: $required" }
          }

          $submodule = Get-Content 'ci/KaiCleave/SubModule.cs' -Raw
          foreach ($required in @('CombatPatchesAllowed','battle peers own cleave simulation','Coop peer local-authority','0.3.0-heavy-block-ui','FlushAndStop','InputKey.F10','InGameSettings.OpenRoot')) {
            if ($submodule -notmatch [regex]::Escape($required)) { throw "SubModule missing marker: $required" }
          }

          $settings = Get-Content 'ci/KaiCleave/KaiSettings.cs' -Raw
          foreach ($required in @('HeavyShieldContinue','HeavyWeaponBlockContinue','IsHeavyTraversalWeapon','TwoHandedSword','TwoHandedAxe','TwoHandedMace','OneHandedPolearm','TwoHandedPolearm','LowGripPolearm','File.WriteAllText')) {
            if ($settings -notmatch [regex]::Escape($required)) { throw "Settings missing marker: $required" }
          }

          $patch = Get-Content 'ci/KaiCleave/CleavePatch.cs' -Raw
          foreach ($required in @('IsDamageHitEligible','CanTraverseCollision','AttackBlockedWithShield','CombatCollisionResult.Blocked','HeavyShieldContinue','HeavyWeaponBlockContinue')) {
            if ($patch -notmatch [regex]::Escape($required)) { throw "Heavy-block patch missing marker: $required" }
          }

          $ui = Get-Content 'ci/KaiCleave/InGameSettings.cs' -Raw
          foreach ($required in @('MBInformationManager.ShowMultiSelectionInquiry','2H / polearm through shield','2H / polearm through weapon block','KaiSettings.Save')) {
            if ($ui -notmatch [regex]::Escape($required)) { throw "In-game UI missing marker: $required" }
          }

          $logger = Get-Content 'ci/KaiCleave/DebugLogger.cs' -Raw
          foreach ($required in @('ConcurrentQueue','AutoResetEvent','AsyncLogging=True','CLEAVE_TIMING','heavy-shield-continue','heavy-weapon-block-continue')) {
            if ($logger -notmatch [regex]::Escape($required)) { throw "Async logger missing marker: $required" }
          }
          if ($logger -match 'lock \(Sync\).*File.AppendAllText') { throw 'Synchronous combat logging pattern still present.' }

          $tor = Get-Content 'ci/KaiCleave/TorCompatibility.cs' -Raw
          if ($tor -notmatch 'target.DeclaringType != torType') { throw 'Inherited TOR method guard missing.' }

          $project = Get-Content 'ci/KaiCleave/KaiCleave.csproj' -Raw
          if ($project -match 'Coop.Core|GameInterface.dll|Missions.dll|Bannerlord.MCM|ButterLib|UIExtender') { throw 'KaiCleave gained an unwanted hard runtime dependency.' }

      - name: Package
        shell: pwsh
        run: |
          $root = 'package\KaiCleave'
          New-Item -ItemType Directory -Force "$root\bin\Win64_Shipping_Client" | Out-Null
          Copy-Item 'ci\KaiCleave\bin\Release\net472\KaiCleave.dll' "$root\bin\Win64_Shipping_Client\KaiCleave.dll"
          Copy-Item 'ci\KaiCleave\SubModule.xml' "$root\SubModule.xml"
          Copy-Item 'ci\KaiCleave\KaiCleave.ini' "$root\KaiCleave.ini"
          Copy-Item 'ci\KaiCleave\README_TEST_RU.txt' "$root\README_TEST_RU.txt"
          New-Item -ItemType Directory -Force "$root\Source" | Out-Null
          Copy-Item 'ci\KaiCleave\*.cs' "$root\Source\"

          $zip = 'KaiCleave-v0.3.0-heavy-block-ui-Bannerlord-1.3.15.110062-TOR-KaiTOR.zip'
          Compress-Archive -Path 'package\KaiCleave' -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content 'SHA256.txt' -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiCleave-v0.3.0-heavy-block-ui
          if-no-files-found: error
          retention-days: 14
          path: |
            KaiCleave-v0.3.0-heavy-block-ui-Bannerlord-1.3.15.110062-TOR-KaiTOR.zip
            SHA256.txt
