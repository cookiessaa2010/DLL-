name: KaiTOR Online 1.3.15 Coop Backport Build

on:
  push:
    branches:
      - kaitor-online-4p
    paths:
      - 'projects/KaiTOROnline/tools/StageBannerlord1315References.ps1'
      - 'projects/KaiTOROnline/tools/ApplyBannerlord1315CompileBackport.ps1'
      - 'projects/KaiTOROnline/tools/ApplyBannerlord1315MissionsBackport.ps1'
      - 'projects/KaiTOROnline/tools/ApplyBannerlord1315ModuleMetadata.ps1'
      - 'projects/KaiTOROnline/tools/ApplyManagedDependencyAlignment.ps1'
      - 'projects/KaiTOROnline/tools/ApplyFourPlayerGate.ps1'
      - 'projects/KaiTOROnline/tools/ApplyNetPeerIdentitySafety.ps1'
      - 'projects/KaiTOROnline/tools/AuditManagedAssemblyReferences.ps1'
      - 'projects/KaiTOROnline/upstream-overlay/**'
      - 'projects/KaiTOROnline/probes/Bannerlord1315ApiProbe/**'
      - '.github/workflows/kaitor-online-1315-coopcore-build.yml'
  workflow_dispatch:

# Shared-map bootstrap gate: compile upward through Coop and its server console with the tested hard 4-player admission gate applied.
jobs:
  build-coop-against-1315:
    runs-on: windows-latest

    steps:
      - name: Checkout KaiTOR project
        uses: actions/checkout@v4
        with:
          path: kaitor

      - name: Checkout pinned Bannerlord Coop source
        uses: actions/checkout@v4
        with:
          repository: Bannerlord-Coop-Team/BannerlordCoop
          ref: 107d1c29ec3dc2d9f2d3a7836ae1691c2391e00c
          path: upstream

      - name: Setup .NET 8 SDK and .NET 6 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: Pin build commands to .NET 8 SDK
        shell: pwsh
        run: |
          $sdk = dotnet --list-sdks |
            ForEach-Object { ($_ -split ' ')[0] } |
            Where-Object { $_ -like '8.0.*' } |
            Select-Object -Last 1
          if (-not $sdk) { throw 'No .NET 8 SDK installed.' }

          $globalJson = @{
            sdk = @{
              version = $sdk
              rollForward = 'latestPatch'
              allowPrerelease = $false
            }
          } | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'global.json'), $globalJson, [Text.UTF8Encoding]::new($false))

          $selected = dotnet --version
          Write-Host "Pinned SDK: $selected"
          if ($selected -notlike '8.0.*') { throw "Expected .NET 8 SDK, got $selected" }

      - name: Restore Bannerlord 1.3.15 reference packages
        shell: pwsh
        run: dotnet restore ./kaitor/projects/KaiTOROnline/probes/Bannerlord1315ApiProbe/Bannerlord1315ApiProbe.csproj

      - name: Stage exact 1.3.15 references into Coop mb2 layout
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/StageBannerlord1315References.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply tested KaiTOR four-player admission gate
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyFourPlayerGate.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply NetPeer reference-identity hardening
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyNetPeerIdentitySafety.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply GameInterface 1.3.15 compile backport
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyBannerlord1315CompileBackport.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply Missions 1.3.15 backport
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyBannerlord1315MissionsBackport.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Lock module metadata to Bannerlord 1.3.15
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyBannerlord1315ModuleMetadata.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Align managed runtime dependencies
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyManagedDependencyAlignment.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Restore legacy Coop packages.config dependencies
        shell: pwsh
        run: nuget restore ./upstream/source/Coop/packages.config -PackagesDirectory ./upstream/source/packages -NonInteractive

      - name: Restore Coop dependency graph
        shell: pwsh
        run: dotnet restore ./upstream/source/Coop/Coop.csproj -p:KaiTORBannerlord1315=true -p:NuGetAudit=false

      - name: Build Coop.Core against Bannerlord 1.3.15.110062
        shell: pwsh
        run: dotnet build ./upstream/source/Coop.Core/Coop.Core.csproj --configuration Release --no-restore --verbosity minimal -p:KaiTORBannerlord1315=true -p:NuGetAudit=false

      - name: Build Coop against Bannerlord 1.3.15.110062
        shell: pwsh
        run: dotnet build ./upstream/source/Coop/Coop.csproj --configuration Release --no-restore --verbosity minimal -p:KaiTORBannerlord1315=true -p:NuGetAudit=false

      - name: Validate generated module metadata
        shell: pwsh
        run: |
          $subModulePath = Resolve-Path ./upstream/mb2/Modules/Coop/SubModule.xml
          [xml]$xml = Get-Content $subModulePath -Raw
          $dependencies = @($xml.Module.DependedModules.DependedModule)
          if ($dependencies.Count -eq 0) { throw 'Generated SubModule.xml has no dependencies.' }
          foreach ($dependency in $dependencies) {
            if ($dependency.DependentVersion -ne 'v1.3.15') {
              throw "Unexpected dependency version for $($dependency.Id): $($dependency.DependentVersion)"
            }
          }
          $raw = Get-Content $subModulePath -Raw
          if ($raw -match '\$\{[^}]+\}') { throw 'Unresolved template token remains in generated SubModule.xml.' }
          Write-Host "Validated $($dependencies.Count) module dependencies at v1.3.15."

      - name: Restore server console dependency graph
        shell: pwsh
        run: dotnet restore ./upstream/source/ServerConsole/ServerConsole.csproj -p:NuGetAudit=false

      - name: Build server console against backported Coop graph
        shell: pwsh
        run: dotnet build ./upstream/source/ServerConsole/ServerConsole.csproj --configuration Release --no-restore --verbosity minimal -p:NuGetAudit=false

      - name: Smoke-test server console startup and clean shutdown
        shell: pwsh
        run: |
          $server = Resolve-Path ./upstream/source/ServerConsole/bin/Release/net6.0/ServerConsole.dll
          $output = 'STOP' | dotnet $server 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "ServerConsole exited with code $LASTEXITCODE" }
          if ($output -notmatch 'Server started on port') { throw 'ServerConsole did not reach listening startup.' }

      - name: Assemble KaiTOR 0.0.1 bootstrap artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KaiTOROnline-0.0.1-bootstrap'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'Modules') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'ServerConsole') | Out-Null

          Copy-Item ./upstream/mb2/Modules/Coop (Join-Path $stage 'Modules/Coop') -Recurse -Force
          Copy-Item ./upstream/source/ServerConsole/bin/Release/net6.0/* (Join-Path $stage 'ServerConsole') -Recurse -Force

          # The compile-only mb2 tree is populated from Bannerlord.ReferenceAssemblies. The legacy
          # Coop deploy step copies some of those references into the module output. They are only
          # build inputs and must never be redistributed. Strip every filename that exists in the
          # staged Bannerlord reference root, not just TaleWorlds-prefixed assemblies.
          $referenceRoot = Resolve-Path ./upstream/mb2/bin/Win64_Shipping_Client
          $referenceNames = @{}
          Get-ChildItem $referenceRoot -File | ForEach-Object { $referenceNames[$_.Name.ToLowerInvariant()] = $true }

          $stripped = 0
          Get-ChildItem $stage -Recurse -File | ForEach-Object {
            if ($referenceNames.ContainsKey($_.Name.ToLowerInvariant())) {
              Remove-Item $_.FullName -Force
              $stripped++
            }
          }
          Write-Host "Stripped $stripped Bannerlord reference assembly file(s) from distributable staging."

          # Defense in depth: no staged Bannerlord reference name and no TaleWorlds assembly may survive.
          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object {
            $referenceNames.ContainsKey($_.Name.ToLowerInvariant()) -or
            ($_.Name -like 'TaleWorlds*.dll')
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host "Forbidden game assembly: $($_.FullName)" }
            throw 'Packaging guard found Bannerlord game/reference assemblies.'
          }

          @(
            'KaiTOR Online 0.0.1 bootstrap',
            'Target: Mount & Blade II Bannerlord 1.3.15.110062',
            'Admission limit: 4 simultaneous players',
            'Purpose: runtime/bootstrap testing before TOR integration',
            'Game assemblies are NOT included; use an existing legal Bannerlord 1.3.15.110062 installation.',
            "Source commit: $env:GITHUB_SHA"
          ) | Set-Content -Encoding UTF8 (Join-Path $stage 'BUILD.txt')

          Get-ChildItem $stage -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              $relative = [IO.Path]::GetRelativePath($stage, $_.FullName)
              "$($hash.Hash)  $relative"
            } | Set-Content -Encoding ASCII (Join-Path $stage 'SHA256SUMS.txt')

          "KAITOR_ARTIFACT=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Audit packaged managed dependency versions
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/AuditManagedAssemblyReferences.ps1 -Directory (Join-Path $env:KAITOR_ARTIFACT 'Modules/Coop/bin/Win64_Shipping_Client')

      - name: Upload KaiTOR bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOROnline-0.0.1-bootstrap-Bannerlord-1.3.15.110062
          path: ${{ env.KAITOR_ARTIFACT }}
          if-no-files-found: error
          retention-days: 7
