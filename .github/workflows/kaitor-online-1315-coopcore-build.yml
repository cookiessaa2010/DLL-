name: KaiTOR Online 1.3.15 Coop Backport Build

on:
  push:
    branches:
      - kaitor-online-4p
    paths:
      - 'projects/KaiTOROnline/tools/StageBannerlord1315References.ps1'
      - 'projects/KaiTOROnline/tools/ApplyBannerlord1315CompileBackport.ps1'
      - 'projects/KaiTOROnline/tools/ApplyBannerlord1315MissionsBackport.ps1'
      - 'projects/KaiTOROnline/probes/Bannerlord1315ApiProbe/**'
      - '.github/workflows/kaitor-online-1315-coopcore-build.yml'
  workflow_dispatch:

# Shared-map bootstrap gate: compile upward through Coop while retaining the tested 4-player server gate.
jobs:
  build-coop-against-1315:
    runs-on: windows-latest

    steps:
      - name: Checkout KaiTOR project
        uses: actions/checkout@v4
        with:
          path: kaitor

      - name: Checkout pinned Bannerlord Coop source
        uses: actions/checkout@v4
        with:
          repository: Bannerlord-Coop-Team/BannerlordCoop
          ref: 107d1c29ec3dc2d9f2d3a7836ae1691c2391e00c
          path: upstream

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Bannerlord 1.3.15 reference packages
        shell: pwsh
        run: dotnet restore ./kaitor/projects/KaiTOROnline/probes/Bannerlord1315ApiProbe/Bannerlord1315ApiProbe.csproj

      - name: Stage exact 1.3.15 references into Coop mb2 layout
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/StageBannerlord1315References.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply GameInterface 1.3.15 compile backport
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyBannerlord1315CompileBackport.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply Missions 1.3.15 backport
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyBannerlord1315MissionsBackport.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Restore legacy Coop packages.config dependencies
        shell: pwsh
        run: nuget restore ./upstream/source/Coop/packages.config -PackagesDirectory ./upstream/source/packages -NonInteractive

      - name: Restore Coop dependency graph
        shell: pwsh
        run: dotnet restore ./upstream/source/Coop/Coop.csproj -p:KaiTORBannerlord1315=true -p:NuGetAudit=false

      - name: Build Coop.Core against Bannerlord 1.3.15.110062
        shell: pwsh
        run: dotnet build ./upstream/source/Coop.Core/Coop.Core.csproj --configuration Release --no-restore --verbosity minimal -p:KaiTORBannerlord1315=true -p:NuGetAudit=false

      - name: Build Coop against Bannerlord 1.3.15.110062
        shell: pwsh
        run: dotnet build ./upstream/source/Coop/Coop.csproj --configuration Release --no-restore --verbosity minimal -p:KaiTORBannerlord1315=true -p:NuGetAudit=false
