name: KaiTOR Online TOR Campaign Launch

on:
  push:
    branches:
      - kaitor-online-4p
    paths:
      - 'projects/KaiTOROnline/runtime/Start-KaiTORTorCampaignServer.ps1'
      - 'projects/KaiTOROnline/runtime/Start-KaiTORCampaignServer.ps1'
      - 'projects/KaiTOROnline/runtime/Test-KaiTORTorCompatibility.ps1'
      - 'projects/KaiTOROnline/runtime/Test-KaiTORRuntimePreflight.ps1'
      - 'projects/KaiTOROnline/runtime/modules.tor-1.3.15.txt'
      - '.github/workflows/kaitor-online-tor-launch.yml'
  workflow_dispatch:

jobs:
  tor-launch-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout KaiTOR project
        uses: actions/checkout@v4

      - name: Build synthetic TOR runtime
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'fake-kaitor-tor-launch'
          $bin = Join-Path $root 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Set-Content -LiteralPath (Join-Path $bin 'Bannerlord.exe') -Value 'CI placeholder' -Encoding ASCII

          foreach ($module in @('Native','SandBoxCore','Sandbox','CustomBattle','StoryMode','TOR_Armory','TOR_Environment')) {
            $dir = Join-Path $root ("Modules/{0}" -f $module)
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            "<Module><Id value=`"$module`"/><Version value=`"v1.3.15`"/></Module>" | Set-Content -LiteralPath (Join-Path $dir 'SubModule.xml') -Encoding UTF8
          }

          $tor = Join-Path $root 'Modules/TOR_Core'
          $torBin = Join-Path $tor 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $torBin | Out-Null
          @'
          <Module>
            <Id value="TOR_Core"/><Version value="v1.3.15"/>
            <DependedModules>
              <DependedModule Id="Native" DependentVersion="v1.3.15"/>
              <DependedModule Id="SandBoxCore" DependentVersion="v1.3.15"/>
              <DependedModule Id="Sandbox" DependentVersion="v1.3.15"/>
              <DependedModule Id="TOR_Armory" DependentVersion="v1.3.15"/>
              <DependedModule Id="TOR_Environment" DependentVersion="v1.3.15"/>
            </DependedModules>
            <SubModules><SubModule><DLLName value="TOR_Core.dll"/><Tags>
              <Tag key="DedicatedServerType" value="none"/>
              <Tag key="IsNoRenderModeElement" value="false"/>
            </Tags></SubModule></SubModules>
          </Module>
          '@ | Set-Content -LiteralPath (Join-Path $tor 'SubModule.xml') -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $torBin 'TOR_Core.dll') -Value 'CI placeholder' -Encoding ASCII

          $coop = Join-Path $root 'Modules/Coop'
          $coopBin = Join-Path $coop 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $coopBin | Out-Null
          @'
          <Module><Id value="Coop"/><Version value="v1.3.15"/><DependedModules>
            <DependedModule Id="Native" DependentVersion="v1.3.15"/>
            <DependedModule Id="SandBoxCore" DependentVersion="v1.3.15"/>
            <DependedModule Id="Sandbox" DependentVersion="v1.3.15"/>
            <DependedModule Id="CustomBattle" DependentVersion="v1.3.15"/>
            <DependedModule Id="StoryMode" DependentVersion="v1.3.15"/>
          </DependedModules></Module>
          '@ | Set-Content -LiteralPath (Join-Path $coop 'SubModule.xml') -Encoding UTF8
          foreach ($assembly in @('Coop.dll','Coop.Core.dll','GameInterface.dll')) {
            Set-Content -LiteralPath (Join-Path $coopBin $assembly) -Value 'CI placeholder' -Encoding ASCII
          }

          "KAITOR_TOR_LAUNCH_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate TOR campaign launcher dry run
        shell: pwsh
        run: |
          $output = ./projects/KaiTOROnline/runtime/Start-KaiTORTorCampaignServer.ps1 `
            -BannerlordRoot $env:KAITOR_TOR_LAUNCH_ROOT `
            -SaveName 'KaiTOR-TOR-CI' `
            -Visibility none `
            -SkipVersionCheck `
            -DryRun 3>&1 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'TOR compatibility preflight: PASS \(TOR launch authorized\)') { throw 'TOR launcher bypassed TOR compatibility preflight.' }
          if ($output -notmatch 'Runtime preflight: PASS \(launch authorized\)') { throw 'TOR launcher bypassed base KaiTOR runtime preflight.' }
          if ($output -notmatch 'TOR_Armory, TOR_Environment, TOR_Core, Coop') { throw 'TOR launch module order is incomplete.' }
          if ($output -notmatch '/coopsave KaiTOR-TOR-CI') { throw 'TOR launch did not preserve Coop save contract.' }
          if ($output -notmatch 'DRY RUN: process not started') { throw 'TOR launcher dry run did not complete.' }

      - name: Validate TOR launch rejects missing TOR runtime assembly
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:KAITOR_TOR_LAUNCH_ROOT 'Modules/TOR_Core/bin/Win64_Shipping_Client/TOR_Core.dll') -Force
          $failed = $false
          try {
            ./projects/KaiTOROnline/runtime/Start-KaiTORTorCampaignServer.ps1 `
              -BannerlordRoot $env:KAITOR_TOR_LAUNCH_ROOT `
              -SaveName 'KaiTOR-TOR-CI' `
              -SkipVersionCheck `
              -DryRun | Out-Null
          }
          catch {
            $failed = $true
            Write-Host $_.Exception.Message
            if ($_.Exception.Message -notmatch 'TOR_Core.dll') { throw }
          }
          if (-not $failed) { throw 'TOR launcher accepted a runtime missing TOR_Core.dll.' }
