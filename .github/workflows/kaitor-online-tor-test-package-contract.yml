name: KaiTOR Online TOR Test Package Contract

on:
  push:
    branches:
      - kaitor-online-4p
    paths:
      - 'projects/KaiTOROnline/runtime/Test-KaiTORTorTestPackage.ps1'
      - 'projects/KaiTOROnline/runtime/Test-KaiTORTorLiveReadiness.ps1'
      - 'projects/KaiTOROnline/runtime/TOR_RUNTIME_CONTRACT.txt'
      - 'projects/KaiTOROnline/runtime/modules.tor-1.3.15.txt'
      - '.github/workflows/kaitor-online-tor-test-package-contract.yml'
  workflow_dispatch:

jobs:
  test-package-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout KaiTOR project
        uses: actions/checkout@v4

      - name: Assemble synthetic TOR test package fixture
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KaiTOR-TOR-test-package'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'Modules/Coop/bin/Win64_Shipping_Client') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'Runtime') | Out-Null

          @'
          <Module>
            <Id value="Coop" />
            <DependedModules>
              <DependedModule Id="Native" DependentVersion="v1.3.15" />
              <DependedModule Id="SandBoxCore" DependentVersion="v1.3.15" />
              <DependedModule Id="Sandbox" DependentVersion="v1.3.15" />
              <DependedModule Id="CustomBattle" DependentVersion="v1.3.15" />
              <DependedModule Id="StoryMode" DependentVersion="v1.3.15" />
            </DependedModules>
          </Module>
          '@ | Set-Content -LiteralPath (Join-Path $stage 'Modules/Coop/SubModule.xml') -Encoding UTF8
          foreach ($assembly in @('Coop.dll','Coop.Core.dll','GameInterface.dll','Missions.dll')) {
            Set-Content -LiteralPath (Join-Path $stage "Modules/Coop/bin/Win64_Shipping_Client/$assembly") -Value 'CI placeholder' -Encoding ASCII
          }

          Copy-Item ./projects/KaiTOROnline/runtime/* (Join-Path $stage 'Runtime') -Force
          @(
            'KaiTOR Online TOR live test package',
            'Target: Mount & Blade II Bannerlord 1.3.15.110062',
            'Target mod: The Old Realms 1.3.15',
            'Admission limit: 4 simultaneous players',
            'Campaign authority: Bannerlord.exe /singleplayer /server',
            'Game and TOR assemblies are not included.',
            "Source commit: $env:GITHUB_SHA"
          ) | Set-Content -LiteralPath (Join-Path $stage 'BUILD.txt') -Encoding UTF8

          Get-ChildItem $stage -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              $relative = [IO.Path]::GetRelativePath($stage, $_.FullName)
              "$($hash.Hash)  $relative"
            } | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding ASCII

          "KAITOR_TEST_PACKAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate TOR test package contract
        shell: pwsh
        run: ./projects/KaiTOROnline/runtime/Test-KaiTORTorTestPackage.ps1 -PackageRoot $env:KAITOR_TEST_PACKAGE

      - name: Exercise TOR live-readiness preflight
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'KaiTOR-TOR-live-readiness'
          $bin = Join-Path $root 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Set-Content -LiteralPath (Join-Path $bin 'Bannerlord.exe') -Value 'CI placeholder' -Encoding ASCII

          foreach ($module in @('Native','SandBoxCore','Sandbox','CustomBattle','StoryMode','TOR_Armory','TOR_Environment')) {
            $moduleDir = Join-Path $root ("Modules/{0}" -f $module)
            New-Item -ItemType Directory -Force -Path $moduleDir | Out-Null
            ('<Module><Id value="{0}" /><Version value="v1.3.15" /></Module>' -f $module) |
              Set-Content -LiteralPath (Join-Path $moduleDir 'SubModule.xml') -Encoding UTF8
          }

          $torCore = Join-Path $root 'Modules/TOR_Core'
          $torCoreBin = Join-Path $torCore 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $torCoreBin | Out-Null
          @'
          <Module>
            <Id value="TOR_Core" />
            <Version value="v1.3.15" />
            <DependedModules>
              <DependedModule Id="Native" DependentVersion="v1.3.15" />
              <DependedModule Id="SandBoxCore" DependentVersion="v1.3.15" />
              <DependedModule Id="Sandbox" DependentVersion="v1.3.15" />
              <DependedModule Id="TOR_Armory" DependentVersion="v1.3.15" />
              <DependedModule Id="TOR_Environment" DependentVersion="v1.3.15" />
            </DependedModules>
            <SubModules>
              <SubModule>
                <DLLName value="TOR_Core.dll" />
                <Tags>
                  <Tag key="DedicatedServerType" value="none" />
                  <Tag key="IsNoRenderModeElement" value="false" />
                </Tags>
              </SubModule>
            </SubModules>
          </Module>
          '@ | Set-Content -LiteralPath (Join-Path $torCore 'SubModule.xml') -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $torCoreBin 'TOR_Core.dll') -Value 'CI TOR placeholder' -Encoding ASCII

          Copy-Item (Join-Path $env:KAITOR_TEST_PACKAGE 'Modules/Coop') (Join-Path $root 'Modules/Coop') -Recurse -Force

          $output = ./projects/KaiTOROnline/runtime/Test-KaiTORTorLiveReadiness.ps1 `
            -PackageRoot $env:KAITOR_TEST_PACKAGE `
            -BannerlordRoot $root `
            -SaveName 'KaiTOR-CI-Live-Readiness' `
            -SkipVersionCheck 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'KaiTOR TOR live readiness: PASS') { throw 'Live-readiness preflight did not reach PASS.' }
          if ($output -notmatch 'exact SHA-256 match') { throw 'Live-readiness preflight did not verify installed payload identity.' }
          if ($output -notmatch 'DRY RUN: process not started') { throw 'Live-readiness preflight did not exercise the TOR launcher dry run.' }

      - name: Reject package missing TOR launcher
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP 'KaiTOR-TOR-missing-launcher'
          Copy-Item $env:KAITOR_TEST_PACKAGE $copy -Recurse -Force
          Remove-Item -LiteralPath (Join-Path $copy 'Runtime/Start-KaiTORTorCampaignServer.ps1') -Force
          $failed = $false
          try {
            ./projects/KaiTOROnline/runtime/Test-KaiTORTorTestPackage.ps1 -PackageRoot $copy
          } catch {
            $failed = $true
            Write-Host "Expected rejection: $($_.Exception.Message)"
          }
          if (-not $failed) { throw 'Package without TOR launcher was incorrectly accepted.' }

      - name: Reject redistributed TOR game files
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP 'KaiTOR-TOR-forbidden-files'
          Copy-Item $env:KAITOR_TEST_PACKAGE $copy -Recurse -Force
          $forbiddenDir = Join-Path $copy 'Modules/TOR_Core/bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $forbiddenDir | Out-Null
          Set-Content -LiteralPath (Join-Path $forbiddenDir 'TOR_Core.dll') -Value 'must not redistribute' -Encoding ASCII
          $failed = $false
          try {
            ./projects/KaiTOROnline/runtime/Test-KaiTORTorTestPackage.ps1 -PackageRoot $copy
          } catch {
            $failed = $true
            Write-Host "Expected rejection: $($_.Exception.Message)"
          }
          if (-not $failed) { throw 'Package redistributing TOR files was incorrectly accepted.' }

      - name: Reject broken TOR module order
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP 'KaiTOR-TOR-bad-order'
          Copy-Item $env:KAITOR_TEST_PACKAGE $copy -Recurse -Force
          $moduleFile = Join-Path $copy 'Runtime/modules.tor-1.3.15.txt'
          $lines = Get-Content -LiteralPath $moduleFile
          $core = [Array]::IndexOf($lines, 'TOR_Core')
          $environment = [Array]::IndexOf($lines, 'TOR_Environment')
          if ($core -lt 0 -or $environment -lt 0) { throw 'Fixture module list does not contain expected TOR modules.' }
          $tmp = $lines[$core]
          $lines[$core] = $lines[$environment]
          $lines[$environment] = $tmp
          Set-Content -LiteralPath $moduleFile -Value $lines -Encoding UTF8
          $failed = $false
          try {
            ./projects/KaiTOROnline/runtime/Test-KaiTORTorTestPackage.ps1 -PackageRoot $copy
          } catch {
            $failed = $true
            Write-Host "Expected rejection: $($_.Exception.Message)"
          }
          if (-not $failed) { throw 'Package with broken TOR load order was incorrectly accepted.' }

      - name: Reject tampered hashed package file
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP 'KaiTOR-TOR-tampered-hash'
          Copy-Item $env:KAITOR_TEST_PACKAGE $copy -Recurse -Force
          Add-Content -LiteralPath (Join-Path $copy 'Runtime/Start-KaiTORTorCampaignServer.ps1') -Value '# tampered after manifest generation'
          $failed = $false
          try {
            ./projects/KaiTOROnline/runtime/Test-KaiTORTorTestPackage.ps1 -PackageRoot $copy
          } catch {
            $failed = $true
            Write-Host "Expected integrity rejection: $($_.Exception.Message)"
          }
          if (-not $failed) { throw 'Tampered package file was incorrectly accepted.' }
