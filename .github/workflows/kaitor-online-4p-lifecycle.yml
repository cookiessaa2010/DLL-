name: KaiTOR Online 4P Lifecycle Continuity

on:
  push:
    branches:
      - kaitor-online-4p
    paths:
      - 'projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerLifecycle.ps1'
      - 'projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerRestartReconnect.ps1'
      - 'projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerSuccessorIsolation.ps1'
      - 'projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerSnapshot.ps1'
      - '.github/workflows/kaitor-online-4p-lifecycle.yml'
  workflow_dispatch:

jobs:
  validate-lifecycle:
    runs-on: windows-latest

    steps:
      - name: Checkout KaiTOR project
        uses: actions/checkout@v4

      - name: Build lifecycle fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path fixtures | Out-Null

          function New-Player {
            param([string]$Id, [bool]$Connected, [double]$X, [double]$Y)
            [ordered]@{
              controllerId = "controller-$Id"
              heroId = "hero-$Id"
              mobilePartyId = "party-$Id"
              clanId = "clan-$Id"
              characterObjectId = "character-$Id"
              connected = $Connected
              partyResolved = $true
              partyActive = $Connected
              mapEventId = ''
              positionX = $X
              positionY = $Y
            }
          }

          function New-Snapshot {
            param([string[]]$ConnectedIds)

            $connected = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            foreach ($id in $ConnectedIds) { [void]$connected.Add($id) }

            $players = @(
              New-Player A ($connected.Contains('A')) 101.25 201.5
              New-Player B ($connected.Contains('B')) 302.75 402.0
              New-Player C ($connected.Contains('C')) 503.5 604.25
              New-Player D ($connected.Contains('D')) 705.0 806.75
            )

            return [ordered]@{
              activeAdmissionSlots = $ConnectedIds.Count
              playerRegistryCount = 4
              players = $players
            }
          }

          function New-SuccessorSnapshot {
            param([string[]]$ConnectedIds)

            $snapshot = New-Snapshot $ConnectedIds
            $snapshot.players[1].heroId = 'hero-B-successor'
            $snapshot.players[1].mobilePartyId = 'party-B-successor'
            $snapshot.players[1].characterObjectId = 'character-B-successor'
            $snapshot.players[1].positionX = 333.25
            $snapshot.players[1].positionY = 444.5
            return $snapshot
          }

          $online = New-Snapshot @('A','B','C','D')
          $online | ConvertTo-Json -Depth 8 | Set-Content fixtures/four-online.json -Encoding utf8

          $freed = New-Snapshot @('A','B','C')
          $freed | ConvertTo-Json -Depth 8 | Set-Content fixtures/slot-freed.json -Encoding utf8

          $reconnected = New-Snapshot @('A','B','C','D')
          $reconnected | ConvertTo-Json -Depth 8 | Set-Content fixtures/reconnected.json -Encoding utf8
          $reconnected | ConvertTo-Json -Depth 8 | Set-Content fixtures/restarted.json -Encoding utf8

          # Full server restart starts with four persistent registrations but no live NetPeers.
          (New-Snapshot @()) | ConvertTo-Json -Depth 8 | Set-Content fixtures/after-restart.json -Encoding utf8

          # Intentionally reconnect in a different order from A/B/C/D: D -> B -> A -> C.
          (New-Snapshot @('D')) | ConvertTo-Json -Depth 8 | Set-Content fixtures/reconnect-1.json -Encoding utf8
          (New-Snapshot @('D','B')) | ConvertTo-Json -Depth 8 | Set-Content fixtures/reconnect-2.json -Encoding utf8
          (New-Snapshot @('D','B','A')) | ConvertTo-Json -Depth 8 | Set-Content fixtures/reconnect-3.json -Encoding utf8
          (New-Snapshot @('D','B','A','C')) | ConvertTo-Json -Depth 8 | Set-Content fixtures/reconnect-4.json -Encoding utf8

          # Controller B survives death, but its dead Hero/MobileParty/CharacterObject is replaced.
          # Clan is preserved in this fixture because TOR/Bannerlord succession policy may choose
          # inheritance or replacement; the runtime contract only forbids cross-controller aliasing.
          (New-SuccessorSnapshot @('A','B','C','D')) | ConvertTo-Json -Depth 8 | Set-Content fixtures/after-successor.json -Encoding utf8

          # The successor graph must be the graph persisted by the next server save/restart.
          (New-SuccessorSnapshot @()) | ConvertTo-Json -Depth 8 | Set-Content fixtures/successor-after-restart.json -Encoding utf8
          (New-SuccessorSnapshot @('D')) | ConvertTo-Json -Depth 8 | Set-Content fixtures/successor-reconnect-1.json -Encoding utf8
          (New-SuccessorSnapshot @('D','B')) | ConvertTo-Json -Depth 8 | Set-Content fixtures/successor-reconnect-2.json -Encoding utf8
          (New-SuccessorSnapshot @('D','B','A')) | ConvertTo-Json -Depth 8 | Set-Content fixtures/successor-reconnect-3.json -Encoding utf8
          (New-SuccessorSnapshot @('D','B','A','C')) | ConvertTo-Json -Depth 8 | Set-Content fixtures/successor-reconnect-4.json -Encoding utf8

      - name: Validate preserved controller-to-campaign identity graph
        shell: pwsh
        run: |
          ./projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerLifecycle.ps1 `
            -FourOnlineSnapshotPath ./fixtures/four-online.json `
            -SlotFreedSnapshotPath ./fixtures/slot-freed.json `
            -ReconnectedSnapshotPath ./fixtures/reconnected.json `
            -RestartedSnapshotPath ./fixtures/restarted.json

      - name: Validate restart and out-of-order reconnect state
        shell: pwsh
        run: |
          ./projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerRestartReconnect.ps1 `
            -BeforeRestartSnapshotPath ./fixtures/four-online.json `
            -AfterRestartSnapshotPath ./fixtures/after-restart.json `
            -ReconnectSnapshotPaths @(
              './fixtures/reconnect-1.json',
              './fixtures/reconnect-2.json',
              './fixtures/reconnect-3.json',
              './fixtures/reconnect-4.json'
            ) `
            -ExpectedReconnectOrder @('controller-D','controller-B','controller-A','controller-C')

      - name: Validate death-to-successor isolation with four connected players
        shell: pwsh
        run: |
          ./projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerSuccessorIsolation.ps1 `
            -BeforeDeathSnapshotPath ./fixtures/four-online.json `
            -AfterSuccessorSnapshotPath ./fixtures/after-successor.json `
            -SuccessorControllerId 'controller-B'

      - name: Validate successor graph survives save restart and out-of-order reconnect
        shell: pwsh
        run: |
          ./projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerRestartReconnect.ps1 `
            -BeforeRestartSnapshotPath ./fixtures/after-successor.json `
            -AfterRestartSnapshotPath ./fixtures/successor-after-restart.json `
            -ReconnectSnapshotPaths @(
              './fixtures/successor-reconnect-1.json',
              './fixtures/successor-reconnect-2.json',
              './fixtures/successor-reconnect-3.json',
              './fixtures/successor-reconnect-4.json'
            ) `
            -ExpectedReconnectOrder @('controller-D','controller-B','controller-A','controller-C')

      - name: Reject identity drift across reconnect
        shell: pwsh
        run: |
          $bad = Get-Content ./fixtures/reconnected.json -Raw | ConvertFrom-Json
          $bad.players[3].mobilePartyId = 'party-D-REPLACED'
          $bad | ConvertTo-Json -Depth 8 | Set-Content ./fixtures/reconnected-bad.json -Encoding utf8

          $failed = $false
          try {
            ./projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerLifecycle.ps1 `
              -FourOnlineSnapshotPath ./fixtures/four-online.json `
              -SlotFreedSnapshotPath ./fixtures/slot-freed.json `
              -ReconnectedSnapshotPath ./fixtures/reconnected-bad.json
          }
          catch {
            $failed = $true
            Write-Host "Expected rejection: $($_.Exception.Message)"
          }

          if (-not $failed) {
            throw 'Lifecycle validator accepted a replaced MobileParty identity across reconnect.'
          }

      - name: Reject position drift across server restart
        shell: pwsh
        run: |
          $bad = Get-Content ./fixtures/after-restart.json -Raw | ConvertFrom-Json
          $bad.players[1].positionX = [double]$bad.players[1].positionX + 25.0
          $bad | ConvertTo-Json -Depth 8 | Set-Content ./fixtures/after-restart-position-bad.json -Encoding utf8

          $failed = $false
          try {
            ./projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerRestartReconnect.ps1 `
              -BeforeRestartSnapshotPath ./fixtures/four-online.json `
              -AfterRestartSnapshotPath ./fixtures/after-restart-position-bad.json `
              -ReconnectSnapshotPaths @(
                './fixtures/reconnect-1.json',
                './fixtures/reconnect-2.json',
                './fixtures/reconnect-3.json',
                './fixtures/reconnect-4.json'
              ) `
              -ExpectedReconnectOrder @('controller-D','controller-B','controller-A','controller-C')
          }
          catch {
            $failed = $true
            Write-Host "Expected rejection: $($_.Exception.Message)"
          }

          if (-not $failed) {
            throw 'Restart/reconnect validator accepted authoritative party position drift.'
          }

      - name: Reject reconnect-order mismatch
        shell: pwsh
        run: |
          $failed = $false
          try {
            ./projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerRestartReconnect.ps1 `
              -BeforeRestartSnapshotPath ./fixtures/four-online.json `
              -AfterRestartSnapshotPath ./fixtures/after-restart.json `
              -ReconnectSnapshotPaths @(
                './fixtures/reconnect-1.json',
                './fixtures/reconnect-2.json',
                './fixtures/reconnect-3.json',
                './fixtures/reconnect-4.json'
              ) `
              -ExpectedReconnectOrder @('controller-A','controller-B','controller-C','controller-D')
          }
          catch {
            $failed = $true
            Write-Host "Expected rejection: $($_.Exception.Message)"
          }

          if (-not $failed) {
            throw 'Restart/reconnect validator accepted a reconnect sequence that did not match observed live peers.'
          }

      - name: Reject successor reuse of dead MobileParty
        shell: pwsh
        run: |
          $bad = Get-Content ./fixtures/after-successor.json -Raw | ConvertFrom-Json
          $bad.players[1].mobilePartyId = 'party-B'
          $bad | ConvertTo-Json -Depth 8 | Set-Content ./fixtures/after-successor-dead-party-bad.json -Encoding utf8

          $failed = $false
          try {
            ./projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerSuccessorIsolation.ps1 `
              -BeforeDeathSnapshotPath ./fixtures/four-online.json `
              -AfterSuccessorSnapshotPath ./fixtures/after-successor-dead-party-bad.json `
              -SuccessorControllerId 'controller-B'
          }
          catch {
            $failed = $true
            Write-Host "Expected rejection: $($_.Exception.Message)"
          }

          if (-not $failed) {
            throw 'Successor isolation validator accepted reuse of the dead MobileParty.'
          }

      - name: Reject mutation of an unaffected player graph
        shell: pwsh
        run: |
          $bad = Get-Content ./fixtures/after-successor.json -Raw | ConvertFrom-Json
          $bad.players[2].heroId = 'hero-C-mutated'
          $bad | ConvertTo-Json -Depth 8 | Set-Content ./fixtures/after-successor-other-player-bad.json -Encoding utf8

          $failed = $false
          try {
            ./projects/KaiTOROnline/runtime/Test-KaiTORFourPlayerSuccessorIsolation.ps1 `
              -BeforeDeathSnapshotPath ./fixtures/four-online.json `
              -AfterSuccessorSnapshotPath ./fixtures/after-successor-other-player-bad.json `
              -SuccessorControllerId 'controller-B'
          }
          catch {
            $failed = $true
            Write-Host "Expected rejection: $($_.Exception.Message)"
          }

          if (-not $failed) {
            throw 'Successor isolation validator accepted mutation of an unaffected player graph.'
          }
