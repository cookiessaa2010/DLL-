name: KaiTOR Portrait Fix 0.6.3 Save Preview Only RC4

on:
  push:
    branches:
      - kaitor-portrait-fix-0.6.3-savepreview-only
    paths:
      - 'projects/KaiTORPortraitFix/**'
      - '.github/workflows/kaitor-portrait-fix-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -p:NuGetAudit=false

      - name: Validate save-preview-only source contract
        shell: pwsh
        run: |
          [xml]$xml = Get-Content ./projects/KaiTORPortraitFix/module/SubModule.xml -Raw
          if ($xml.Module.Id.value -ne 'KaiTOR_PortraitFix') { throw 'Unexpected module id.' }
          if ($xml.Module.Version.value -ne 'v1.3.15.63') { throw 'Expected v1.3.15.63.' }
          $deps = @($xml.Module.DependedModules.DependedModule | ForEach-Object { $_.Id })
          if ($deps -notcontains 'TOR_Core') { throw 'TOR_Core dependency missing.' }

          $srcRoot = './projects/KaiTORPortraitFix/src/KaiTORPortraitFix'
          $sourceFiles = @(Get-ChildItem $srcRoot -Filter '*.cs' -File)
          $sourceNames = @($sourceFiles.Name | Sort-Object)
          $expected = @('PortraitFixLog.cs','SavedGamePreviewCodePatch.cs','SubModule.cs')
          if ((Compare-Object $sourceNames $expected).Count -ne 0) {
            throw ('Unexpected C# source set: ' + ($sourceNames -join ', '))
          }

          $joined = ($sourceFiles | Get-Content -Raw) -join "`n"
          foreach ($forbidden in @(
            'ActionIndexCache',
            'CharacterTableau',
            'BasicCharacterTableau',
            'SetAgentActionChannel',
            'MBSkeletonExtensions',
            'CharacterCreationScreen',
            'BodyProperties',
            'FaceGen',
            'HarmonyTranspiler',
            'TaleWorlds.Engine'
          )) {
            if ($joined -match [regex]::Escape($forbidden)) {
              throw "Forbidden model/pose hook found: $forbidden"
            }
          }

          $vm = Get-Content "$srcRoot/SavedGamePreviewCodePatch.cs" -Raw
          foreach ($required in @(
            'SavedGameVM',
            'MainHeroVisualCode',
            'GetCharacterVisualCode',
            'SAVE_VM_FIX',
            'restore-preview-code'
          )) {
            if ($vm -notmatch [regex]::Escape($required)) { throw "Missing VM restore contract: $required" }
          }
          if ($vm -match '\.Save\s*=') { throw 'Preview patch must not write the save object.' }

          $sub = Get-Content "$srcRoot/SubModule.cs" -Raw
          foreach ($required in @(
            '0.6.3-savepreview-only',
            'vmPreviewRestore=true',
            'poseHooks=false',
            'actionCacheWrites=false',
            'skeletonCalls=false',
            'characterCreationHooks=false'
          )) {
            if ($sub -notmatch [regex]::Escape($required)) { throw "Missing runtime safety marker: $required" }
          }

          $proj = Get-Content "$srcRoot/KaiTORPortraitFix.csproj" -Raw
          if ($proj -notmatch '<AssemblyVersion>0.6.3.0</AssemblyVersion>') { throw 'Assembly version missing.' }
          if ($proj -notmatch '<FileVersion>0.6.3.0</FileVersion>') { throw 'File version missing.' }

      - name: Build module from source
        shell: pwsh
        run: dotnet build ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Assemble RC4 package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-v1.3.15.63-RC4'
          $module = Join-Path $stage 'Modules/KaiTOR_PortraitFix'
          $bin = Join-Path $module 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          Copy-Item ./projects/KaiTORPortraitFix/module/SubModule.xml (Join-Path $module 'SubModule.xml')
          Copy-Item ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/bin/Release/net472/KaiTORPortraitFix.dll (Join-Path $bin 'KaiTORPortraitFix.dll')
          Copy-Item ./projects/KaiTORPortraitFix/README_RU.md (Join-Path $stage 'README_RU.md')

          @'
          KaiTOR Portrait Fix v1.3.15.63 RC4
          Assembly/File version: 0.6.3.0
          Bannerlord 1.3.15.110062 + The Old Realms 1.3.15

          RC4 is rebuilt from source as SAVE-PREVIEW-ONLY.

          Runtime scope:
          - Harmony postfix on SavedGameVM constructors only.
          - Restore MainHeroVisualCode from existing save metadata only when VM code is empty.
          - Never write the save object.

          Explicitly absent:
          - CharacterTableau / BasicCharacterTableau hooks
          - ActionIndexCache reads/writes
          - pose/idle manipulation
          - SetAgentActionChannel / skeleton calls
          - Character Creation hooks
          - FaceGen / BodyProperties / race / gender / age mutation

          Required live test:
          1. New campaign -> Character Creation.
          2. Banner Editor and Clan Name.
          3. Character / Inventory / Party / Clan.
          4. Save game -> Save/Load preview.
          5. Reload the save.

          Log:
          %LOCALAPPDATA%\KaiTORPortraitFix\KaiTORPortraitFix.log
          '@ | Set-Content (Join-Path $stage 'RELEASE_NOTES_0.6.3_RU.txt') -Encoding UTF8

          @'
          STATIC VALIDATION RC4

          Build: source compile, not binary patch.
          Module: v1.3.15.63
          Assembly/File: 0.6.3.0

          CI contracts:
          PASS only if source set is exactly:
          - PortraitFixLog.cs
          - SavedGamePreviewCodePatch.cs
          - SubModule.cs

          CI rejects any occurrence in C# source of:
          ActionIndexCache, CharacterTableau, BasicCharacterTableau,
          SetAgentActionChannel, MBSkeletonExtensions, CharacterCreation,
          BodyProperties, FaceGen, HarmonyTranspiler, TaleWorlds.Engine.

          Therefore RC4 has no code path that changes character pose/skeleton/model state.
          Live Bannerlord/TOR test is still required.
          '@ | Set-Content (Join-Path $stage 'VALIDATION_REPORT_RU.txt') -Encoding UTF8

          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object {
            $_.Name -like 'TaleWorlds*.dll' -or $_.Name -eq '0Harmony.dll' -or $_.Extension -eq '.pdb'
          }
          if ($forbidden) { throw 'Forbidden dependency/debug files found in package.' }

          $zip = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-v1.3.15.63-RC4-Bannerlord-1.3.15.110062.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

          $verify = Join-Path $env:RUNNER_TEMP 'verify-rc4'
          Expand-Archive -Path $zip -DestinationPath $verify -Force
          if (-not (Test-Path (Join-Path $verify 'Modules/KaiTOR_PortraitFix/bin/Win64_Shipping_Client/KaiTORPortraitFix.dll'))) {
            throw 'Packaged DLL missing after archive verification.'
          }

          $hashFile = Join-Path $env:RUNNER_TEMP 'SHA256.txt'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content $hashFile -Encoding ascii

          "PORTRAIT_FIX_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTRAIT_FIX_HASH=$hashFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-PortraitFix-v1.3.15.63-RC4-savepreview-only
          path: |
            ${{ env.PORTRAIT_FIX_ZIP }}
            ${{ env.PORTRAIT_FIX_HASH }}
          if-no-files-found: error
          retention-days: 30
