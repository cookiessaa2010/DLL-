name: KaiTOR Portrait Fix 0.6.1 Character Creation Safe Build

on:
  push:
    branches:
      - kaitor-portrait-fix-0.6.1-charactercreation-safe
    paths:
      - 'projects/KaiTORPortraitFix/**'
      - '.github/workflows/kaitor-portrait-fix-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj

      - name: Build module
        shell: pwsh
        run: dotnet build ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Validate regression contracts
        shell: pwsh
        run: |
          [xml]$xml = Get-Content ./projects/KaiTORPortraitFix/module/SubModule.xml -Raw
          if ($xml.Module.Id.value -ne 'KaiTOR_PortraitFix') { throw 'Unexpected module id.' }
          if ($xml.Module.Version.value -ne 'v1.3.15.61') { throw 'Expected v1.3.15.61.' }

          $vm = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SavedGamePreviewCodePatch.cs -Raw
          foreach ($required in @('SavedGameVM','MainHeroVisualCode','GetCharacterVisualCode','SAVE_VM_FIX','restore-preview-code')) {
            if ($vm -notmatch [regex]::Escape($required)) { throw "Missing VM restore contract: $required" }
          }
          if ($vm -match '\.Save\s*=') { throw 'Preview patch must not write the save object.' }

          $repair = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/ActionIndexCacheRepair.cs -Raw
          foreach ($required in @(
            'MBAnimation.GetNumActionCodes',
            'MBAnimation.GetActionCodeWithName',
            'act_inventory_idle_start',
            'act_inventory_idle',
            'CharacterTableau',
            'BasicCharacterTableau',
            'GetIdleAction',
            'CHARACTER_CREATION_BYPASS',
            'LOCAL_POSE_FALLBACK',
            'IsCharacterCreationScreenActive'
          )) {
            if ($repair -notmatch [regex]::Escape($required)) { throw "Missing local pose-fallback contract: $required" }
          }
          if ($repair -match 'field\.SetValue') { throw '0.6.1 must not write ActionIndexCache static fields.' }
          if ($repair -match 'BindingFlags\.Public\s*\|\s*BindingFlags\.Static') { throw '0.6.1 must not reflect over ActionIndexCache static fields.' }

          $sub = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SubModule.cs -Raw
          foreach ($required in @(
            '0.6.1-regression',
            'globalActionCacheWrites=false',
            'localRuntimeFallbacks=true',
            'characterCreationBypass=true',
            'diagnostics=false'
          )) {
            if ($sub -notmatch [regex]::Escape($required)) { throw "Missing runtime marker: $required" }
          }

          $proj = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -Raw
          if ($proj -notmatch '<AssemblyVersion>0.6.1.0</AssemblyVersion>') { throw 'Assembly version missing.' }
          if ($proj -notmatch '<FileVersion>0.6.1.0</FileVersion>') { throw 'File version missing.' }

      - name: Assemble root-installable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-0.6.1-charactercreation-safe'
          $module = Join-Path $stage 'Modules/KaiTOR_PortraitFix'
          $bin = Join-Path $module 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          Copy-Item ./projects/KaiTORPortraitFix/module/SubModule.xml (Join-Path $module 'SubModule.xml')
          Copy-Item ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/bin/Release/net472/KaiTORPortraitFix.dll (Join-Path $bin 'KaiTORPortraitFix.dll')
          Copy-Item ./projects/KaiTORPortraitFix/README_RU.md (Join-Path $stage 'README_RU.md')

          @'
          KaiTOR Portrait Fix 0.6.1 REGRESSION
          Launcher version: v1.3.15.61
          Bannerlord 1.3.15.110062 + The Old Realms 1.3.15

          Reason for this regression build:
          - 0.6.0 globally rewrote two ActionIndexCache static readonly values.
          - Live testing showed corrupted/horizontal character creation previews.
          - A repeat character-creation attempt ended in native access violation 0xC0000005.
          - KaiTOR_Diplomacy was disabled in that crash session.

          0.6.1 safety change:
          - no ActionIndexCache static writes;
          - local live fallback only when a tableau asks for an invalid idle action;
          - BasicCharacterTableau fallback changes only the current preview skeleton;
          - CharacterCreationScreen is explicitly bypassed;
          - SavedGameVM black-preview restore remains unchanged.

          Required regression test:
          1. New campaign -> character creation -> back to menu -> new campaign again.
          2. Save/Load preview.
          3. Skills and Party previews.
          4. Human, Dawi, Vampire and Greenskin preview checks.

          Log:
          %LOCALAPPDATA%\KaiTORPortraitFix\KaiTORPortraitFix.log
          '@ | Set-Content (Join-Path $stage 'RELEASE_NOTES_0.6.1_RU.txt') -Encoding UTF8

          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object { $_.Name -like 'TaleWorlds*.dll' -or $_.Name -eq '0Harmony.dll' }
          if ($forbidden) { throw 'Reference/runtime dependencies must not be redistributed.' }

          $zip = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-0.6.1-charactercreation-safe-Bannerlord-1.3.15.110062.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

          $hashFile = Join-Path $env:RUNNER_TEMP 'SHA256.txt'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content $hashFile -Encoding ascii

          "PORTRAIT_FIX_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTRAIT_FIX_HASH=$hashFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-PortraitFix-0.6.1-charactercreation-safe
          path: |
            ${{ env.PORTRAIT_FIX_ZIP }}
            ${{ env.PORTRAIT_FIX_HASH }}
          if-no-files-found: error
          retention-days: 30
