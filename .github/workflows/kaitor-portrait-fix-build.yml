name: KaiTOR Portrait Fix 0.5.0 Vanilla Rule Test Build

on:
  push:
    branches:
      - kaitor-portrait-fix-0.5.0-vanilla-rule-test
    paths:
      - 'projects/KaiTORPortraitFix/**'
      - '.github/workflows/kaitor-portrait-fix-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj

      - name: Build module
        shell: pwsh
        run: dotnet build ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Validate portrait-fix contracts
        shell: pwsh
        run: |
          [xml]$xml = Get-Content ./projects/KaiTORPortraitFix/module/SubModule.xml -Raw
          if ($xml.Module.Id.value -ne 'KaiTOR_PortraitFix') { throw 'Unexpected module id.' }
          if ($xml.Module.Version.value -ne 'v0.5.0') { throw 'Expected v0.5.0.' }

          $vm = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SavedGamePreviewCodePatch.cs -Raw
          foreach ($required in @('SavedGameVM','MainHeroVisualCode','GetCharacterVisualCode','SAVE_VM_FIX','restore-preview-code')) {
            if ($vm -notmatch [regex]::Escape($required)) { throw "Missing VM fix contract: $required" }
          }

          $pose = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/BasicPreviewPosePatch.cs -Raw
          foreach ($required in @(
            '[HarmonyPatch',
            'BasicCharacterTableau',
            'RefreshCharacterTableau',
            'act_inventory_idle',
            'act_inventory_idle_start',
            'ResolveInventoryIdleLikeCharacterTableau',
            'VANILLA_IDLE_PATCH',
            'VANILLA_IDLE_RESOLVE',
            'OpCodes.Ldsfld',
            'OpCodes.Call'
          )) {
            if ($pose -notmatch [regex]::Escape($required)) { throw "Missing vanilla-rule pose contract: $required" }
          }

          $gender = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SavePreviewGenderPatch.cs -Raw
          if ($gender -match '\[HarmonyPatch') { throw 'Gender mutator must stay disabled in vanilla-rule test.' }
          foreach ($required in @('Enabled = false','MUTATOR_DISABLED','save-preview-gender','safe-isolation')) {
            if ($gender -notmatch [regex]::Escape($required)) { throw "Missing disabled gender contract: $required" }
          }

          $diag = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SaveLoadPipelineDiagnostics.cs -Raw
          if ($diag -notmatch 'PIPE_HEROCODE') { throw 'Pipeline diagnostics missing.' }

          $sub = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SubModule.cs -Raw
          if ($sub -notmatch '0.5.0-vanilla-rule-test') { throw 'Runtime version marker missing.' }
          if ($sub -notmatch 'basicTableauVanillaIdleRule=true') { throw 'Vanilla-rule state marker missing.' }

          $proj = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -Raw
          if ($proj -notmatch '<AssemblyVersion>0.5.0.0</AssemblyVersion>') { throw 'Assembly version missing.' }

      - name: Assemble root-installable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-0.5.0-vanilla-rule-test'
          $module = Join-Path $stage 'Modules/KaiTOR_PortraitFix'
          $bin = Join-Path $module 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          Copy-Item ./projects/KaiTORPortraitFix/module/SubModule.xml (Join-Path $module 'SubModule.xml')
          Copy-Item ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/bin/Release/net472/KaiTORPortraitFix.dll (Join-Path $bin 'KaiTORPortraitFix.dll')
          Copy-Item ./projects/KaiTORPortraitFix/README_RU.md (Join-Path $stage 'README_RU.md')

          @'
          KaiTOR Portrait Fix 0.5.0 VANILLA RULE TEST
          Bannerlord 1.3.15.110062

          Goal:
          - keep the confirmed SavedGameVM visual-code restore;
          - make Save/Load BasicCharacterTableau resolve its inventory idle like the normal in-game CharacterTableau path;
          - avoid the cached ActionIndexCache.act_inventory_idle field and dynamically resolve act_inventory_idle_start at render time;
          - fall back to a dynamically resolved act_inventory_idle only when idle_start is unavailable.

          Not changed:
          - race;
          - skeleton name;
          - equipment/body properties;
          - agent/mount spawn frames;
          - save files;
          - in-game CharacterTableau;
          - gender transpiler remains disabled.

          Test:
          1. Replace Modules/KaiTOR_PortraitFix with this build.
          2. Unblock-File the DLL.
          3. Restart the game completely.
          4. First verify Inventory/Clan/Encyclopedia character previews are unchanged.
          5. Open Saved Campaigns and inspect the same saves that previously showed prone/horizontal heroes.
          6. Capture screenshots for race 0 human and any TOR custom race available.
          7. Send %LOCALAPPDATA%\KaiTORPortraitFix\KaiTORPortraitFix.log.

          Expected startup markers:
          SESSION_START|KaiTOR Portrait Fix 0.5.0-vanilla-rule-test
          VANILLA_IDLE_PATCH|applied=True; replacements=1 ...
          PATCH_APPLY|success=true; ... basicTableauVanillaIdleRule=true

          Key diagnostic markers:
          VANILLA_IDLE_RESOLVE|cachedIdleIndex=...; cachedIdleStartIndex=...; dynamicIdleIndex=...; dynamicIdleStartIndex=...; selected=...
          SAVE_VM_FIX|applied=true ...

          Interpretation:
          - If the hero becomes upright, the Save/Load bind pose was caused by the BasicCharacterTableau idle-action path.
          - If the hero stays prone but VANILLA_IDLE_PATCH applied and dynamicIdleStartIndex is valid, the next test must move to race/action-set/skeleton creation rather than changing save data.
          '@ | Set-Content (Join-Path $stage 'TEST_0.5.0_RU.txt') -Encoding UTF8

          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object { $_.Name -like 'TaleWorlds*.dll' -or $_.Name -eq '0Harmony.dll' }
          if ($forbidden) { throw 'Reference/runtime dependencies must not be redistributed.' }

          $zip = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-0.5.0-vanilla-rule-test-Bannerlord-1.3.15.110062.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hashFile = Join-Path $env:RUNNER_TEMP 'SHA256.txt'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content $hashFile -Encoding ascii
          "PORTRAIT_FIX_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTRAIT_FIX_HASH=$hashFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-PortraitFix-0.5.0-vanilla-rule-test
          path: |
            ${{ env.PORTRAIT_FIX_ZIP }}
            ${{ env.PORTRAIT_FIX_HASH }}
          if-no-files-found: error
          retention-days: 30
