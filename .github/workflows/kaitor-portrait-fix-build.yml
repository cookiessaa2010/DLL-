name: KaiTOR Portrait Fix 0.3.1 Build

on:
  push:
    branches:
      - kaitor-portrait-fix-0.3.1
    paths:
      - 'projects/KaiTORPortraitFix/**'
      - '.github/workflows/kaitor-portrait-fix-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj

      - name: Build module
        shell: pwsh
        run: dotnet build ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Validate portrait-fix contracts
        shell: pwsh
        run: |
          [xml]$xml = Get-Content ./projects/KaiTORPortraitFix/module/SubModule.xml -Raw
          if ($xml.Module.Id.value -ne 'KaiTOR_PortraitFix') { throw 'Unexpected module id.' }
          if ($xml.Module.Version.value -ne 'v0.3.1') { throw 'Expected v0.3.1.' }

          $vm = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SavedGamePreviewCodePatch.cs -Raw
          foreach ($required in @(
            'SavedGameVM',
            'MainHeroVisualCode',
            'GetCharacterVisualCode',
            'IsModuleDiscrepancyDetected',
            'IsCorrupted',
            'HarmonyTargetMethods',
            'GetConstructors',
            'SAVE_VM_TARGETS',
            'SAVE_VM_FIX',
            'restore-preview-code'
          )) {
            if ($vm -notmatch [regex]::Escape($required)) { throw "Missing VM fix contract: $required" }
          }

          $diag = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SaveLoadPipelineDiagnostics.cs -Raw
          foreach ($required in @('SaveLoadHeroTableauTextureProvider','set_HeroVisualCode','DeserializeCharacterCode','PIPE_HEROCODE')) {
            if ($diag -notmatch [regex]::Escape($required)) { throw "Missing diagnostic contract: $required" }
          }

          $patch = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SavePreviewGenderPatch.cs -Raw
          if ($patch -notmatch 'PREVIEW_REFRESH') { throw '0.1 refresh diagnostic must be retained.' }

          $sub = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SubModule.cs -Raw
          if ($sub -notmatch '0.3.1') { throw 'Runtime version marker missing.' }
          if ($sub -notmatch '_patched = true') { throw 'Successful patch-state marker missing.' }
          if ($sub -notmatch '_patched = false') { throw 'Failure patch-state marker missing.' }

      - name: Assemble root-installable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-0.3.1'
          $module = Join-Path $stage 'Modules/KaiTOR_PortraitFix'
          $bin = Join-Path $module 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          Copy-Item ./projects/KaiTORPortraitFix/module/SubModule.xml (Join-Path $module 'SubModule.xml')
          Copy-Item ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/bin/Release/net472/KaiTORPortraitFix.dll (Join-Path $bin 'KaiTORPortraitFix.dll')
          Copy-Item ./projects/KaiTORPortraitFix/README_RU.md (Join-Path $stage 'README_RU.md')

          @'
          KaiTOR Portrait Fix 0.3.1
          Bannerlord 1.3.15.110062

          Hotfix for 0.3.0 Harmony constructor resolution failure.
          The SavedGameVM patch now targets every declared instance constructor explicitly,
          so it is independent of the exact constructor signature in this Bannerlord build.

          It still restores MainHeroVisualCode only for non-corrupted saves when the VM code is empty,
          and does not edit saves or bypass load-time compatibility checks.

          Expected startup log:
          SAVE_VM_TARGETS|constructors=<N>
          PATCH_APPLY|success=true
          COLD_MENU_READY|patchInstalled=True

          Expected affected save log:
          SAVE_VM|... discrepancy=True; vmCodeEmpty=True; metadataCodeEmpty=False ...
          SAVE_VM_FIX|applied=true; reason=restore-preview-code ...
          PIPE_HEROCODE|... empty=false ...
          '@ | Set-Content (Join-Path $stage 'TEST_0.3.1_RU.txt') -Encoding UTF8

          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object { $_.Name -like 'TaleWorlds*.dll' -or $_.Name -eq '0Harmony.dll' }
          if ($forbidden) { throw 'Reference/runtime dependencies must not be redistributed.' }

          $zip = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-0.3.1-Bannerlord-1.3.15.110062.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hashFile = Join-Path $env:RUNNER_TEMP 'SHA256.txt'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content $hashFile -Encoding ascii
          "PORTRAIT_FIX_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTRAIT_FIX_HASH=$hashFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-PortraitFix-0.3.1
          path: |
            ${{ env.PORTRAIT_FIX_ZIP }}
            ${{ env.PORTRAIT_FIX_HASH }}
          if-no-files-found: error
          retention-days: 30
