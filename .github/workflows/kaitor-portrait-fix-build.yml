name: KaiTOR Portrait Fix 0.4.0 Pose Test Build

on:
  push:
    branches:
      - kaitor-portrait-fix-0.4.0-pose
    paths:
      - 'projects/KaiTORPortraitFix/**'
      - '.github/workflows/kaitor-portrait-fix-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj

      - name: Build module
        shell: pwsh
        run: dotnet build ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Validate portrait-fix contracts
        shell: pwsh
        run: |
          [xml]$xml = Get-Content ./projects/KaiTORPortraitFix/module/SubModule.xml -Raw
          if ($xml.Module.Id.value -ne 'KaiTOR_PortraitFix') { throw 'Unexpected module id.' }
          if ($xml.Module.Version.value -ne 'v0.4.0') { throw 'Expected v0.4.0.' }

          $vm = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SavedGamePreviewCodePatch.cs -Raw
          foreach ($required in @('SavedGameVM','MainHeroVisualCode','GetCharacterVisualCode','SAVE_VM_FIX','restore-preview-code')) {
            if ($vm -notmatch [regex]::Escape($required)) { throw "Missing VM fix contract: $required" }
          }

          $pose = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/BasicPreviewPosePatch.cs -Raw
          foreach ($required in @(
            'BasicCharacterTableau',
            'RefreshCharacterTableau',
            'act_inventory_idle',
            'act_inventory_idle_start',
            'POSE_PATCH',
            'POSE_REFRESH',
            '_initialSpawnFrame',
            '_mountSpawnPoint'
          )) {
            if ($pose -notmatch [regex]::Escape($required)) { throw "Missing pose contract: $required" }
          }

          $diag = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SaveLoadPipelineDiagnostics.cs -Raw
          if ($diag -notmatch 'PIPE_HEROCODE') { throw 'Pipeline diagnostics missing.' }

          $patch = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SavePreviewGenderPatch.cs -Raw
          if ($patch -notmatch 'PREVIEW_REFRESH') { throw 'Gender/refresh diagnostic must be retained.' }

          $sub = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SubModule.cs -Raw
          if ($sub -notmatch '0.4.0-pose-test') { throw 'Runtime version marker missing.' }

          $proj = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -Raw
          if ($proj -notmatch '<AssemblyVersion>0.4.0.0</AssemblyVersion>') { throw 'Assembly version missing.' }

      - name: Assemble root-installable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-0.4.0-pose-test'
          $module = Join-Path $stage 'Modules/KaiTOR_PortraitFix'
          $bin = Join-Path $module 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          Copy-Item ./projects/KaiTORPortraitFix/module/SubModule.xml (Join-Path $module 'SubModule.xml')
          Copy-Item ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/bin/Release/net472/KaiTORPortraitFix.dll (Join-Path $bin 'KaiTORPortraitFix.dll')
          Copy-Item ./projects/KaiTORPortraitFix/README_RU.md (Join-Path $stage 'README_RU.md')

          @'
          KaiTOR Portrait Fix 0.4.0 pose test
          Bannerlord 1.3.15.110062

          Measured 0.3.1 result:
          - save metadata visual code is valid version 4 and reaches BasicCharacterTableau;
          - texture is created;
          - characters render horizontally/prone while the separate mount stays upright;
          - this occurs on race 0, race 8 and race 14, so it is not a single custom-race failure.

          This experimental build keeps the preview-code restore and changes only the Save/Load
          BasicCharacterTableau idle action from act_inventory_idle to act_inventory_idle_start,
          matching the default idle used by the normal CharacterTableau. It also logs the resolved
          idle action indices and agent/mount spawn-frame basis for the next diagnosis.

          It does not modify save files.

          Test:
          1. Replace Modules/KaiTOR_PortraitFix with this build and Unblock-File the DLL.
          2. Open Saved Campaigns.
          3. Check one race-0 human save, one race-8 save, and the race-14 orc save if available.
          4. Send %LOCALAPPDATA%\KaiTORPortraitFix\KaiTORPortraitFix.log and screenshots.

          Expected startup:
          POSE_PATCH|applied=True; replacements=1; from=act_inventory_idle; to=act_inventory_idle_start
          PATCH_APPLY|success=true

          Expected preview diagnostics:
          POSE_REFRESH|... idleIndex=...; idleStartIndex=...; agentUp=...; mountUp=...
          '@ | Set-Content (Join-Path $stage 'TEST_0.4.0_RU.txt') -Encoding UTF8

          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object { $_.Name -like 'TaleWorlds*.dll' -or $_.Name -eq '0Harmony.dll' }
          if ($forbidden) { throw 'Reference/runtime dependencies must not be redistributed.' }

          $zip = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-0.4.0-pose-test-Bannerlord-1.3.15.110062.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hashFile = Join-Path $env:RUNNER_TEMP 'SHA256.txt'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content $hashFile -Encoding ascii
          "PORTRAIT_FIX_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTRAIT_FIX_HASH=$hashFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-PortraitFix-0.4.0-pose-test
          path: |
            ${{ env.PORTRAIT_FIX_ZIP }}
            ${{ env.PORTRAIT_FIX_HASH }}
          if-no-files-found: error
          retention-days: 30
