name: KaiTOR Portrait Fix 0.5.1 Action Binding Diagnostics Build

on:
  push:
    branches:
      - kaitor-portrait-fix-0.5.1-action-binding-diagnostics
    paths:
      - 'projects/KaiTORPortraitFix/**'
      - '.github/workflows/kaitor-portrait-fix-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj

      - name: Build module
        shell: pwsh
        run: dotnet build ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Validate diagnostic contracts
        shell: pwsh
        run: |
          [xml]$xml = Get-Content ./projects/KaiTORPortraitFix/module/SubModule.xml -Raw
          if ($xml.Module.Id.value -ne 'KaiTOR_PortraitFix') { throw 'Unexpected module id.' }
          if ($xml.Module.Version.value -ne 'v0.5.1') { throw 'Expected v0.5.1.' }

          $vm = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SavedGamePreviewCodePatch.cs -Raw
          foreach ($required in @('SavedGameVM','MainHeroVisualCode','GetCharacterVisualCode','SAVE_VM_FIX','restore-preview-code')) {
            if ($vm -notmatch [regex]::Escape($required)) { throw "Missing VM fix contract: $required" }
          }

          $pose = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/BasicPreviewPosePatch.cs -Raw
          if ($pose -match '\[HarmonyPatch') { throw 'Pose mutator must be disabled in 0.5.1 diagnostics.' }
          foreach ($required in @('Enabled = false','MUTATOR_DISABLED','basic-preview-pose','0.5.1-action-binding-diagnostics')) {
            if ($pose -notmatch [regex]::Escape($required)) { throw "Missing disabled pose contract: $required" }
          }

          $diag = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/ActionBindingDiagnostics.cs -Raw
          foreach ($required in @('BasicCharacterTableau','CharacterTableau','ACTION_BIND_TARGETS','ACTION_BIND','ACTION_BIND_FIELD','ACTION_BIND_OBJECT','ACTION_BIND_GETTER','ACTION_BIND_SURFACE','act_inventory_idle','act_inventory_idle_start')) {
            if ($diag -notmatch [regex]::Escape($required)) { throw "Missing action-binding diagnostic contract: $required" }
          }

          $sub = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/SubModule.cs -Raw
          if ($sub -notmatch '0.5.1-action-binding-diagnostics') { throw 'Runtime version marker missing.' }
          if ($sub -notmatch 'actionBindingDiagnostics=true') { throw 'Diagnostic state marker missing.' }
          if ($sub -notmatch 'basicPoseMutator=false') { throw 'Pose mutator state marker missing.' }

          $proj = Get-Content ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/KaiTORPortraitFix.csproj -Raw
          if ($proj -notmatch '<AssemblyVersion>0.5.1.0</AssemblyVersion>') { throw 'Assembly version missing.' }

      - name: Assemble root-installable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-0.5.1-action-binding-diagnostics'
          $module = Join-Path $stage 'Modules/KaiTOR_PortraitFix'
          $bin = Join-Path $module 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          Copy-Item ./projects/KaiTORPortraitFix/module/SubModule.xml (Join-Path $module 'SubModule.xml')
          Copy-Item ./projects/KaiTORPortraitFix/src/KaiTORPortraitFix/bin/Release/net472/KaiTORPortraitFix.dll (Join-Path $bin 'KaiTORPortraitFix.dll')
          Copy-Item ./projects/KaiTORPortraitFix/README_RU.md (Join-Path $stage 'README_RU.md')

          @'
          KaiTOR Portrait Fix 0.5.1 ACTION BINDING DIAGNOSTICS
          Bannerlord 1.3.15.110062

          Purpose:
          - keep the confirmed SavedGameVM visual-code restore that removes black placeholders;
          - disable the failed 0.5.0 idle-action mutator;
          - observe BasicCharacterTableau and normal CharacterTableau before/after refresh;
          - record race, skeleton, action indices, interesting runtime fields, action/skeleton objects,
            available action/animation getter surfaces, and safe getter results where possible.

          This build is read-only with respect to pose rendering. It does not change race, skeleton,
          action, equipment, spawn frames or save files.

          Test:
          1. Replace Modules/KaiTOR_PortraitFix with this build and Unblock-File the DLL.
          2. Restart the game completely.
          3. Open Saved Campaigns and select the same broken portrait.
          4. Load the campaign and open the Skills/Character screen where the same hero lies horizontally.
          5. If convenient, also open Inventory/Clan/Encyclopedia previews.
          6. Send %LOCALAPPDATA%\KaiTORPortraitFix\KaiTORPortraitFix.log plus screenshots.

          Key log markers:
          ACTION_BIND_TARGETS
          ACTION_BIND
          ACTION_BIND_FIELD
          ACTION_BIND_OBJECT
          ACTION_BIND_GETTER
          ACTION_BIND_SURFACE
          SAVE_VM_FIX
          '@ | Set-Content (Join-Path $stage 'TEST_0.5.1_RU.txt') -Encoding UTF8

          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object { $_.Name -like 'TaleWorlds*.dll' -or $_.Name -eq '0Harmony.dll' }
          if ($forbidden) { throw 'Reference/runtime dependencies must not be redistributed.' }

          $zip = Join-Path $env:RUNNER_TEMP 'KaiTOR-PortraitFix-0.5.1-action-binding-diagnostics-Bannerlord-1.3.15.110062.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hashFile = Join-Path $env:RUNNER_TEMP 'SHA256.txt'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content $hashFile -Encoding ascii
          "PORTRAIT_FIX_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTRAIT_FIX_HASH=$hashFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-PortraitFix-0.5.1-action-binding-diagnostics
          path: |
            ${{ env.PORTRAIT_FIX_ZIP }}
            ${{ env.PORTRAIT_FIX_HASH }}
          if-no-files-found: error
          retention-days: 30
