name: KaiTOR Online Upstream Integration Check

on:
  push:
    branches:
      - kaitor-online-4p
    paths:
      - 'projects/KaiTOROnline/upstream-overlay/**'
      - 'projects/KaiTOROnline/upstream-patches/**'
      - 'projects/KaiTOROnline/tools/ApplyFourPlayerGate.ps1'
      - 'projects/KaiTOROnline/tools/ApplyNetPeerIdentitySafety.ps1'
      - '.github/workflows/kaitor-online-upstream-patch-check.yml'
  workflow_dispatch:

jobs:
  integrate-four-player-gate:
    runs-on: windows-latest

    steps:
      - name: Checkout KaiTOR project
        uses: actions/checkout@v4
        with:
          path: kaitor

      - name: Checkout pinned Bannerlord Coop source
        uses: actions/checkout@v4
        with:
          repository: Bannerlord-Coop-Team/BannerlordCoop
          ref: 107d1c29ec3dc2d9f2d3a7836ae1691c2391e00c
          path: upstream

      - name: Apply KaiTOR four-player integration
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyFourPlayerGate.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Apply NetPeer reference-identity hardening
        shell: pwsh
        run: ./kaitor/projects/KaiTOROnline/tools/ApplyNetPeerIdentitySafety.ps1 -UpstreamRoot (Resolve-Path ./upstream)

      - name: Validate generated diff
        working-directory: upstream
        shell: pwsh
        run: |
          # PlayerAdmissionGate.cs is a new untracked file. Mark it intent-to-add so git diff
          # includes it without staging any real content into the checked-out upstream tree.
          git add -N source/Coop.Core/Server/Connections/PlayerAdmissionGate.cs
          git diff --check
          $diff = git diff -- source/Coop.Core/Server/Connections source/Coop.Core/Server/Services/Instances source/GameInterface/Services/Players source/Coop.Core/Client/States/ValidateModuleState.cs
          if (-not ($diff -match 'MaxPlayers = 4')) { throw 'Four-player gate was not added.' }
          if (-not ($diff -match 'RejectionReason')) { throw 'Visible admission rejection was not added.' }
          if (-not ($diff -match 'PlayerAdmissionGate.Release')) { throw 'Disconnect slot release was not added.' }
          if (-not ($diff -match 'ReferenceComparer<NetPeer>.Instance')) { throw 'NetPeer reference-identity hardening was not added.' }
          if (-not ($diff -match 'peerToPlayer = new\(ReferenceComparer<NetPeer>.Instance\)')) { throw 'PlayerManager peer map is not reference-safe.' }
          if (-not ($diff -match 'ConnectionStates .*ReferenceComparer<NetPeer>.Instance')) { throw 'Connection state peer map is not reference-safe.' }

      - name: Export generated integration diff
        working-directory: upstream
        shell: pwsh
        run: git diff --binary > ../kaitor/projects/KaiTOROnline/generated-four-player-integration.patch

      - name: Upload generated patch
        uses: actions/upload-artifact@v4
        with:
          name: kaitor-four-player-upstream-integration
          path: kaitor/projects/KaiTOROnline/generated-four-player-integration.patch
          if-no-files-found: error
