name: KaiTOR Online Runtime Preflight

on:
  push:
    branches:
      - kaitor-online-4p
    paths:
      - 'projects/KaiTOROnline/runtime/**'
      - '.github/workflows/kaitor-online-runtime-preflight.yml'
  workflow_dispatch:

jobs:
  runtime-preflight-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout KaiTOR project
        uses: actions/checkout@v4

      - name: Build fake 1.3.15 runtime layout
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'fake-bannerlord-1315-preflight'
          $bin = Join-Path $root 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Set-Content -LiteralPath (Join-Path $bin 'Bannerlord.exe') -Value 'CI placeholder' -Encoding ASCII

          foreach ($module in @('Native', 'SandBoxCore', 'Sandbox', 'CustomBattle', 'StoryMode')) {
            $dir = Join-Path $root ("Modules/{0}" -f $module)
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Set-Content -LiteralPath (Join-Path $dir 'SubModule.xml') -Value '<Module />' -Encoding UTF8
          }

          $coop = Join-Path $root 'Modules/Coop'
          $coopBin = Join-Path $coop 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $coopBin | Out-Null
          @'
          <Module>
            <DependedModules>
              <DependedModule Id="Native" DependentVersion="v1.3.15" />
              <DependedModule Id="SandBoxCore" DependentVersion="v1.3.15" />
              <DependedModule Id="Sandbox" DependentVersion="v1.3.15" />
              <DependedModule Id="CustomBattle" DependentVersion="v1.3.15" />
              <DependedModule Id="StoryMode" DependentVersion="v1.3.15" />
            </DependedModules>
          </Module>
          '@ | Set-Content -LiteralPath (Join-Path $coop 'SubModule.xml') -Encoding UTF8

          foreach ($assembly in @('Coop.dll', 'Coop.Core.dll', 'GameInterface.dll', 'Missions.dll')) {
            Set-Content -LiteralPath (Join-Path $coopBin $assembly) -Value 'CI placeholder' -Encoding ASCII
          }

          "KAITOR_FAKE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate runtime preflight success contract
        shell: pwsh
        run: |
          $output = ./projects/KaiTOROnline/runtime/Test-KaiTORRuntimePreflight.ps1 `
            -BannerlordRoot $env:KAITOR_FAKE_ROOT `
            -SkipVersionCheck 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'runtime preflight: PASS') { throw 'Preflight did not reach PASS.' }
          if ($output -notmatch 'Coop.dll, Coop.Core.dll, GameInterface.dll, Missions.dll') { throw 'Preflight did not validate the complete Coop runtime assembly set.' }

      - name: Validate campaign launcher is gated by runtime preflight
        shell: pwsh
        run: |
          $output = ./projects/KaiTOROnline/runtime/Start-KaiTORCampaignServer.ps1 `
            -BannerlordRoot $env:KAITOR_FAKE_ROOT `
            -SaveName 'KaiTOR-CI-Save' `
            -SkipVersionCheck `
            -DryRun 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'Runtime preflight: PASS \(launch authorized\)') { throw 'Launcher bypassed or failed the runtime preflight gate.' }
          if ($output -notmatch 'DRY RUN: process not started') { throw 'Launcher dry-run contract did not complete.' }
          if ($output -notmatch '/coopsave KaiTOR-CI-Save') { throw 'Launcher did not preserve the Coop save launch contract.' }

      - name: Reject a scalar file-version mismatch cleanly under Windows PowerShell 5.1
        shell: powershell
        run: |
          $versionRoot = Join-Path $env:RUNNER_TEMP 'fake-bannerlord-version-scalar'
          $versionBin = Join-Path $versionRoot 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $versionBin | Out-Null
          Copy-Item -LiteralPath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -Destination (Join-Path $versionBin 'Bannerlord.exe') -Force

          foreach ($script in @(
            './projects/KaiTOROnline/runtime/Test-KaiTORRuntimePreflight.ps1',
            './projects/KaiTOROnline/runtime/Start-KaiTORCampaignServer.ps1'
          )) {
            $failed = $false
            try {
              if ($script -like '*Start-*') {
                & $script -BannerlordRoot $versionRoot -SaveName 'KaiTOR-Version-CI' -DryRun | Out-Null
              }
              else {
                & $script -BannerlordRoot $versionRoot | Out-Null
              }
            }
            catch {
              $failed = $true
              Write-Host "$script -> $($_.Exception.Message)"
              if ($_.Exception.Message -notmatch 'Expected Bannerlord 1\.3\.15\.110062') { throw }
              if ($_.Exception.GetType().FullName -match 'PropertyNotFoundException' -or $_.Exception.Message -match 'property .Count') {
                throw 'Scalar version information leaked a StrictMode .Count failure.'
              }
            }
            if (-not $failed) { throw "$script unexpectedly accepted the wrong Bannerlord version." }
          }

      - name: Validate missing Coop dependency metadata is rejected cleanly
        shell: powershell
        run: |
          $coopXml = Join-Path $env:KAITOR_FAKE_ROOT 'Modules/Coop/SubModule.xml'
          $original = Get-Content -LiteralPath $coopXml -Raw
          '<Module />' | Set-Content -LiteralPath $coopXml -Encoding UTF8
          try {
            $failed = $false
            try {
              ./projects/KaiTOROnline/runtime/Test-KaiTORRuntimePreflight.ps1 `
                -BannerlordRoot $env:KAITOR_FAKE_ROOT `
                -SkipVersionCheck | Out-Null
            }
            catch {
              $failed = $true
              Write-Host $_.Exception.Message
              if ($_.Exception.Message -notmatch 'Coop SubModule.xml has no dependency metadata') { throw }
              if ($_.Exception.GetType().FullName -match 'PropertyNotFoundException') {
                throw 'Missing Coop metadata leaked a StrictMode PropertyNotFoundException.'
              }
            }
            if (-not $failed) { throw 'Preflight accepted Coop metadata with no dependencies.' }
          }
          finally {
            Set-Content -LiteralPath $coopXml -Value $original -Encoding UTF8
          }

      - name: Validate missing Missions assembly is rejected by preflight and launcher
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:KAITOR_FAKE_ROOT 'Modules/Coop/bin/Win64_Shipping_Client/Missions.dll') -Force

          $preflightFailed = $false
          try {
            ./projects/KaiTOROnline/runtime/Test-KaiTORRuntimePreflight.ps1 `
              -BannerlordRoot $env:KAITOR_FAKE_ROOT `
              -SkipVersionCheck | Out-Null
          }
          catch {
            $preflightFailed = $true
            Write-Host $_.Exception.Message
            if ($_.Exception.Message -notmatch 'Missions.dll') { throw }
          }
          if (-not $preflightFailed) { throw 'Preflight accepted a runtime missing Missions.dll.' }

          $launcherFailed = $false
          try {
            ./projects/KaiTOROnline/runtime/Start-KaiTORCampaignServer.ps1 `
              -BannerlordRoot $env:KAITOR_FAKE_ROOT `
              -SaveName 'KaiTOR-CI-Save' `
              -SkipVersionCheck `
              -DryRun | Out-Null
          }
          catch {
            $launcherFailed = $true
            Write-Host $_.Exception.Message
            if ($_.Exception.Message -notmatch 'Missions.dll') { throw }
          }
          if (-not $launcherFailed) { throw 'Campaign launcher accepted a runtime missing Missions.dll.' }
