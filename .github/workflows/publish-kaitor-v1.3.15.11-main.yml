name: Publish KaiTOR Co-op v1.3.15.11

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-kaitor-v1.3.15.11-main.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: cookiessaa2010/DLL-
      TAG: v1.3.15.11
      TARGET_SHA: 2bb6ef74e68239304ff2d9a07f47e8321380eee5
      ARTIFACT_ID: '10577366903'
      ASSET: KaiTORCoop-v1.3.15.11-Bannerlord-1.3.15.110062-TOR-1.3.15.zip
    steps:
      - name: Skip if release already exists
        id: existing
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified Actions artifact
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ASSET"
          echo "bdb56c4028ec6764a42e7a37a4f2dd38ea4df162280ed1e76af8009771c7c1f4  $ASSET" | sha256sum --check --strict

      - name: Write release notes
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # KaiTOR Co-op v1.3.15.11 — Test Build

          **Target:** Mount & Blade II: Bannerlord 1.3.15.110062 + The Old Realms 1.3.15
          **Players:** up to 4 simultaneous players
          **Languages:** Russian + English
          **Default co-op UDP port:** 4200

          ## Русский

          Первая тестовая сборка KaiTOR Co-op для полноценного live-теста кампании The Old Realms на 4 игроков.

          Что проверяем в этой версии:
          - подключение до 4 игроков;
          - отдельные Hero / Clan / MobileParty для каждого игрока;
          - независимое движение на карте кампании;
          - одно столкновение и один полноценный бой;
          - сохранение мира, перезапуск сервера и reconnect в другом порядке;
          - восстановление исходных персонажей и отрядов после reconnect;
          - совместимость с KaiCleave v1.3.15.31, KaiTOR Stability v1.3.15.50 и KaiTOR Portrait Fix v1.3.15.60 при одинаковом наборе и версиях у всех участников.

          В архиве есть RU/EN README, серверный launcher, preflight/live-test scripts, логи и SHA256SUMS.

          **Важно:** Bannerlord и The Old Realms в архив не входят. Нужна отдельная легальная установка Bannerlord 1.3.15.110062 + TOR 1.3.15. ServerConsole используется как вспомогательный rendezvous/NAT/listing сервис; авторитативный мир кампании запускается отдельным процессом Bannerlord с /singleplayer /server. Native no-render/headless TOR режим этой сборкой не заявляется.

          ## English

          First KaiTOR Co-op test build intended for a full 4-player The Old Realms campaign live acceptance test.

          This build is intended to validate:
          - connections for up to 4 simultaneous players;
          - unique Hero / Clan / MobileParty identities per player;
          - independent campaign-map movement;
          - one encounter and one full battle;
          - world save, server restart, and reconnect in a different order;
          - restoration of the original player identities after reconnect;
          - compatibility with KaiCleave v1.3.15.31, KaiTOR Stability v1.3.15.50, and KaiTOR Portrait Fix v1.3.15.60 when every participant uses the same module set and exact versions.

          The package contains RU/EN READMEs, the server launcher, preflight/live-test scripts, logging helpers, and SHA256SUMS.

          **Important:** Bannerlord and The Old Realms files are not distributed in this archive. A separate legal Bannerlord 1.3.15.110062 + TOR 1.3.15 installation is required. ServerConsole is auxiliary rendezvous/NAT/listing infrastructure; the authoritative campaign world runs in a separate Bannerlord process using /singleplayer /server. Native no-render/headless TOR operation is not claimed by this build.

          ## Integrity

          Source commit: 2bb6ef74e68239304ff2d9a07f47e8321380eee5
          Artifact SHA-256: bdb56c4028ec6764a42e7a37a4f2dd38ea4df162280ed1e76af8009771c7c1f4
          EOF

      - name: Create prerelease and attach build
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ASSET#KaiTOR Co-op v1.3.15.11 test build" \
            --repo "$GH_REPO" \
            --target "$TARGET_SHA" \
            --title "KaiTOR Co-op v1.3.15.11 — Test Build" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
