name: KaiTOR Stability 0.4.4 Observability Build

on:
  push:
    branches:
      - kaitor-stability-0.4.4-observability
    paths:
      - 'projects/KaiTORStability/**'
      - '.github/workflows/kaitor-stability-044-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ./projects/KaiTORStability/src/KaiTORStability/KaiTORStability.csproj
          dotnet restore ./projects/KaiTORStability/src/KaiTORLoadMonitor/KaiTORLoadMonitor.csproj

      - name: Build Bannerlord module
        shell: pwsh
        run: dotnet build ./projects/KaiTORStability/src/KaiTORStability/KaiTORStability.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Build observability monitor
        shell: pwsh
        run: dotnet build ./projects/KaiTORStability/src/KaiTORLoadMonitor/KaiTORLoadMonitor.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Monitor helper self-test
        shell: pwsh
        run: |
          $exe = Resolve-Path ./projects/KaiTORStability/src/KaiTORLoadMonitor/bin/Release/net472/KaiTORLoadMonitor.exe
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Load monitor self-test failed: $($p.ExitCode)" }

      - name: Validate 0.4.4 contracts
        shell: pwsh
        run: |
          [xml]$xml = Get-Content ./projects/KaiTORStability/module/SubModule.xml -Raw
          if ($xml.Module.Version.value -ne 'v0.4.4') { throw 'Expected module v0.4.4.' }

          $sub = Get-Content ./projects/KaiTORStability/src/KaiTORStability/SubModule.cs -Raw
          if ($sub -notmatch 'KaiTOR Stability 0.4.4') { throw 'Runtime version marker missing.' }
          if ($sub -notmatch '_initialScreenLogged') { throw 'INITIAL_SCREEN_READY one-shot guard missing.' }

          $project = Get-Content ./projects/KaiTORStability/src/KaiTORLoadMonitor/KaiTORLoadMonitor.csproj -Raw
          if ($project -notmatch 'KaiTORLoadMonitor.Program44') { throw 'Program44 startup object missing.' }

          $monitor = Get-Content ./projects/KaiTORStability/src/KaiTORLoadMonitor/LiveLoadMonitorForm44.cs -Raw
          foreach ($required in @(
            'rgl_log_',
            'StartTime.ToUniversalTime',
            'load-history-v2.csv',
            'SHADER_BUILD_RAM',
            'RAM_SAMPLE',
            'runtime terrain shaders',
            'Task.Run(() => PollRgl',
            'ProcessToMenu',
            'FirstLaunchWarmup'
          )) {
            if ($monitor -notmatch [regex]::Escape($required)) { throw "0.4.4 monitor missing: $required" }
          }
          if ($monitor -match 'PriorityClass = ProcessPriorityClass.AboveNormal') { throw 'Monitor must not boost Bannerlord priority.' }

          $rgl = Get-Content ./projects/KaiTORStability/src/KaiTORLoadMonitor/RglTelemetry.cs -Raw
          foreach ($required in @('Missing shader from sack:', 'pbr_terrain', 'Loading Time:', 'gpu_morph_mapping')) {
            if ($rgl -notmatch [regex]::Escape($required)) { throw "RGL classifier missing: $required" }
          }

          $warm = Get-Content ./projects/KaiTORStability/src/KaiTORLoadMonitor/FirstLaunchWarmup.cs -Raw
          if ($warm -notmatch 'workshop') { throw 'Workshop TOR discovery missing from first-launch warmup.' }
          if ($warm -notmatch '261550') { throw 'Bannerlord Workshop app id discovery missing.' }

      - name: Assemble root-installable test package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KaiTORStability-0.4.4'
          $module = Join-Path $stage 'Modules/KaiTOR_Stability'
          $bin = Join-Path $module 'bin/Win64_Shipping_Client'
          $tools = Join-Path $stage 'Tools'
          New-Item -ItemType Directory -Force -Path $bin,$tools,(Join-Path $module 'ModuleData') | Out-Null

          Copy-Item ./projects/KaiTORStability/module/SubModule.xml (Join-Path $module 'SubModule.xml')
          Copy-Item ./projects/KaiTORStability/module/ModuleData/KaiTORStability.config.xml (Join-Path $module 'ModuleData/KaiTORStability.config.xml')
          Copy-Item ./projects/KaiTORStability/src/KaiTORStability/bin/Release/net472/KaiTORStability.dll (Join-Path $bin 'KaiTORStability.dll')
          Copy-Item ./projects/KaiTORStability/src/KaiTORLoadMonitor/bin/Release/net472/KaiTORLoadMonitor.exe (Join-Path $tools 'KaiTORLoadMonitor.exe')
          Copy-Item ./projects/KaiTORStability/COOP_COMPATIBILITY_RU.md (Join-Path $stage 'COOP_COMPATIBILITY_RU.md')

          @'
          @echo off
          setlocal
          cd /d "%~dp0.."
          start "KaiTOR Monitor 0.4.4" "%~dp0KaiTORLoadMonitor.exe" --game-root "%CD%"
          '@ | Set-Content (Join-Path $tools 'START_KAITOR_MONITOR_0.4.4.bat') -Encoding ASCII

          @'
          KaiTOR Stability 0.4.4 — test build

          Что проверяем:
          1. Live RGL stages during startup: XML / module data / shader cache / runtime shaders / terrain / GPU morph / menu.
          2. Startup timing is split: wait-to-process, process-to-menu, module-to-menu, engine Loading Time.
          3. RAM is automatic: current, session peak, RAM before/peak/after TOR Build Shader Cache.
          4. TOR full shader build is separated from later runtime terrain shader waves.
          5. First-launch warmup resolves TOR_Core/TOR_Armory/TOR_Environment in both local Modules and Steam Workshop.
          6. KaiCleave 0.2.2 can remain enabled; CLEAVE_TIMING is still surfaced by the monitor.

          Логи после теста:
          %LOCALAPPDATA%\KaiTORStability\KaiTORStability.log
          %LOCALAPPDATA%\KaiTORStability\KaiTORMonitor.log
          %LOCALAPPDATA%\KaiTORStability\load-history-v2.csv
          C:\ProgramData\Mount and Blade II Bannerlord\logs\rgl_log_<PID>.txt

          Существующий D:\MNB\Shaders для первого warm-run НЕ удалять.
          '@ | Set-Content (Join-Path $stage 'TEST_PLAN_0.4.4_RU.txt') -Encoding UTF8

          @'
          0.4.4 changes
          - RGL tail follows rgl_log_<PID>.txt in a background worker.
          - UI shows real engine/TOR stages even before KaiTOR MODULE_LOAD.
          - load-history-v2.csv stores process-to-menu instead of monitor-launch-to-menu.
          - KaiTORMonitor.log stores RAM samples and session summaries.
          - TOR Build Shader Cache logs RAM before/peak/after automatically.
          - runtime terrain shaders are distinguished from the TOR full-cache build.
          - first-launch warmup now discovers Steam Workshop TOR module roots.
          - no process-priority boost; no heavy RGL/cache scan on the WinForms UI thread.
          '@ | Set-Content (Join-Path $stage 'CHANGELOG_0.4.4.txt') -Encoding UTF8

          $forbidden = Get-ChildItem $stage -Recurse -File | Where-Object { $_.Name -like 'TaleWorlds*.dll' -or $_.Name -eq '0Harmony.dll' }
          if ($forbidden) { throw 'Reference/runtime dependencies must not be redistributed.' }

          $zip = Join-Path $env:RUNNER_TEMP 'KaiTORStability-0.4.4-Bannerlord-1.3.15-observability.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hashFile = Join-Path $env:RUNNER_TEMP 'SHA256.txt'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content $hashFile -Encoding ascii
          "KAITOR_STABILITY_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KAITOR_STABILITY_HASH=$hashFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiTORStability-0.4.4-observability
          path: |
            ${{ env.KAITOR_STABILITY_ZIP }}
            ${{ env.KAITOR_STABILITY_HASH }}
          if-no-files-found: error
          retention-days: 30
