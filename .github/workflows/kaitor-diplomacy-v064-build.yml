name: KaiTOR Diplomacy v0.6.4 Build

on:
  push:
    branches:
      - 'kaitor-v0.6.4-*'
    paths:
      - 'projects/KaiTORDiplomacy/**'
      - '.github/workflows/kaitor-diplomacy-v064-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build against Bannerlord 1.3.15 reference assemblies
        shell: pwsh
        run: |
          dotnet build projects/KaiTORDiplomacy/src/KaiTOR_Diplomacy.csproj `
            -c Release `
            -p:UseBannerlordReferenceAssemblies=true `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify output and v0.6.4 contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $src = Join-Path $root 'src'
          $runtime = Join-Path $src 'Runtime'
          $models = Join-Path $src 'Models'
          $dll = Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing DLL: $dll" }

          $module = Get-Content (Join-Path $root 'module/SubModule.xml') -Raw
          if ($module -notmatch '<Version value="v0\.6\.4"') { throw 'SubModule version is not v0.6.4.' }

          $required = @(
            'KaiFamilyAffairsBehavior.cs',
            'KaiRealmHouseGrowthBehavior.cs',
            'KaiLoreEducationBehavior.cs',
            'TorProfessionEffectBridge.cs',
            'KaiBloodKissBehavior.cs',
            'KaiVampirePopulationBehavior.cs',
            'KaiGreenskinPopulationBehavior.cs',
            'KaiDynasticMarriageBehavior.cs',
            'KaiIncomingMarriageProposalBehavior.cs',
            'KaiDiplomacyConversationBehavior.cs',
            'KaiDiplomacyHubBehavior.cs',
            'KaiLiveTestBehavior.cs',
            'KaiLiveTestLog.cs',
            'KaiFamilyLog.cs',
            'KaiFamilyDiagnosticsBehavior.cs',
            'KaiWorldMarriageBehavior.cs',
            'KaiMessengerBehavior.cs',
            'KaiMessengerMapButton.cs',
            'KaiConsoleText.cs'
          )
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $name) -PathType Leaf)) {
              throw "Missing required runtime source: $name"
            }
          }

          $forbiddenLegacy = @(
            'KaiDynastyAiBehavior.cs',
            'KaiDiplomacyOfficeBehavior.cs',
            'KaiRacialPopulationBehavior.cs',
            'KaiCadetHouseSafeBehavior.cs'
          )
          foreach ($name in $forbiddenLegacy) {
            if (Test-Path -LiteralPath (Join-Path $runtime $name) -PathType Leaf) {
              throw "Obsolete runtime source still present: $name"
            }
          }

          $subModuleCs = Get-Content (Join-Path $src 'SubModule.cs') -Raw
          foreach ($token in @(
            'new KaiDynastyAiBehavior()',
            'new KaiDiplomacyOfficeBehavior()',
            'new KaiRacialPopulationBehavior()',
            'new KaiDiplomacyHubBehavior()',
            'new KaiIncomingMarriageProposalBehavior()'
          )) {
            if ($subModuleCs.Contains($token)) { throw "Forbidden legacy/broken registration: $token" }
          }
          foreach ($token in @(
            'new KaiMessengerBehavior()',
            'new KaiFamilyDiagnosticsBehavior()',
            'new KaiWorldMarriageBehavior()'
          )) {
            if (-not $subModuleCs.Contains($token)) { throw "Required rebuilt behavior registration missing: $token" }
          }

          $realm = Get-Content (Join-Path $runtime 'KaiRealmHouseGrowthBehavior.cs') -Raw
          if (-not $realm.Contains('Clan.CreateCompanionToLordClan')) { throw 'Realm House native factory missing.' }
          if ($realm -match 'Clan\.CreateClan\s*\(') { throw 'Direct Clan.CreateClan found in Realm House.' }
          if ($realm -match 'founder\.Clan\s*=') { throw 'Direct founder.Clan assignment found in Realm House.' }
          if ($realm -match 'newClan\.Kingdom\s*=') { throw 'Direct newClan.Kingdom assignment found in Realm House.' }
          if ($realm -notmatch 'PerKingdomCooldownDays\s*=\s*3') { throw 'Realm House per-kingdom cooldown is not the rebuilt 3-day value.' }
          if ($realm -notmatch 'FailureCooldownDays\s*=\s*1') { throw 'Realm House failure cooldown is not the rebuilt 1-day value.' }
          if ($realm -notmatch 'MaxSuccessfulCommitsPerDay\s*=\s*4') { throw 'Realm House daily throughput cap missing.' }
          if (-not $realm.Contains('REALM_REQUEUE')) { throw 'Realm House transient founder requeue missing.' }

          $dawi = Get-Content (Join-Path $runtime 'KaiDawiWomenBehavior.cs') -Raw
          if ($dawi -notmatch 'AutomaticPopulationEnabled\s*=\s*true') {
            throw 'Dawi women bounded auto-population must be ON.'
          }

          $marriageModel = Get-Content (Join-Path $models 'KaiPlayerMarriageModel.cs') -Raw
          $pregnancyModel = Get-Content (Join-Path $models 'KaiPregnancyModel.cs') -Raw
          $familySafety = Get-Content (Join-Path $models 'TorFamilySafety.cs') -Raw
          $raceLifecycle = Get-Content (Join-Path $models 'KaiRaceLifecycle.cs') -Raw
          $vampirePopulation = Get-Content (Join-Path $runtime 'KaiVampirePopulationBehavior.cs') -Raw
          $greenskinPopulation = Get-Content (Join-Path $runtime 'KaiGreenskinPopulationBehavior.cs') -Raw
          $commands = Get-Content (Join-Path $runtime 'KaiDiplomacyCommands.cs') -Raw

          if (-not $marriageModel.Contains('KaiRaceLifecycle.IsLoreMarriageAge')) {
            throw 'Lore-aware marriage age gate missing.'
          }
          if ($marriageModel.Contains('return base.IsCoupleSuitableForMarriage')) {
            throw 'Marriage model still delegates pair eligibility back to vanilla age/couple gate.'
          }
          if ($marriageModel.Contains('return base.IsSuitableForMarriage')) {
            throw 'Marriage model still delegates hero eligibility back to vanilla/TOR marriage gate.'
          }
          if (-not $raceLifecycle.Contains('return hero.Age >= DawiFertilityStart;')) {
            throw 'Dawi pregnancy still has an upper vanilla-style cutoff.'
          }
          if (-not $raceLifecycle.Contains('return hero.Age >= ElfFertilityStart;')) {
            throw 'Elf pregnancy still has an upper vanilla-style cutoff.'
          }
          if (-not $familySafety.Contains('KaiRaceLifecycle.CanUseBiologicalPregnancy')) {
            throw 'Central lore pregnancy gate missing.'
          }
          if ($familySafety.Contains('IsVampireMethod == null && (IsVampireCulture')) {
            throw 'Legacy vampire-culture blanket pregnancy block still present.'
          }
          if ($vampirePopulation -notmatch 'AutomaticPopulationEnabled\s*=\s*true') {
            throw 'Vampire automatic Blood Kiss population must be ON.'
          }
          if ($greenskinPopulation -notmatch 'AutomaticPopulationEnabled\s*=\s*true') {
            throw 'Greenskin automatic spore population must be ON.'
          }
          if (-not $commands.Contains('CommandLineArgumentFunction("family_rules"')) {
            throw 'family_rules diagnostic command missing.'
          }

          $familyAffairs = Get-Content (Join-Path $runtime 'KaiFamilyAffairsBehavior.cs') -Raw
          $familyLog = Get-Content (Join-Path $runtime 'KaiFamilyLog.cs') -Raw
          $familyDiag = Get-Content (Join-Path $runtime 'KaiFamilyDiagnosticsBehavior.cs') -Raw
          $worldMarriage = Get-Content (Join-Path $runtime 'KaiWorldMarriageBehavior.cs') -Raw
          $messengerBehavior = Get-Content (Join-Path $runtime 'KaiMessengerBehavior.cs') -Raw
          $messengerUi = Get-Content (Join-Path $runtime 'KaiMessengerMapButton.cs') -Raw
          $cultureBehavior = Get-Content (Join-Path $runtime 'KaiCultureAssimilationBehavior.cs') -Raw

          if (-not $familyAffairs.Contains('"town_tavern"')) { throw 'Adoption tavern entry missing.' }
          if (-not $familyAffairs.Contains('"kaitor_family_adoption_tavern"')) { throw 'Direct tavern adoption action missing.' }
          if ($subModuleCs.Contains('new KaiDiplomacyHubBehavior()')) { throw 'Removed city diplomacy hub was re-registered.' }
          if ($subModuleCs.Contains('new KaiIncomingMarriageProposalBehavior()')) { throw 'Broken out-of-conversation marriage proposal behavior was re-registered.' }

          if (-not $familyLog.Contains('KaiTOR-Family.log')) { throw 'Dedicated automatic family log missing.' }
          foreach ($token in @('BeforeHeroesMarried','OnChildConceivedEvent','OnGivenBirthEvent','WEEKLY_KINGDOM','WEEKLY_EVENTS')) {
            if (-not $familyDiag.Contains($token)) { throw "Family diagnostics contract missing: $token" }
          }

          if ($worldMarriage -notmatch 'MaxWorldMarriagesPerWeek\s*=\s*12') { throw 'World marriage weekly cap missing.' }
          if (-not $worldMarriage.Contains('MarriageAction.Apply')) { throw 'World marriage native MarriageAction path missing.' }
          if (-not $worldMarriage.Contains('fertilityBonus')) { throw 'World marriage fertile-pair preference missing.' }

          if (-not $messengerUi.Contains('EncyclopediaHeroPageVM')) { throw 'Messenger is not attached to hero encyclopedia flow.' }
          if ($messengerUi.Contains('MapNavigationVM')) { throw 'Obsolete map-bar messenger patch returned.' }
          if (-not $messengerBehavior.Contains('CampaignMapConversation.OpenConversation')) { throw 'Messenger does not open a real lord conversation on arrival.' }
          if (-not $messengerBehavior.Contains('MESSENGER_SENT') -or -not $messengerBehavior.Contains('MESSENGER_ARRIVED')) {
            throw 'Messenger travel lifecycle logging missing.'
          }

          if (-not $cultureBehavior.Contains('if (settlement.Culture == targetCulture)') -or
              -not $cultureBehavior.Contains('return false;')) {
            throw 'Redundant same-culture settlement action is not hidden.'
          }

          Write-Host "KaiTOR rebuilt family/messenger/realm contracts: PASS"
          Write-Host "KaiTOR lore family lifecycle contracts: PASS"

          $moduleData = Join-Path $root 'module/ModuleData'
          foreach ($assetText in @(
            'action_sets.xml',
            'kaitor_dawi_monster.xml',
            'kaitor_dawi_women.xml',
            'project.mbproj',
            'skins.xml',
            'skins.xslt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $moduleData $assetText) -PathType Leaf)) {
              throw "Missing Dawi ModuleData contract: $assetText"
            }
          }
          $dawiMonster = Get-Content (Join-Path $moduleData 'kaitor_dawi_monster.xml') -Raw
          $dawiWomenXml = Get-Content (Join-Path $moduleData 'kaitor_dawi_women.xml') -Raw
          if ($dawiMonster -notmatch 'as_kaitor_dwarf_female_warrior') { throw 'Dawi female action-set binding missing.' }
          if ($dawiWomenXml -notmatch 'id="kaitor_dawi_woman_lord"' -or $dawiWomenXml -notmatch 'race="dwarf"' -or $dawiWomenXml -notmatch 'is_female="true"') {
            throw 'Dawi woman template contract is incomplete.'
          }

          foreach ($doc in @('CHANGELOG-v0.6.4-RU.md', 'TEST-v0.6.4-RU.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root "module/$doc") -PathType Leaf)) {
              throw "Missing release document: $doc"
            }
          }

          # Diplomacy UI must remain technically isolated from KaiTOR Co-op.
          $uiRoot = Join-Path $src 'UI'
          foreach ($uiFile in @(
            'KaiTORDiplomacyScreen.cs',
            'KaiTORDiplomacyVM.cs',
            'KaiDiplomacyKingdomItemVM.cs',
            'KaiTORDiplomacyUiText.cs'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $uiRoot $uiFile) -PathType Leaf)) {
              throw "Missing diplomacy Gauntlet UI source: $uiFile"
            }
          }

          $moviePath = Join-Path $root 'module/GUI/Prefabs/KaiTORDiplomacyHubUIMovie.xml'
          if (-not (Test-Path -LiteralPath $moviePath -PathType Leaf)) {
            throw 'Missing KaiTORDiplomacyHubUIMovie.xml.'
          }
          [xml]$movieXml = Get-Content $moviePath -Raw
          $movieRaw = Get-Content $moviePath -Raw
          if ($movieRaw -notmatch 'KaiTORDiplomacyRoot') { throw 'Diplomacy movie root id missing.' }
          if ($movieRaw -match 'CoopConnectionUIMovie|CoopOptionsUIMovie|GameInterface\.Services\.UI') {
            throw 'Diplomacy movie/source collides with KaiTOR Co-op UI identifiers.'
          }

          # DiplomacyFinish: keep the main movie on the conservative DIAG-A
          # Gauntlet contract while routing complex choices through native UI.
          foreach ($forbiddenUi in @(
            'ScrollablePanel',
            'NavigatableListPanel',
            'ItemTemplate',
            'ScrollbarWidget',
            'IsVisible="@',
            'IsDisabled="@'
          )) {
            if ($movieRaw.Contains($forbiddenUi)) {
              throw "Crash-risk Gauntlet token found in Diplomacy movie: $forbiddenUi"
            }
          }
          foreach ($requiredCommand in @(
            'Command.Click="ActionChooseRealm"',
            'Command.Click="ActionCycleDuration"',
            'Command.Click="ActionProposeNap"',
            'Command.Click="ActionBreakNap"',
            'Command.Click="ActionRefresh"',
            'Command.Click="ActionClose"'
          )) {
            if (-not $movieRaw.Contains($requiredCommand)) {
              throw "Safe functional Diplomacy command missing: $requiredCommand"
            }
          }

          # Interaction audit: every visible custom button must bind to a VM method,
          # and every route that closes a screen/dialog must leave a visible or persistent result.
          $vmSource = Get-Content (Join-Path $uiRoot 'KaiTORDiplomacyVM.cs') -Raw
          $screenSource = Get-Content (Join-Path $uiRoot 'KaiTORDiplomacyScreen.cs') -Raw
          $uiPatchSource = Get-Content (Join-Path $runtime 'KaiDiplomacyUiPatch.cs') -Raw
          $dialogueSource = Get-Content (Join-Path $runtime 'KaiDiplomacyConversationBehavior.cs') -Raw
          $bloodKissSource = Get-Content (Join-Path $runtime 'KaiBloodKissBehavior.cs') -Raw
          $marriageWarningSource = Get-Content (Join-Path $runtime 'KaiMarriageWarningBehavior.cs') -Raw
          $educationSource = Get-Content (Join-Path $runtime 'KaiLoreEducationBehavior.cs') -Raw

          $movieCommands = [regex]::Matches($movieRaw, 'Command\.Click="([^"]+)"') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique
          foreach ($command in $movieCommands) {
            if ($vmSource -notmatch ('public\s+void\s+' + [regex]::Escape($command) + '\s*\(')) {
              throw "Visible movie command has no VM endpoint: $command"
            }
          }

          foreach ($deadCommand in @('ActionOpenFamily','ActionOpenFallbackHub')) {
            if ($movieCommands -contains $deadCommand) {
              throw "Dead/obsolete dashboard command is still visible: $deadCommand"
            }
          }
          foreach ($deadRoute in @('FamilyRequested','FallbackHubRequested','CultureRequested','OpenHubFromExternalUi')) {
            if ($screenSource.Contains($deadRoute)) {
              throw "Dead dashboard route remains in screen: $deadRoute"
            }
          }

          foreach ($forbiddenDashboardToken in @(
            'AddDashboardAction',
            'KaiTORDiplomacyScreen.TryOpen',
            'DIPLOMACY_DASHBOARD_OPEN',
            'DIPLOMACY_DASHBOARD_FAILED'
          )) {
            if ($uiPatchSource.Contains($forbiddenDashboardToken)) {
              throw "Crash-prone diplomacy dashboard injection returned: $forbiddenDashboardToken"
            }
          }
          foreach ($requiredNapToken in @(
            'AddProposalAction(__instance, diplomacy, source, target)',
            'AddActivePactAction(__instance, diplomacy, source, target)',
            'new TextObject("Пакт о ненападении")',
            'new TextObject("Разорвать пакт")'
          )) {
            if (-not $uiPatchSource.Contains($requiredNapToken)) {
              throw "Native diplomacy NAP action missing: $requiredNapToken"
            }
          }

          foreach ($oldFamilyCall in @('RegisterRootMenu(starter);','RegisterHouseMenu(starter);','RegisterMarriageMenu(starter);')) {
            if ($familyAffairs.Contains($oldFamilyCall)) {
              throw "Obsolete family menu is still registered: $oldFamilyCall"
            }
          }
          foreach ($token in @('kaitor_family_adoption_tavern','RegisterAdoptionMenu(starter);','AdoptHeroAction.Apply','adoption_back')) {
            if (-not $familyAffairs.Contains($token)) { throw "Adoption terminal path missing: $token" }
          }

          foreach ($token in @('CultureMenuConsequence','TryChangeCultureImmediately','CULTURE_CHANGE_BLOCKED')) {
            if (-not $cultureBehavior.Contains($token)) { throw "Culture terminal path missing: $token" }
          }

          foreach ($token in @('RequestSend','Dispatch(target, cost, travelDays)','MESSENGER_SENT','MESSENGER_ARRIVED','CampaignMapConversation.OpenConversation')) {
            if (-not $messengerBehavior.Contains($token)) { throw "Messenger terminal path missing: $token" }
          }

          foreach ($token in @('QueueDecision(days)','ShowQuick(','DIPLOMACY_DIALOGUE_NAP','DIPLOMACY_DIALOGUE_FAILED')) {
            if (-not $dialogueSource.Contains($token)) { throw "Diplomacy dialogue feedback path missing: $token" }
          }

          foreach ($token in @('ApplyBloodKissToTarget','TryRecruitTrollWarrior','ShowResult(','BLOOD_KISS_SUCCESS','TROLL_RECRUIT')) {
            if (-not $bloodKissSource.Contains($token)) { throw "Blood Kiss terminal feedback path missing: $token" }
          }

          foreach ($token in @(
            '"kaitor_childless_marriage_continue"',
            '"hero_courtship_final_barter"',
            '"kaitor_childless_marriage_cancel"',
            '"close_window"'
          )) {
            if (-not $marriageWarningSource.Contains($token)) { throw "Marriage warning route missing: $token" }
          }

          foreach ($token in @(
            'private bool CommitStageChoice',
            'if (CommitStageChoice(child, stage, option, false))',
            'Выбор для {child.Name} не удалось применить.',
            'Специализацию для {child.Name} не удалось применить.',
            'CHILD_SPECIALIZATION'
          )) {
            if (-not $educationSource.Contains($token)) { throw "Education terminal feedback path missing: $token" }
          }

          foreach ($token in @('CULTURE_CHANGE_SUCCESS','CULTURE_CHANGE_FAILED')) {
            if (-not $cultureBehavior.Contains($token)) { throw "Culture result logging missing: $token" }
          }

          if (-not $messengerBehavior.Contains('MESSENGER_DEFERRED') -or
              -not $messengerBehavior.Contains('Разговор отложен')) {
            throw 'Messenger defer action has no visible terminal feedback.'
          }

          Write-Host "KaiTOR interaction/menu terminal-path audit: PASS"

          $allDiplomacyUiText = @(
            Get-ChildItem $uiRoot -File -Filter '*.cs'
            Get-Item (Join-Path $runtime 'KaiDiplomacyHubBehavior.cs')
            Get-Item (Join-Path $src 'SubModule.cs')
            Get-Item $moviePath
          ) | ForEach-Object { Get-Content $_.FullName -Raw } | Out-String

          foreach ($forbidden in @(
            'CoopConnectionUIMovie',
            'CoopOptionsUIMovie',
            'namespace GameInterface.Services.UI',
            'Modules/Coop',
            'Modules\\Coop'
          )) {
            if ($allDiplomacyUiText.Contains($forbidden)) {
              throw "KaiTOR Co-op UI collision token found in Diplomacy: $forbidden"
            }
          }

          $screen = Get-Content (Join-Path $uiRoot 'KaiTORDiplomacyScreen.cs') -Raw
          if ($screen -notmatch 'MovieName\s*=\s*"KaiTORDiplomacyHubUIMovie"') {
            throw 'Diplomacy Gauntlet movie name contract changed.'
          }
          if ($screen -notmatch 'LayerName\s*=\s*"KaiTORDiplomacyLayer"') {
            throw 'Diplomacy Gauntlet layer name contract changed.'
          }

          $langRoot = Join-Path $root 'module/ModuleData/Languages'
          $enLang = Join-Path $langRoot 'std_module_strings_xml.xml'
          $ruLang = Join-Path $langRoot 'RU/std_module_strings_xml.xml'
          $ruData = Join-Path $langRoot 'RU/language_data.xml'
          foreach ($langFile in @($enLang, $ruLang, $ruData)) {
            if (-not (Test-Path -LiteralPath $langFile -PathType Leaf)) {
              throw "Missing Diplomacy localization file: $langFile"
            }
            [xml](Get-Content $langFile -Raw) | Out-Null
          }

          [xml]$enXml = Get-Content $enLang -Raw
          [xml]$ruXml = Get-Content $ruLang -Raw
          $enIds = @($enXml.base.strings.string | ForEach-Object { [string]$_.id })
          $ruIds = @($ruXml.base.strings.string | ForEach-Object { [string]$_.id })
          if ($enIds.Count -eq 0) { throw 'Diplomacy EN localization is empty.' }
          foreach ($id in $enIds) {
            if ($id -notmatch '^kaitor_diplomacy_ui_') {
              throw "Diplomacy localization id is outside isolated prefix: $id"
            }
            if ($ruIds -notcontains $id) {
              throw "RU localization missing id: $id"
            }
          }
          foreach ($id in $ruIds) {
            if ($enIds -notcontains $id) {
              throw "EN localization missing id: $id"
            }
          }

          # Player-facing text hygiene: localization must contain game information only.
          $forbiddenPlayerText = @(
            'KaiTOR',
            'live-test',
            'live test',
            'module',
            'модуль',
            ' AI',
            'debug',
            'diagnostic',
            '.log',
            'журнал',
            'классическое меню'
          )
          foreach ($node in @($enXml.base.strings.string) + @($ruXml.base.strings.string)) {
            $displayText = [string]$node.text
            foreach ($forbiddenText in $forbiddenPlayerText) {
              if ($displayText.IndexOf($forbiddenText, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                throw "Technical/working wording leaked into player localization: '$forbiddenText' in '$displayText'"
              }
            }
          }

          # Keep localization exactly aligned with the active dashboard VM.
          $vmLocalizationIds = [regex]::Matches($vmSource, '"(kaitor_diplomacy_ui_[^"]+)"') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique
          foreach ($id in $vmLocalizationIds) {
            if ($enIds -notcontains $id -or $ruIds -notcontains $id) {
              throw "Active dashboard localization id is missing: $id"
            }
          }
          foreach ($id in $enIds) {
            if ($vmLocalizationIds -notcontains $id) {
              throw "Unused/stale player localization id remains: $id"
            }
          }

          $playerFacingSources = @(
            $screenSource,
            $uiPatchSource,
            (Get-Content (Join-Path $runtime 'KaiMessengerMapButton.cs') -Raw),
            $messengerBehavior,
            $cultureBehavior,
            $familyAffairs,
            $dialogueSource,
            $bloodKissSource,
            $educationSource,
            $marriageWarningSource
          ) -join [Environment]::NewLine

          foreach ($forbiddenPhrase in @(
            'Причина записана в KaiTOR.log',
            'Ошибка записана в журнал',
            'Причина записана в журнал',
            'Открыть панель KaiTOR',
            'Открыть классическое меню KaiTOR',
            'для live-test',
            'для live test',
            'Модуль женщин-гномов'
          )) {
            if ($playerFacingSources.Contains($forbiddenPhrase)) {
              throw "Technical player-facing phrase remains: $forbiddenPhrase"
            }
          }

          Write-Host "Player-facing text hygiene: PASS"

          $subModuleId = [regex]::Match($module, '<Id value="([^"]+)"').Groups[1].Value
          if ($subModuleId -ne 'KaiTOR_Diplomacy') {
            throw "Diplomacy module id collided or changed: $subModuleId"
          }
          if ($subModuleCs -notmatch 'kaitor\.diplomacy\.kingdom-ui') {
            throw 'Dedicated Diplomacy Harmony id missing.'
          }

          $liveTest = Get-Content (Join-Path $runtime 'KaiLiveTestBehavior.cs') -Raw
          $liveLog = Get-Content (Join-Path $runtime 'KaiLiveTestLog.cs') -Raw
          if ($liveLog -notmatch 'KaiTOR-LiveTest\.log') { throw 'Unified live-test log filename contract missing.' }
          foreach ($token in @('OnGameLoadedEvent','OnSaveStartedEvent','OnSaveOverEvent','WriteSnapshot')) {
            if (-not $liveTest.Contains($token)) { throw "Live-test lifecycle contract missing: $token" }
          }
          $runtimeLog = Get-Content (Join-Path $runtime 'KaiRuntimeLog.cs') -Raw
          $populationLog = Get-Content (Join-Path $runtime 'KaiPopulationLog.cs') -Raw
          $mercyLog = Get-Content (Join-Path $runtime 'KaiMercyRelationBehavior.cs') -Raw
          if (-not $runtimeLog.Contains('KaiLiveTestLog.Write')) { throw 'Runtime events are not mirrored to unified live-test log.' }
          if (-not $populationLog.Contains('KaiLiveTestLog.Write')) { throw 'Population events are not mirrored to unified live-test log.' }
          if (-not $mercyLog.Contains('relationBefore') -or -not $mercyLog.Contains('relationAfter')) {
            throw 'Mercy relation before/after live-test diagnostics missing.'
          }

          Write-Host "KaiTOR unified live-test logging contract: PASS"
          Write-Host "KaiTOR Diplomacy/Co-op UI isolation contract: PASS"
          Write-Host "KaiTOR v0.6.4 compile + safety contracts: PASS"

      - name: Assemble test module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/KaiTORDiplomacy'
          $package = 'artifact/KaiTOR_Diplomacy'
          $bin = Join-Path $package 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item (Join-Path $root 'module/*') $package -Recurse -Force
          # The old standalone KaiTOR diplomacy Gauntlet screen is deliberately not
          # distributed. Native Kingdom Diplomacy now owns the entire player-facing
          # diplomatic flow, which prevents the clipped fifth action and its crash path.
          Remove-Item (Join-Path $package 'GUI/Prefabs/KaiTORDiplomacyHubUIMovie.xml') -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.dll') (Join-Path $bin 'KaiTOR_Diplomacy.dll') -Force
          $pdb = Join-Path $root 'build/bin/Win64_Shipping_Client/KaiTOR_Diplomacy.pdb'
          if (Test-Path $pdb) { Copy-Item $pdb (Join-Path $bin 'KaiTOR_Diplomacy.pdb') -Force }

      - name: Upload test module
        uses: actions/upload-artifact@v4
        with:
          name: KaiTOR-Diplomacy-v0.6.4-${{ github.ref_name }}
          path: artifact/KaiTOR_Diplomacy
          if-no-files-found: error
          retention-days: 30
