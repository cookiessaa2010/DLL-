name: KaiTOR Online Bootstrap Artifact Contract

on:
  workflow_run:
    workflows:
      - KaiTOR Online 1.3.15 Coop Backport Build
    types:
      - completed
  push:
    branches:
      - kaitor-online-4p
    paths:
      - '.github/workflows/kaitor-online-bootstrap-artifact-contract.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-bootstrap-artifact:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'kaitor-online-4p')
    runs-on: windows-latest

    steps:
      - name: Resolve full-build run
        id: run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_run') {
            $runId = $env:EVENT_RUN_ID
          }
          else {
            $runId = gh run list `
              --repo $env:GITHUB_REPOSITORY `
              --workflow 'kaitor-online-1315-coopcore-build.yml' `
              --branch 'kaitor-online-4p' `
              --status success `
              --limit 1 `
              --json databaseId `
              --jq '.[0].databaseId'
          }

          if (-not $runId) { throw 'No successful KaiTOR full-build run is available for artifact validation.' }
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          Write-Host "Validating bootstrap artifact from full-build run $runId"

      - name: Download bootstrap artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          gh run download $env:RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name 'KaiTOROnline-0.0.1-bootstrap-Bannerlord-1.3.15.110062' `
            --dir artifact

      - name: Validate packaged shared-map and TOR runtime contract
        shell: pwsh
        run: |
          function Test-ByteSequence {
            param(
              [byte[]]$Haystack,
              [byte[]]$Needle
            )

            if ($Needle.Length -eq 0 -or $Haystack.Length -lt $Needle.Length) { return $false }
            for ($i = 0; $i -le ($Haystack.Length - $Needle.Length); $i++) {
              $match = $true
              for ($j = 0; $j -lt $Needle.Length; $j++) {
                if ($Haystack[$i + $j] -ne $Needle[$j]) {
                  $match = $false
                  break
                }
              }
              if ($match) { return $true }
            }
            return $false
          }

          $coopCore = Resolve-Path './artifact/Modules/Coop/bin/Win64_Shipping_Client/Coop.Core.dll'
          $bytes = [IO.File]::ReadAllBytes($coopCore)

          foreach ($marker in @('snapshot4p', 'KAITOR_4P_SNAPSHOT_JSON=')) {
            $utf16Needle = [Text.Encoding]::Unicode.GetBytes($marker)
            if (-not (Test-ByteSequence -Haystack $bytes -Needle $utf16Needle)) {
              throw "Packaged Coop.Core.dll is missing required shared-map diagnostic marker: $marker"
            }
          }

          foreach ($runtimeFile in @(
            'Export-KaiTORFourPlayerSnapshot.ps1',
            'Test-KaiTORFourPlayerSnapshot.ps1',
            'Test-KaiTORFourPlayerMovement.ps1',
            'Test-KaiTORFourPlayerLifecycle.ps1',
            'Test-KaiTORRuntimePreflight.ps1',
            'Start-KaiTORCampaignServer.ps1',
            'Test-KaiTORTorCompatibility.ps1',
            'Test-KaiTORTorRuntimeLog.ps1',
            'Test-KaiTORTorFourPlayerRuntime.ps1',
            'Invoke-KaiTORTorLiveAcceptance.ps1',
            'Capture-KaiTORTorLiveSession.ps1',
            'Start-KaiTORTorCampaignServer.ps1',
            'modules.vanilla-1.3.15.txt',
            'modules.tor-1.3.15.txt',
            'TOR_RUNTIME_CONTRACT.txt'
          )) {
            $path = Join-Path './artifact/Runtime' $runtimeFile
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Bootstrap artifact is missing required runtime file: $runtimeFile"
            }
          }

          $build = Get-Content './artifact/BUILD.txt' -Raw
          if ($build -notmatch 'Admission limit:\s*4 simultaneous players') {
            throw 'Bootstrap BUILD.txt no longer records the tested 4-player admission contract.'
          }
          if ($build -notmatch 'Bannerlord 1\.3\.15\.110062') {
            throw 'Bootstrap BUILD.txt target version drifted from Bannerlord 1.3.15.110062.'
          }

          $torContract = Get-Content './artifact/Runtime/TOR_RUNTIME_CONTRACT.txt' -Raw
          foreach ($requiredTorMarker in @(
            'The Old Realms 1\.3\.15',
            'Admission limit:\s*4 simultaneous players',
            'Bannerlord\.exe /singleplayer /server',
            'DedicatedServerType=none',
            'TOR_Core \+ Coop load evidence',
            'four independent persistent controller/Hero/Clan/MobileParty/CharacterObject graphs',
            'all four authoritative MobileParty'
          )) {
            if ($torContract -notmatch $requiredTorMarker) {
              throw "Packaged TOR runtime contract is missing required marker: $requiredTorMarker"
            }
          }

          Write-Host 'PASS: packaged bootstrap contains TOR live-capture/acceptance tooling, 4P shared-map diagnostics, exact Bannerlord/TOR targets, and the tested 4-player contract.'

      - name: Smoke-test packaged TOR live acceptance runner
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'kaitor-packaged-runtime-smoke'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          @'
          [Module] TOR_Core initialized
          Loaded managed assembly TOR_Core.dll
          [Module] Coop initialized
          Loaded managed assembly Coop.Core.dll
          Campaign server ready
          '@ | Set-Content -LiteralPath (Join-Path $root 'runtime.log') -Encoding UTF8

          function New-Player {
            param([string]$Id, [double]$X, [double]$Y)
            [pscustomobject]@{
              controllerId = "controller-$Id"
              heroId = "hero-$Id"
              mobilePartyId = "party-$Id"
              clanId = "clan-$Id"
              characterObjectId = "character-$Id"
              connected = $true
              partyResolved = $true
              partyActive = $true
              mapEventId = ''
              positionX = $X
              positionY = $Y
            }
          }

          $before = [pscustomobject]@{
            activeAdmissionSlots = 4
            playerRegistryCount = 4
            players = @(
              New-Player A 10.0 10.0
              New-Player B 20.0 20.0
              New-Player C 30.0 30.0
              New-Player D 40.0 40.0
            )
          }
          $after = [pscustomobject]@{
            activeAdmissionSlots = 4
            playerRegistryCount = 4
            players = @(
              New-Player A 11.0 10.0
              New-Player B 20.0 21.5
              New-Player C 28.0 31.0
              New-Player D 42.5 38.0
            )
          }

          "server> KAITOR_4P_SNAPSHOT_JSON=$($before | ConvertTo-Json -Depth 8 -Compress)" |
            Set-Content -LiteralPath (Join-Path $root 'before-command.log') -Encoding UTF8
          "server> KAITOR_4P_SNAPSHOT_JSON=$($after | ConvertTo-Json -Depth 8 -Compress)" |
            Set-Content -LiteralPath (Join-Path $root 'after-command.log') -Encoding UTF8

          & './artifact/Runtime/Invoke-KaiTORTorLiveAcceptance.ps1' `
            -RuntimeLogPath (Join-Path $root 'runtime.log') `
            -BeforeCommandOutputPath (Join-Path $root 'before-command.log') `
            -AfterCommandOutputPath (Join-Path $root 'after-command.log') `
            -OutputDirectory (Join-Path $root 'accepted')

          foreach ($outputFile in @('snapshot-before.json', 'snapshot-after.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root "accepted/$outputFile") -PathType Leaf)) {
              throw "Packaged TOR live acceptance runner did not produce $outputFile"
            }
          }

          Write-Host 'PASS: packaged TOR live acceptance runner executes successfully with its packaged sibling validators.'

      - name: Smoke-test packaged TOR live capture helper
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'kaitor-packaged-capture-smoke'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          @'
          Module TOR_Core loaded
          Module Coop loaded
          '@ | Set-Content -LiteralPath (Join-Path $root 'runtime.log') -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $root 'server-output.log') -Value 'server ready' -Encoding UTF8

          function New-Player {
            param([string]$Id, [double]$X, [double]$Y)
            [pscustomobject]@{
              controllerId = "controller-$Id"
              heroId = "hero-$Id"
              mobilePartyId = "party-$Id"
              clanId = "clan-$Id"
              characterObjectId = "character-$Id"
              connected = $true
              partyResolved = $true
              partyActive = $true
              mapEventId = ''
              positionX = $X
              positionY = $Y
            }
          }

          $before = [pscustomobject]@{
            activeAdmissionSlots = 4
            playerRegistryCount = 4
            players = @(
              New-Player A 10 10
              New-Player B 20 20
              New-Player C 30 30
              New-Player D 40 40
            )
          }
          $after = [pscustomobject]@{
            activeAdmissionSlots = 4
            playerRegistryCount = 4
            players = @(
              New-Player A 11 10
              New-Player B 20 22
              New-Player C 28 31
              New-Player D 43 38
            )
          }

          $beforeLine = "KAITOR_4P_SNAPSHOT_JSON=$($before | ConvertTo-Json -Depth 8 -Compress)"
          $afterLine = "KAITOR_4P_SNAPSHOT_JSON=$($after | ConvertTo-Json -Depth 8 -Compress)"
          Set-Content -LiteralPath (Join-Path $root 'before-line.txt') -Value $beforeLine -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $root 'after-line.txt') -Value $afterLine -Encoding UTF8

          $job = Start-Job -ScriptBlock {
            param($Output,$Before,$After)
            Start-Sleep -Milliseconds 500
            Get-Content -LiteralPath $Before | Add-Content -LiteralPath $Output
            Start-Sleep -Milliseconds 200
            Get-Content -LiteralPath $After | Add-Content -LiteralPath $Output
          } -ArgumentList (Join-Path $root 'server-output.log'),(Join-Path $root 'before-line.txt'),(Join-Path $root 'after-line.txt')

          try {
            & './artifact/Runtime/Capture-KaiTORTorLiveSession.ps1' `
              -RuntimeLogPath (Join-Path $root 'runtime.log') `
              -CommandOutputPath (Join-Path $root 'server-output.log') `
              -OutputDirectory (Join-Path $root 'captured') `
              -TimeoutSeconds 10 `
              -PollMilliseconds 100
          }
          finally {
            Wait-Job $job | Out-Null
            Receive-Job $job | Out-Host
            Remove-Job $job -Force
          }

          foreach ($outputFile in @('snapshot-command-before.txt','snapshot-command-after.txt','snapshot-before.json','snapshot-after.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root "captured/$outputFile") -PathType Leaf)) {
              throw "Packaged live capture helper did not produce $outputFile"
            }
          }

          Set-Content -LiteralPath (Join-Path $root 'timeout-output.log') -Value 'server ready' -Encoding UTF8
          $rejected = $false
          try {
            & './artifact/Runtime/Capture-KaiTORTorLiveSession.ps1' `
              -RuntimeLogPath (Join-Path $root 'runtime.log') `
              -CommandOutputPath (Join-Path $root 'timeout-output.log') `
              -OutputDirectory (Join-Path $root 'timeout') `
              -TimeoutSeconds 1 `
              -PollMilliseconds 100
          }
          catch {
            $rejected = $true
            Write-Host "Expected packaged capture timeout: $($_.Exception.Message)"
          }
          if (-not $rejected) {
            throw 'Packaged live capture helper accepted a session without any snapshot output.'
          }

          Write-Host 'PASS: packaged TOR live capture helper handles sequential snapshots and rejects timeout.'
